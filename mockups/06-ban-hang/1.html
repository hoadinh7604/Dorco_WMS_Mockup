<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DorcoWMS - Giao hàng (mockup To-be)</title>
<style>

/* DorcoWMS mockup shared theme */
* { box-sizing: border-box; }
body { margin: 0; font-family: "IBM Plex Sans", "Noto Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; color: #0d121c; background: #f8fafc; }

.app-shell { display: flex; min-height: 100vh; width: 100%; }

/* Sidebar */
:root{ --rail-bg:#10141b; --rail-ink:#aab2bf; --rail-pill:#232a22; --rail-active-bg:#b7e233; --rail-active-ink:#1c2e05; }
/* ---------- nav zone (logo + rail + submenu, one dark block) ---------- */
.navzone{width:274px;flex:none;background:var(--rail-bg);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;overflow:hidden}
.navlogo{background:#ffffff;margin:12px;padding:12px 14px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:9px;flex:none}
.navlogo .mark{width:24px;height:24px;flex:none;display:flex;align-items:center;justify-content:center;color:#2563eb}
.navlogo span{font-weight:800;font-size:17px;color:#1f2937;letter-spacing:-.01em}
.navlogo span b{color:#2563eb}
.navbody{display:flex;flex:1;min-height:0}
.rail{width:64px;flex:none;display:flex;flex-direction:column;align-items:center;padding:6px 0 10px;gap:2px}
.rail-item{width:56px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 2px 9px;border-radius:10px;cursor:pointer}
.rail-item .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--rail-ink)}
.rail-item .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rail-item span{font-size:9.5px;color:var(--rail-ink);text-align:center;line-height:1.2}
.rail-item.active .ic{background:var(--rail-active-bg);color:var(--rail-active-ink)}
.rail-item.active span{color:#fff;font-weight:600}
.subnav{flex:1;padding:14px 10px}
.subnav h2{font-size:13px;font-weight:700;margin:4px 6px 10px;color:#fff}
.subnav a{display:block;padding:10px 14px;border-radius:10px;font-size:13px;color:var(--rail-ink);text-decoration:none;margin-bottom:6px;cursor:pointer;font-weight:600;background:var(--rail-pill)}
.subnav a.active{background:var(--rail-active-bg);color:var(--rail-active-ink)}

/* Main column */
.main-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; }

/* Topbar */
.topbar { height: 56px; flex: 0 0 56px; background: #fff; border-bottom: 1px solid #ebf0f4; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.breadcrumb { font-size: 13px; color: #6b7280; }
.breadcrumb b { color: #1f2937; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: #d7dde7; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #4b5563; }

/* Content */
.content { flex: 1 1 auto; padding: 20px 24px 40px; overflow-x: auto; background: #f8fafc; }
.page-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 12px; }
.page-title { font-size: 20px; font-weight: 700; color: #0d121c; margin: 0; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid #ebf0f4; margin-bottom: 16px; }
.tab { padding: 10px 18px; font-size: 14px; font-weight: 600; color: #67707f; border-bottom: 2px solid transparent; cursor: pointer; }
.tab.active { color: #0d121c; font-weight: 700; border-bottom-color: #0d121c; }

/* Card / filter bar */
.card { background: #fff; border: 1px solid #ebf0f4; border-radius: 6px; }
.filter-bar { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: 14px 16px; margin-bottom: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.filter-grid .field input, .filter-grid .field select { min-width: 0; width: 100%; }
.field label { font-size: 12px; color: #6b7280; font-weight: 600; }
.field select, .field input { height: 32px; border: 1px solid #e3e8ef; border-radius: 6px; padding: 0 10px; font-size: 14px; background: #fff; color: #0d121c; }
.field label { color: #67707f; font-weight: 500; font-size: 13px; }
.filter-spacer { flex: 1 1 auto; }

/* Buttons */
.btn { height: 32px; padding: 0 14px; border-radius: 6px; font-size: 14px; font-weight: 500; border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
.btn-primary { background: #c8fb5b; color: #1c3102; }
.btn-primary:hover { background: #bcf141; }
.btn-secondary { background: #fff; color: #0d121c; border-color: #e3e8ef; }
.btn-secondary:hover { background: #f8fafc; }
.btn-success { background: #c8fb5b; color: #1c3102; }
.btn-sm { height: 28px; padding: 0 10px; font-size: 13px; }
.btn-link { background: transparent; color: #0d121c; border: none; padding: 0 6px; font-size: 13px; font-weight: 600; text-decoration: underline; }

/* Table */
.table-wrap { overflow-x: auto; }
table.grid { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 920px; }
table.grid th { background: #f8fafc; color: #0d121c; font-weight: 600; text-align: left; padding: 10px 10px; border-bottom: 1px solid #ebf0f4; white-space: nowrap; }
table.grid td { padding: 9px 10px; border-bottom: 1px solid #ebf0f4; color: #0d121c; white-space: nowrap; }
table.grid tr:hover td { background: #f8fafc; }
table.grid th.new-col, table.grid td.new-col { background: #fff7e6; }
table.grid th.new-col { color: #92610b; }

.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 500; border: 1px solid transparent; }
.badge-new { background: #fde68a; color: #92400e; }
.badge-wait { background: #fef3c7; color: #92400e; }
.badge-done { background: #ecfdf3; color: #067647; border-color: #abefc6; }
.badge-sync { background: #dbeafe; color: #1e40af; }

.legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #92610b; background: #fff7e6; border: 1px solid #fde68a; border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; }
.legend .dot { width: 10px; height: 10px; border-radius: 3px; background: #fde68a; border: 1px solid #f3c74b; }

.pagination { display: flex; align-items: center; justify-content: flex-end; gap: 6px; padding: 12px 16px; font-size: 12px; color: #6b7280; }
.page-btn { width: 26px; height: 26px; border-radius: 6px; border: 1px solid #d5dae3; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.page-btn.active { background: #c8fb5b; color: #1c3102; border-color: #c8fb5b; }

/* Real-UI page shell (list screens) */
.wms-page { min-height: 100vh; background: #f3f5f8; }
.wms-topbar { height: 48px; background: #fff; border-bottom: 1px solid #ebf0f4; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
.wms-tab-chip { font-size: 13px; color: #374151; background: #f3f5f8; border: 1px solid #e3e7ee; border-radius: 6px 6px 0 0; padding: 8px 14px; display: flex; align-items: center; gap: 10px; }
.chip-x { color: #9ca3af; font-size: 12px; }
.lang-select { font-size: 13px; color: #374151; }
.icon-btn { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #4b5563; border: 1px solid #e3e7ee; background: #fff; font-size: 13px; }

.stat-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; margin: 18px 0 20px; }
.stat-card { background: #fff; border: 1px solid #ebf0f4; border-radius: 6px; padding: 16px; }
.stat-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.stat-label { font-size: 13px; color: #6b7280; }
.stat-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.icon-blue { background: #e6f4ff; color: #1677ff; }
.icon-amber { background: #fef3c7; color: #b45309; }
.icon-green { background: #ecfdf3; color: #067647; }
.icon-teal { background: #ccfbf1; color: #0d9488; }
.icon-purple { background: #ede9fe; color: #7c3aed; }
.stat-value { font-size: 26px; font-weight: 700; color: #0d121c; }

.filter-card { padding: 0; margin-bottom: 16px; }
.filter-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #ebf0f4; }
.filter-title { font-size: 14px; font-weight: 700; color: #0d121c; }
.filter-head-actions { display: flex; align-items: center; gap: 10px; }
.btn-find { background: #f8ffe5; color: #0d121c; border-color: #c8fb5b; }
.chevron { color: #9ca3af; font-size: 13px; }
.filter-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 16px; padding: 16px; }

.tab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: #eef1f5; color: #67707f; font-size: 12px; font-weight: 600; margin-left: 6px; }
.tab-count.active { background: #c8fb5b; color: #1c3102; }

.table-toolbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
.result-count { font-size: 13px; color: #6b7280; }
.col-checkbox { width: 36px; text-align: center; }
.row-expand { color: #9ca3af; font-size: 13px; }
.sort { color: #9ca3af; font-size: 11px; }
.colmenu { color: #c3c9d3; font-size: 12px; margin-left: 2px; }
.progress { width: 100px; height: 6px; border-radius: 999px; background: #e5e7eb; overflow: hidden; }
.progress-fill { height: 100%; background: #12b76a; }
.badge-submitted { background: #e6f4ff; color: #1677ff; border-color: #91caff; }
.badge-saved { background: #f8fafc; color: #0d121c; border-color: #ebf0f4; }
.badge-closed { background: #ecfdf3; color: #067647; border-color: #abefc6; }
.badge-src-sap { background: #f4f3ff; color: #5925dc; border-color: #d9d6fe; }
.badge-src-wms { background: #f8fafc; color: #67707f; border-color: #ebf0f4; }
.chip-map { display: inline-flex; align-items: center; background: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; border-radius: 6px; padding: 3px 10px; font-size: 12px; font-weight: 600; }

.section-title { font-size: 14px; font-weight: 700; color: #0d121c; margin: 18px 0 10px; }
.info-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; padding: 16px; }
.info-grid .field { min-width: 0; }
.modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 16px; border-top: 1px solid #e3e7ee; }

/* single-file router */
.view { display: none; }
.view.active { display: block; }
a.nav-link { cursor: pointer; color: #0d121c; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #c3cad3; }
a.nav-link:hover { text-decoration-color: #0d121c; }
a.nav-link:hover { color: #000; }
.btn-disabled { background: #f3f4f6; color: #9ca3af; border-color: #e5e7eb; cursor: not-allowed; }
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 20px; text-align: center; }
.empty-state .empty-icon { width: 56px; height: 56px; border-radius: 50%; background: #eef1f5; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 14px; }
.empty-state .empty-title { font-size: 14px; font-weight: 700; color: #374151; margin-bottom: 4px; }
.empty-state .empty-sub { font-size: 12px; color: #9ca3af; margin-bottom: 16px; max-width: 360px; }
.badge-sync-none { background:#f8fafc; color:#67707f; border-color:#ebf0f4; }
.badge-sync-ok { background:#ecfdf3; color:#067647; border-color:#abefc6; }
.badge-sync-err { background:#fef3f2; color:#b42318; border-color:#fecdca; }
.badge-sync-run { background:#e6f4ff; color:#1677ff; border-color:#91caff; }
.badge-sync-pending { background:#fffaeb; color:#b54708; border-color:#fedf89; }
.badge-cancelled { background:#fffaeb; color:#b54708; border-color:#fedf89; }
.badge-deleted { background:#fef3f2; color:#b42318; border-color:#fecdca; }
.badge-src-so { background:#e0f2fe; color:#0369a1; border:1px solid #bae6fd; }
.act-cell { cursor:pointer; user-select:none; }
.act-cell:hover, .act-cell.open { background:#f1f5f9; border-radius:6px; }
.act-cell.none { cursor:not-allowed; color:#cbd5e1; }
.act-menu { position:absolute; z-index:60; min-width:184px; background:#fff; border:1px solid #e5e7eb; border-radius:10px; box-shadow:0 10px 28px rgba(15,23,42,.14); padding:6px; }
.act-menu button { display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border:0; background:none; border-radius:6px; font:inherit; font-size:13px; color:#111827; text-align:left; cursor:pointer; }
.act-menu button:hover, .act-menu button:focus-visible { background:#f3f4f6; outline:none; }
.act-menu button.danger { color:#b91c1c; }
.act-menu button.warn { color:#92400e; }
.act-menu button svg { width:15px; height:15px; flex:none; }
.act-menu .act-hint { font-size:11px; color:#6b7280; padding:2px 10px 6px 35px; margin-top:-6px; }
.act-menu hr { border:0; border-top:1px solid #eef0f4; margin:4px 2px; }

.sync-err { font-size:11px; color:#b91c1c; margin-top:3px; white-space:normal; max-width:220px; }
.spin { display:inline-block; animation:spin 1s linear infinite; margin-right:3px; }
@keyframes spin { to { transform:rotate(360deg); } }
.btn:disabled { opacity:.5; cursor:not-allowed; }
#toast { position:fixed; top:18px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 16px; border-radius:8px; font-size:13px; display:none; z-index:99; }
.more-chip { display:inline-block; margin-left:4px; padding:0 6px; border-radius:10px; background:#eef2ff; color:#3730a3; font-size:11px; font-weight:600; cursor:help; }
.new-mark { outline:2px dashed #f59e0b; outline-offset:2px; border-radius:6px; }

/* ---- bổ sung cho màn Giao hàng ---- */
.scan-box { display:flex; gap:10px; align-items:center; padding:14px 16px; background:#f8fafc; border:1px solid #e3e7ee; border-radius:10px; }
.scan-box input { flex:1; height:40px; border:1px solid #d5dae3; border-radius:8px; padding:0 12px; font-size:15px; font-weight:600; }
.sim-row { display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-top:10px; }
.sim-row b { font-size:12px; color:#6b7280; font-weight:600; }
.sim-btn { border:1px dashed #d5dae3; background:#fff; border-radius:999px; padding:4px 11px; font-size:12px; font-family:ui-monospace,Menlo,monospace; cursor:pointer; color:#374151; }
.sim-btn:hover { border-style:solid; border-color:#2563eb; color:#2563eb; }
.note { display:flex; gap:9px; align-items:flex-start; padding:10px 13px; border-radius:8px; font-size:13px; margin:12px 0; }
.note-bad { background:#fee2e2; color:#991b1b; }
.note-ok { background:#dcfce7; color:#166534; }
.note-warn { background:#fef3c7; color:#92400e; }
.tem-chip { display:inline-flex; align-items:center; gap:6px; background:#f3f4f6; border:1px solid #e5e7eb; border-radius:6px; padding:2px 4px 2px 8px; font-size:11.5px; font-family:ui-monospace,Menlo,monospace; margin:2px 3px 2px 0; }
.tem-chip b { font-family:inherit; font-weight:700; }
.tem-chip .tem-q { width:62px; border:1px solid #d7dde7; border-radius:5px; padding:1px 5px; font:600 11.5px ui-monospace,Menlo,monospace; color:#0d121c; text-align:right; background:#fff; }
.tem-chip small { color:#67707f; font-size:10.5px; font-family:inherit; }
.tem-chip button { border:0; background:none; cursor:pointer; color:#9ca3af; font-size:13px; line-height:1; padding:2px 4px; border-radius:4px; }
.tem-chip button:hover { background:#e5e7eb; color:#b91c1c; }
.scrim { position:fixed; inset:0; background:rgba(17,24,39,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:80; }
.scrim.on { display:flex; }
.modal-box { background:#fff; border-radius:12px; width:min(960px,100%); max-height:86vh; display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(15,23,42,.3); position:relative; }
.modal-head { padding:16px 18px 12px; border-bottom:1px solid #e3e7ee; }
.modal-head h4 { margin:0; font-size:16px; color:#111827; }
.modal-head p { margin:4px 0 0; font-size:12.5px; color:#6b7280; }
.modal-body { padding:16px 18px; overflow:auto; }
.modal-x { position:absolute; top:12px; right:14px; border:0; background:none; font-size:20px; color:#9ca3af; cursor:pointer; }
.hint { font-size:12px; color:#6b7280; margin:10px 0 0; }
.expbtn { width:18px; height:18px; margin-right:6px; border:1px solid #d5dae3; background:#fff; border-radius:4px; color:#6b7280; font-size:12px; line-height:1; cursor:pointer; padding:0; vertical-align:middle; }
.expbtn:hover { border-color:#2563eb; color:#2563eb; }
.expbtn-sp { display:inline-block; width:24px; }
table.grid tr.subrow:hover td { background:#f8fafc; }
.mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
table.grid td.blank { color:#cbd5e1; }
.sub { font-size:11px; color:#9ca3af; }

</style>

let state = {screen:'list', tab:'do', arg:null, dotab:'main', cart:[], seeded:false, msg:null, nd:{cust:'',wh:'',rows:[]}, open:{}};

function toast(t){ const el=$('#toast'); el.textContent=t; el.style.display='block'; clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',2600); }
function openModal(h){ $('#modal').innerHTML=h; $('#scrim').classList.add('on'); }
function closeModal(){ $('#scrim').classList.remove('on'); }
function go(screen, arg){
  if(screen==='newdo') state.nd={cust:'',wh:'',rows:[]};
  if(screen==='do') state.dotab='main';
  if(screen==='build' && !arg){ state.cart=[]; state.seeded=true; }
  state.screen=screen; state.arg=arg; state.msg=null; render(); scrollTo(0,0);
}

/* kebab */
let menuEl=null;
function killMenu(){ if(menuEl){ menuEl.remove(); menuEl=null; } document.querySelectorAll('.act-cell.open').forEach(e=>e.classList.remove('open')); }
function showMenu(cell, items){
  killMenu(); cell.classList.add('open');
  const m=document.createElement('div'); m.className='act-menu';
  m.innerHTML = items.map(i=> i==='-' ? '<hr>' :
    `<button data-a="${i.a||''}" class="${i.cls||''}" ${i.off?'disabled':''}>${esc(i.t)}</button>`).join('');
  document.body.appendChild(m);
  const r=cell.getBoundingClientRect();
  m.style.top = Math.min(r.bottom+4, innerHeight-m.offsetHeight-10)+'px';
  m.style.left = Math.max(10, r.right-m.offsetWidth)+'px';
  m.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b||b.disabled) return; killMenu(); act(b.dataset.a); });
  menuEl=m;
}
document.addEventListener('click', e=>{ if(menuEl && !menuEl.contains(e.target) && !e.target.closest('.act-cell')) killMenu(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ killMenu(); closeModal(); } });

function act(a){
  if(!a) return;
  const i=a.indexOf(':'), cmd=i<0?a:a.slice(0,i), arg=i<0?'':a.slice(i+1);
  if(cmd==='openDO')   return go('do', arg);
  if(cmd==='openSlip') return go('slip', arg);
  if(cmd==='build'){ state.cart=[]; state.seeded=false; return go('build', arg); }
  if(cmd==='resync')   return toast('Đã gửi lại kết quả sang SAP — phiếu chuyển Đang đồng bộ');
  if(cmd==='cancel')   return cancelModal(arg);
  if(cmd==='cxlok'){ closeModal(); return toast(`Đã hủy phiếu ${arg} — SL đã cộng lại về các tem của phiếu`); }
  if(cmd==='amend')    return toast('Amend: chỉ sửa Ghi chú, remark dòng và xoá dòng');
  toast('Thao tác mẫu: '+cmd);
}

/* GH2: xét trạng thái trước, rồi mới xét nguồn.
   Đã đóng và Đã xoá chỉ còn Xem · In DO — không tạo phiếu từ DO nữa. */
function menuDO(d){
  const see={t:'Xem', a:'openDO:'+d.id};
  if(d.st==='closed'||d.st==='del') return [see,{t:'In DO'}];
  if(d.st==='save') return d.src==='sap' ? [see,{t:'In DO'}] : [see,{t:'Sửa'},{t:'Trình'},{t:'In DO'}];
  if(d.st==='sub')  return [see,{t:'Tạo phiếu từ DO này',a:'build:'+d.id},{t:'In DO'}];
  return [see,{t:'In DO'}];
}
function menuSlip(s){
  const see={t:'Xem', a:'openSlip:'+s.id};
  if(s.st==='save') return [see,{t:'Sửa'},{t:'Trình'},'-',{t:'Xoá',cls:'danger'}];
  if(s.st==='sub')  return [see,{t:'Sửa (Amend)',a:'amend'},{t:'Phê duyệt'}];
  if(s.st==='appr'){
    const m=[see];
    /* điểm 7: Đồng bộ lại SAP chỉ bật khi Chưa đồng bộ hoặc Đồng bộ lỗi */
    if(s.sync==='none'||s.sync==='err') m.push({t:'Đồng bộ lại SAP',a:'resync',cls:'warn'});
    /* GH12: phiếu Đang đồng bộ thì ẩn hẳn Hủy phiếu, không để mờ */
    if(s.sync!=='ing'){ m.push('-'); m.push({t:'Hủy phiếu',a:'cancel:'+s.id,cls:'danger'}); }
    return m;
  }
  return [see,{t:'Sửa'}];
}

function doScan(code){
  code=(code||'').trim().toUpperCase(); if(!code) return;
  const t = TEMS.find(x=>x.id===code);
  if(!t){ state.msg={k:'bad',t:`Không tìm thấy tem <b>${esc(code)}</b> trong hệ thống.`}; return render(); }
  if(t.flag==='out'){ state.msg={k:'bad',t:`Tem <b>${t.id}</b> ${esc(t.note||'đã xuất hết')} — không còn hàng để giao.`}; return render(); }
  if(t.flag==='held'){ state.msg={k:'bad',t:`Tem <b>${t.id}</b> không còn SL khả dụng — ${esc(t.note||'đang bị phiếu khác giữ')}.`}; return render(); }
  /* GH9: quét lại tem đã có trong phiếu thì chặn, không nhận lần quét này */
  if(state.cart.some(c=>c.tems.some(x=>x.id===t.id))){
    state.msg={k:'bad',t:`Tem <b>${t.id}</b> đã quét rồi, đang nằm trong phiếu này — mỗi tem chỉ quét một lần (X08). Sửa SL ngay trên dòng hoặc bỏ tem rồi quét lại.`};
    return render();
  }
  /* tầng 1 — tem đã gán vào dòng lúc tạo lệnh: chỉ vào đúng dòng đó, không xét SO.
     tầng 2 — tem chưa gán: khóa mã hàng + Vina SO + ĐVT, dòng phải có Vina SO. */
  let cand;
  if(t.gan){
    cand = state.cart.filter(c=>c.doId===t.gan.doId && c.item===t.gan.item);
    if(!cand.length){
      state.msg={k:'bad', t:`Tem <b>${t.id}</b> đã được gán cho <b>${t.gan.doId} · Item ${t.gan.item}</b> lúc tạo lệnh, không dùng cho dòng khác. Chọn dòng đó ở bước 1 rồi quét lại.`};
      return render();
    }
  } else {
    cand = state.cart.filter(c=>c.code===t.code && !!c.so && c.so===t.so && c.uom===t.uom);
    if(!cand.length){
      const same = state.cart.find(c=>c.code===t.code);
      const noSo = state.cart.find(c=>c.code===t.code && !c.so);
      state.msg={k:'bad', t: noSo
        ? `Dòng <b>${noSo.doId} · Item ${noSo.item}</b> không có Vina SO nên chỉ nhận tem đã gán sẵn lúc tạo lệnh. Tem <b>${t.id}</b> chưa được gán cho dòng nào.`
        : same
        ? `Tem <b>${t.id}</b> thuộc Vina SO <b>${t.so}</b>, không khớp SO nào đang giao — xuất đích danh theo SO nên bị chặn (X17).`
        : `Tem <b>${t.id}</b> (mã hàng ${t.code}) không khớp dòng nào trong phiếu (X06).`};
      return render();
    }
  }
  const line = cand.find(c=>c.tems.reduce((s,x)=>s+x.q,0) < c.need);
  if(!line){ state.msg={k:'warn',t:`Các dòng của ${t.so} đã gán đủ SL — tem <b>${t.id}</b> không cần nữa (X03).`}; return render(); }
  const got = line.tems.reduce((s,x)=>s+x.q,0), q = Math.min(t.avail, line.need-got);
  line.tems.push({id:t.id, q});
  state.msg={k:'ok', t:`Đã gán <b>${t.id}</b> — lấy <b>${q} ${t.uom}</b> tại ${t.wh}/${t.bin}.`
    + (q<t.avail?` Còn ${t.avail-q} trên tem, vẫn nằm ở pallet đó.`:'')
    + (t.note?` (${t.note})`:'')};
  render();
}

    </tr>`).join(''):'<tr><td colspan="21" style="padding:30px;text-align:center;color:#9ca3af">Phiếu chưa có dòng hàng</td></tr>'}
    </tbody></table></div>
  </div>`;
  return shell(`Phiếu giao hàng ${esc(s.id)}`, body);
}

/* popup của dòng lệnh giao hàng: dựng thẳng từ các tem đã gắn vào dòng lúc tạo lệnh */
function temData(k){
  if(k.indexOf('gan:')!==0) return TEM_POPUP[k];
  const l = DO_LINES.find(x=>x.k===k.slice(4)) || {};
  return {title:`${esc(l.code||'')} · ${esc(l.name||'')} — tem gắn vào dòng lúc tạo lệnh`,
    rows: temGan(l).map(t=>[t.id, 0, t.rest, t.flag==='out'?'out':'stock', t.bin,
      t.note || 'Chưa có phiếu giao hàng nào lấy từ tem này'])};
}
function temModal(k){
  const d = temData(k);
  if(!d) return toast('Dòng này chưa gắn tem nào');
  if(!d.rows.length) return toast('Dòng này chưa gắn tem nào');
  openModal(`<button class="modal-x" data-close>×</button>
    <div class="modal-head"><h4>Barcode/QR đã ánh xạ</h4><p>${d.title}</p></div>
    <div class="modal-body">
      <div class="field" style="margin-bottom:12px"><input type="text" placeholder="🔍 Tìm Mã vạch/QR"></div>
      <div class="table-wrap"><table class="grid" style="min-width:820px"><thead><tr>
        <th>Mã vạch/QR</th><th>SL lấy từ tem</th><th>SL còn lại</th>
        <th>Trạng thái tem</th><th>Vị trí</th>
        <th>Số PO khách hàng</th><th>Số lô</th><th>Ghi chú</th></tr></thead><tbody>
      ${d.rows.map(r=>`<tr><td><a class="nav-link">${r[0]}</a></td>
        <td>${num(r[1])}</td><td>${num(r[2])}</td>
        <td><span class="badge badge-saved">${esc(TEM_ST[r[3]]||r[3])}</span></td><td>${r[4]}</td>
        <td></td><td></td><td style="white-space:normal">${esc(r[5])}</td></tr>`).join('')}
      </tbody></table></div>
      <p class="hint">Bấm số tem để mở chi tiết và lịch sử tem. Cột Trạng thái tem dùng đúng 6 trạng thái: Đã phát hành · Đã in, chưa giữ chỗ · Đã in, giữ chỗ · Trong kho · Đã xuất hết · Đã hủy.
        Cột SL còn lại là SL thật của tem: phiếu chưa duyệt và phiếu đã hủy thì SL chưa bị trừ. Phần đang bị phiếu khác giữ ghi ở cột Ghi chú, thống nhất với màn quét trên PDA.</p>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-close>Đóng</button></div>`);
}
/* GH11: chỉ cần một tem của phiếu thuộc nhóm bị chặn là chặn hủy cả phiếu.
   Nhóm bị chặn: tem đã nằm trong yêu cầu hoặc phiếu trả hàng, tem đã chuyển sang kho khác,
   tem đã hủy do kiểm kê. Không chia hai nhóm, không hủy một phần. */
const CXL_BLOCK = {
  'GI-2601-00008':[
    {id:'FGL-260104-0051', why:'Đang nằm trong yêu cầu trả hàng <b>RT-2610-00002</b>'},
    {id:'FGL-260104-0061', why:'Đã chuyển sang kho khác: 5003 → 5000'}
  ]
};
const slipTems = id => (SLIP_LINES[id]||[]).reduce((a,r)=>a.concat(((TEM_POPUP[r.tems]||{rows:[]}).rows).map(x=>[x[0],x[1]])),[]);
function cancelModal(id){
  const bl = CXL_BLOCK[id] || [], tems = slipTems(id);
  const body = bl.length
    ? `<div class="note note-bad">⛔<div><b>Không hủy được phiếu ${esc(id)}.</b>
         Phiếu có <b>${bl.length}</b> tem thuộc nhóm bị chặn nên cả phiếu không hủy được — xử lý các chứng từ bên dưới trước rồi hủy lại.</div></div>
       <div class="table-wrap"><table class="grid" style="min-width:700px"><thead><tr>
         <th>Tem gây chặn</th><th>Lý do chặn</th></tr></thead><tbody>

       <div class="table-wrap"><table class="grid" style="min-width:700px"><thead><tr>

    <div class="modal-body">
      ${body}
      <p class="hint">Nhóm bị chặn: tem đã nằm trong yêu cầu hoặc phiếu trả hàng, tem đã chuyển sang kho khác, tem đã hủy do kiểm kê.
        Chỉ cần một tem thuộc nhóm này là chặn hủy cả phiếu — không hủy được một phần.</p>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-close>Đóng</button>
      ${bl.length ? '<button class="btn btn-primary btn-disabled" disabled>Xác nhận hủy</button>'
                  : `<button class="btn btn-primary" data-act="cxlok:${esc(id)}">Xác nhận hủy</button>`}</div>`);
}

/* ======================= render + sự kiện ======================= */
function render(){
  $('#view').innerHTML =
      state.screen==='list'  ? screenList()
    : state.screen==='do'    ? screenDO()
    : state.screen==='newdo' ? screenNewDO()
    : state.screen==='build' ? screenBuild()
    : screenSlip();
  const sc=$('#scan'); if(sc) sc.focus();
}

document.addEventListener('click', e=>{
  const t=e.target;
  const tb=t.closest('[data-tab]');   if(tb){ state.tab=tb.dataset.tab; return render(); }
  const dt=t.closest('[data-dotab]'); if(dt){ state.dotab=dt.dataset.dotab; return render(); }
  const ex=t.closest('[data-exp]');
  if(ex){ const id=ex.dataset.exp; state.open[id]=!state.open[id]; return render(); }
  const g =t.closest('[data-go]');    if(g){ return go(g.dataset.go, g.dataset.id); }
  const k =t.closest('[data-menu]');
  if(k){ const i=+k.dataset.i; return showMenu(k, k.dataset.menu==='do'?menuDO(DO_LIST[i]):menuSlip(SLIPS[i])); }
  const tm=t.closest('[data-tems]');  if(tm) return temModal(tm.dataset.tems);
  if(t.closest('[data-close]')) return closeModal();
  const rm=t.closest('[data-rm]');
  if(rm){ const [kk,id]=rm.dataset.rm.split('|'); const l=state.cart.find(c=>c.k===kk);
    l.tems=l.tems.filter(x=>x.id!==id);
    state.msg={k:'warn',t:`Đã bỏ tem <b>${id}</b> khỏi phiếu — SL trả về khả dụng ngay (X09).`}; return render(); }
  const ndr=t.closest('[data-ndrm]');
  if(ndr){ state.nd.rows=state.nd.rows.filter(r=>r.k!==ndr.dataset.ndrm); return render(); }
  const sim=t.closest('[data-tem]');  if(sim) return doScan(sim.dataset.tem);
  const a=t.closest('[data-act]');
  if(a){
    const v=a.dataset.act;
    if(v==='scan'){ const el=$('#scan'); const val=el.value; el.value=''; return doScan(val); }
    if(v==='ndso') return ndPicker();
    if(v==='ndstock') return toast('Thêm từ tồn kho: giữ nguyên As-is');
    if(v==='ndadd'){
      document.querySelectorAll('[data-ndpick]').forEach(cb=>{
        const r=SO_POOL.find(x=>x.k===cb.dataset.ndpick), has=state.nd.rows.some(x=>x.k===r.k);
        if(cb.checked && !has) state.nd.rows.push({...r});
        if(!cb.checked && has) state.nd.rows=state.nd.rows.filter(x=>x.k!==r.k);
      });
      closeModal(); render(); return toast(`Lệnh giao hàng có ${state.nd.rows.length} dòng`);
    }
    if(v==='ndsave'||v==='ndsubmit'){
      if(!state.nd.cust||!state.nd.wh) return toast('Chọn khách hàng và kho trước');
      if(!state.nd.rows.length) return toast('Thêm ít nhất một dòng hàng');
      return toast(v==='ndsave'?'Đã lưu lệnh giao hàng ở trạng thái Đã lưu':'Đã trình lệnh giao hàng — giờ lập phiếu được');
    }
    if(v==='bsubmit'){
      if(!state.cart.length) return toast('Chọn dòng và gán tem trước khi trình');
      /* GH10: tự bỏ các dòng không có tem ra khỏi phiếu rồi mới trình */
      const empty=state.cart.filter(c=>!c.tems.length);
      if(empty.length===state.cart.length) return toast('Chưa dòng nào có tem — gán tem trước khi trình');
      if(empty.length){
        state.cart=state.cart.filter(c=>c.tems.length);
        state.msg={k:'warn',t:`Đã tự bỏ <b>${empty.length} dòng</b> không có tem khỏi phiếu trước khi trình: `
          +empty.map(c=>`<b>${esc(c.doId)} · Item ${esc(c.item)}</b>`).join(', ')
          +`. Các dòng này vẫn còn trên lệnh giao hàng, lập phiếu sau được.`};
        render();
      }
      const miss=state.cart.filter(c=>c.tems.reduce((s,x)=>s+x.q,0)<c.need);
      return toast((empty.length?`Đã bỏ ${empty.length} dòng không có tem. `:'')
        +(miss.length?`${miss.length} dòng chưa gán đủ SL — vẫn trình được, phần còn lại lập phiếu sau`:'Đã trình phiếu — chờ duyệt trên Web'));
    }
    return act(v);
  }
});
document.addEventListener('change', e=>{
  const q=e.target.closest('[data-q]');
  if(q){
    const [k,id]=q.dataset.q.split('|');
    const c=state.cart.find(x=>x.k===k); if(!c) return;
    const tm=c.tems.find(x=>x.id===id); if(!tm) return;
    const src=TEMS.find(x=>x.id===id)||{avail:tm.q};
    const other=c.tems.reduce((s,x)=>s+(x.id===id?0:x.q),0);
    const max=Math.min(src.avail, c.need-other);
    let v=parseInt(String(q.value).replace(/\D/g,''),10);
    if(!v || v<1) v=1;
    if(v>max){ v=max; state.msg={k:'warn',t:`SL lấy từ tem <b>${id}</b> tối đa <b>${num(max)} ${c.uom}</b> — bằng số nhỏ hơn giữa SL khả dụng của tem và SL còn cần giao của dòng.`}; }
    else state.msg={k:'ok',t:`Tem <b>${id}</b> lấy <b>${num(v)} ${c.uom}</b>.`+(v<src.avail?` Còn ${num(src.avail-v)} trên tem, vẫn nằm ở pallet đó (xuất lẻ).`:'')};
    tm.q=v; return render();
  }
  const nd=e.target.closest('[data-nd]');
  if(nd){ const v=nd.value; state.nd[nd.dataset.nd]=v.startsWith('Chọn')?'':v; return render(); }
  const p=e.target.closest('[data-pick]'); if(!p) return;
  const l=DO_LINES.find(x=>x.k===p.dataset.pick);
  if(p.checked){
    if(!state.cart.some(c=>c.k===l.k)){
      const c={...l, need:remainOf(l), tems:[]};
      state.cart.push(c);
      /* lệnh tạo tại WMS đã gán tem thì tem theo dòng sang phiếu luôn; lệnh SAP chưa có tem, gán tay ở bước 2 */
      let con=c.need;
      temGanFree(l).forEach(t=>{ if(con<=0) return; const q=Math.min(t.avail,con); c.tems.push({id:t.id,q}); con-=q; });
      state.msg = c.tems.length
        ? {k:'ok', t:`Dòng <b>${c.doId} · Item ${c.item}</b> đã có tem gán sẵn từ lúc tạo lệnh — lấy sang phiếu <b>${c.tems.length} tem</b>. Sửa SL hoặc bỏ tem được, và vẫn quét thêm tem khác được.`}
        : {k:'warn', t:`Dòng <b>${c.doId} · Item ${c.item}</b> chưa có tem gán sẵn — quét tem ở bước 2 để gán.`};
    }
  }
  else { state.cart=state.cart.filter(c=>c.k!==l.k); state.msg=null; }
  render();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.id==='scan'){ e.preventDefault(); const v=e.target.value; e.target.value=''; doScan(v); }
});
$('#scrim').addEventListener('click', e=>{ if(e.target.id==='scrim') closeModal(); });
render();

</script>
