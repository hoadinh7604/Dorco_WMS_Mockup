<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiểm kê · DORCO WMS</title>
<style>
:root{--lime:#C8F135;--lime-d:#B5DC2E;--lime-bg:#EEF8C9;--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;--bg:#F8F8F6;--card:#fff;--dark:#0F1A2B;--dark2:#162338;--blue:#2563EB;--new:#2E7D4F;--mod:#C77700;--del:#B3261E}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:13px;color:var(--ink);background:var(--bg)}
#app{display:flex;height:100vh;overflow:hidden}
/* navigation */
.nav{width:300px;flex:none;background:var(--dark);display:flex;flex-direction:column}
.logo{margin:10px 6px 4px;background:#fff;border-radius:6px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#1e56d9;letter-spacing:.2px}
.logo span{color:#0ea5e9}
.navbody{flex:1;display:flex;min-height:0}
.rail{width:86px;flex:none;border-right:1px solid #1f2d44;overflow-y:auto;padding:8px 0}
.rail button{width:100%;background:none;border:0;color:#9fb0c8;padding:9px 4px;font:inherit;font-size:11.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.2}
.rail button .ic{font-size:17px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.rail button.on{color:#fff}
.rail button.on .ic{background:#27401c;color:var(--lime)}
.sub{flex:1;overflow-y:auto;padding:12px 6px}
.sub h5{margin:2px 8px 12px;text-align:center;color:#fff;font-size:14px}
.sub a{display:block;color:#b8c5d9;padding:10px 12px;border-radius:7px;margin:3px 0;cursor:pointer;text-decoration:none;font-size:13.5px}
.sub a:hover{background:var(--dark2)}
.sub a.on{background:var(--lime);color:#111;font-weight:600}
.sub a.dim{opacity:.55}
.sub .grp{color:#8ea0ba;font-size:12px;margin:14px 10px 4px;font-weight:600}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap-reverse;align-items:flex-end;justify-content:space-between;gap:0 12px;padding:0 14px;min-height:58px;background:#fff;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.tab{white-space:nowrap;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:#fafafa;cursor:pointer;color:#4b5563}
.tab.on{background:#fff;font-weight:700;color:#111}
.tab .x{color:#9ca3af;font-size:11px}
.tools{display:flex;gap:10px;align-items:center;padding:8px 0;flex-wrap:wrap;justify-content:flex-end}
.tools label{display:flex;align-items:center;gap:5px;font-size:12px;color:#374151}
.tools select{padding:4px 6px;font-size:12px}
.user{display:flex;align-items:center;gap:8px;font-weight:600}
.user i{width:30px;height:30px;border-radius:50%;background:#E7F7B0;display:flex;align-items:center;justify-content:center;font-style:normal;color:#4d6b00}
.content{flex:1;overflow:auto;padding:10px 16px 0;position:relative}
.page-title{font-size:22px;font-weight:700;margin:4px 0 12px}
.segtabs{display:inline-flex;background:#EEF0F2;border-radius:8px;padding:4px;margin-bottom:12px}
.segtabs button{border:0;background:none;padding:7px 16px;border-radius:6px;font:inherit;cursor:pointer;color:#4b5563}
.segtabs button.on{background:#fff;font-weight:700;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 12px}
.card-hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:17px;font-weight:700;border-bottom:1px solid var(--line)}
.card-hd small{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
.card-bd{padding:12px 14px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.fld label{font-size:12px;color:#4b5563}
.fld .req{color:#dc2626}
input,select,textarea{border:1px solid #d1d5db;border-radius:6px;padding:7px 10px;font:inherit;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #d9f56b;border-color:#9bc400}
input[readonly],input:disabled,select:disabled{background:#F3F4F6;color:#6b7280}
input[type=checkbox],input[type=radio]{width:15px;height:15px;padding:0;accent-color:#7aa800}
.inl{display:flex;gap:6px}
.inl input{flex:1}
.btn{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer;color:#111}
.btn:hover{background:#f9fafb}
.btn.pri{background:var(--lime);border-color:var(--lime-d);font-weight:700}
.btn.pri:hover{background:#bfe72d}
.btn.danger{color:#b91c1c;border-color:#fca5a5}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ico{padding:7px 10px}
.foot-sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin:6px -16px 0;z-index:5}
.foot-sticky .btns{display:flex;gap:10px}
.tbwrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table.tb{width:100%;border-collapse:collapse;min-width:900px}
.tb th{background:#F6F7F5;text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:8px 10px;border-bottom:1px solid #f0f1ef;vertical-align:middle}
.tb tr.sel td{background:var(--lime-bg)}
.tb tr:hover td{background:#fafbf5}
.tb td.num,.tb th.num{text-align:right}
.tb input.q{width:110px;text-align:right}
.tb small{display:block;color:#6b7280;font-size:11px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.chip.blue{background:#E6F0FF;color:#1D4ED8;border-color:#BFD6FF}
.chip.amber{background:#FFF3D6;color:#B45309;border-color:#FBD38D}
.chip.green{background:#E3F7E8;color:#15803D;border-color:#A7E3B6}
.chip.gray{background:#EEF0F2;color:#4B5563;border-color:#D1D5DB}
.chip.red{background:#FDE2E0;color:#B42318;border-color:#F8B4AE}
.chip.ng{background:#FDE2E0;color:#B42318}
.muted{color:var(--muted)}
.ok{color:#15803D;font-weight:700}.bad{color:#B42318;font-weight:700}
.note{border-radius:8px;padding:9px 12px;margin:10px 0 0;font-size:12.5px}
.note.info{background:#EAF3FF;border:1px solid #BFD6FF;color:#1E3A8A}
.note.warn{background:#FFF8E6;border:1px solid #F1DFA8;color:#7A5500}
.note.err{background:#FEECEB;border:1px solid #F5B5B0;color:#8A1F17}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#6b7280;padding:40px 10px;text-align:center}
.empty i{font-size:42px;font-style:normal}
.sumtbl{width:100%;border-collapse:collapse}
.sumtbl td{padding:8px 4px;border-bottom:1px solid #f0f1ef}
.sumtbl td:last-child{text-align:right;font-weight:600}
.segs{display:inline-flex;border:1px solid #d1d5db;border-radius:8px;overflow:hidden;flex-wrap:wrap}
.segs button{border:0;border-right:1px solid #d1d5db;background:#fff;padding:7px 13px;font:inherit;cursor:pointer}
.segs button:last-child{border-right:0}
.segs button.on{background:var(--dark);color:#fff}
.infocard{background:#F4F9E6;border:1px solid #D7E8A0;border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 14px;margin-top:10px}
.infocard div span{display:block;font-size:11px;color:#6b7280}
.infocard div b{font-weight:600}
/* tem preview */
.tem{border:1px solid #94a3b8;border-radius:8px;padding:10px 12px;background:#fff;max-width:360px;margin:6px auto}
.tem .tt{display:flex;justify-content:space-between;border-bottom:1px solid #94a3b8;padding-bottom:4px;margin-bottom:6px;font-weight:700}
.tem .r{display:flex;gap:8px;font-size:12px;line-height:1.6}
.tem .r span:first-child{color:#6b7280;width:96px;flex:none}
.tem .qr{width:78px;height:78px;border:1px dashed #64748b;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#64748b;text-align:center;flex:none}
.tem .q{margin-top:6px;background:#EEF2F7;border-radius:5px;padding:5px 8px;display:flex;justify-content:space-between;font-weight:700}
.sheetpg{width:250px;border:1px solid #94a3b8;background:#fff;padding:7px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:78px;gap:5px}
.sheetpg div{border:1px dashed #94a3b8;border-radius:4px;font-size:10px;padding:3px 4px;overflow:hidden;line-height:1.3}
.sheetpg div.e{color:#cbd5e1}
.pages{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #b9c6d8;border-radius:10px;padding:22px;background:#fafbfd;cursor:pointer;color:#4b5563;text-align:center}
.drop:hover{border-color:#9bc400;background:#f7fbe8}
.pkrow{cursor:pointer}
.pkrow.dis{opacity:.55;cursor:not-allowed}
.pkpanel{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
/* modal, drawer, toast */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
.md{background:#fff;border-radius:12px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.md.wide{width:min(1240px,98vw)}
.md-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
.md-bd{padding:14px 18px;overflow:auto}
.md-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.md-ft .l{margin-right:auto;color:var(--muted)}
.x{background:none;border:0;cursor:pointer;font-size:15px;color:#6b7280}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;box-shadow:-10px 0 30px -12px rgba(0,0,0,.4);z-index:60;display:flex;flex-direction:column}
.dw-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
.dw-bd{padding:14px 18px;overflow:auto;flex:1}
.dw h6{margin:14px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:#6b7280}
.dw ul{margin:2px 0;padding-left:18px}.dw li{margin:3px 0}
.tl{border-left:2px solid #d9e2ef;margin:6px 0 0 6px;padding-left:12px}
.tl div{margin:0 0 8px;position:relative}
.tl div::before{content:"";position:absolute;left:-18px;top:5px;width:8px;height:8px;border-radius:50%;background:#7aa800}
.tl small{color:#6b7280;display:block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;z-index:80;box-shadow:0 8px 24px -10px rgba(0,0,0,.6);max-width:80vw}
.menu{position:absolute;right:6px;top:30px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px -10px rgba(0,0,0,.35);z-index:20;min-width:150px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;font:inherit;cursor:pointer}
.menu button:hover{background:#f6f7f5}
.menu button:disabled{opacity:.4;cursor:not-allowed}
td.act{position:relative;text-align:center}
.pager{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:10px}
.pager button{min-width:32px}
.pager .on{border-color:#7aa800;color:#4d6b00;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:22px;margin:4px 0}
.kpi span{color:#6b7280;font-size:12px}
.subtabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:0 0 10px}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 2px;font:inherit;cursor:pointer;color:#4b5563}
.subtabs button.on{border-color:var(--lime-d);color:#111;font-weight:700}
.count{background:#EEF0F2;border-radius:6px;padding:0 6px;font-size:11px;margin-left:4px}
.link{color:#111;text-decoration:underline;cursor:pointer;font-weight:600;white-space:nowrap}
.hide{display:none!important}
.legendchg{display:none;gap:8px;align-items:center;font-size:12px}
body.chg .legendchg{display:flex}
.legendchg i{font-style:normal;padding:1px 8px;border-radius:999px;color:#fff;font-size:11px;font-weight:700}
@media (max-width:1100px){.nav{width:86px}.sub{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.infocard{grid-template-columns:repeat(2,1fr)}}
tr.ffgrp td{background:#F3F6EC;border-top:2px solid #d9e2c4}
tr.ffdet>td{background:#fafbf7}
tr.fftot td{background:#EEF2E6;border-top:2px solid #cfd9b8}
.tb td.nw{white-space:nowrap}

/* ===== Rail menu chuẩn (theo ảnh) ===== */
.rail{width:90px}
.rail button{color:#9aa6b8;font-size:11px;gap:6px;padding:9px 4px;line-height:1.25;font-weight:400}
.rail button .ic{width:34px;height:34px;border-radius:9px;background:none}
.rail button .ic svg{width:19px;height:19px;stroke:#9aa6b8;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rail button:hover{color:#fff}.rail button:hover .ic svg{stroke:#fff}
.rail button.on{color:#fff;font-weight:700}
.rail button.on .ic{background:#3d4f1c}
.rail button.on .ic svg{stroke:#a4ce4c}
</style>
</head>

</div>

 KHAC010000:{name:'Nguyên liệu 001',uom:'KG'},KHAC010001:{name:'Nguyên liệu 002',uom:'KG'},KHAC010003:{name:'Nguyên liệu 003',uom:'KG'},
 HANGTAG01:{name:'Hangtag paper',uom:'PCS'},FABRIC01:{name:'Sport Shoe Upper Mesh Fabric',uom:'M'}};

 {tem:'MLB-260915-0001',item:'KHAC010001',loc:'K01-0001',qty:800},{tem:'MLB-261005-0001',item:'KHAC010001',loc:'K01-0001',qty:1000},{tem:'MLB-261005-0002',item:'KHAC010001',loc:'K01-0001',qty:600},
 {tem:'MLB-260928-0001',item:'KHAC010003',loc:'K01-0002',qty:400},{tem:'MLB-261008-0001',item:'KHAC010003',loc:'K01-0002',qty:600},{tem:'MLB-261008-0002',item:'KHAC010003',loc:'K01-0003',qty:600},{tem:'MLB-261009-0001',item:'KHAC010003',loc:'K01-0004',qty:350},
 {tem:'MLB-261003-0001',item:'KHAC010000',loc:'K01-0002',qty:500},{tem:'MLB-261012-0001',item:'KHAC010000',loc:'K01-0004',qty:300},

 {no:'SCL-20261001-00000005',date:'2026-10-01',wh:'K01',locs:'Tất cả',st:'Đã chốt',user:USER,snap:SNAP_K01_B},
 {no:'SCL-20260924-00000003',date:'2026-09-24',wh:'KGC',locs:'Tất cả',st:'Đã chốt',user:USER,snap:SNAP_KGC}];
const mkScan=(tem,item,locSnap,locScan,qtySnap,qtyScan)=>({tem,item,locSnap,locScan,qtySnap,qtyScan});

 allocpick:t=>{const d=S.dlg;d.rows.push({tem:t.dataset.t,loc:'',locScan:null,book:0,cnt:null,adj:0,added:true,newLoc:''});d.v.push('');d.picker=false;render();},
 allocdel:t=>{const d=S.dlg,i=+t.dataset.i;d.rows.splice(i,1);d.v.splice(i,1);render();},
 adjsave:t=>{const sel=allSail().filter(x=>S.adjSel[x.id]),d=S.dlg,no=nextAdj(),types=[...new Set(sel.flatMap(x=>x.types||[x.type]))],lines=[];
  sel.forEach(x=>{if(x.kind==='qty'){(S.alloc[x.id]||[]).filter(r=>r.adj).forEach(r=>lines.push({type:'Chênh lệch số lượng',tem:r.tem,item:x.item,desc:'SL '+fmt(r.book)+' → '+fmt(r.book+r.adj)+(r.loc?' · '+r.loc:'')}));(S.alloc[x.id]||[]).filter(r=>r.tem&&r.locScan&&r.locScan!==r.loc).forEach(r=>lines.push({type:'Sai vị trí',tem:r.tem,item:x.item,desc:r.loc+' → '+r.locScan}));}else lines.push({type:x.type,tem:x.tem,item:x.item,desc:x.type==='Chênh lệch số lượng'?('SL '+fmt(x.qs)+' → '+fmt(x.qc)):(x.sys+' → '+x.scn)});});
  ADJ.unshift({no,ky:sel[0].ky,type:types.join(', '),lines:lines.length,wh:sel[0].wh,st:t.dataset.st,user:USER,date:d.date,note:d.note,iss:sel,det:{date:d.date,lines},hist:[H(NOW,USER,'Tạo phiếu điều chỉnh')].concat(t.dataset.st==='Chờ duyệt'?[H(NOW,USER,'Trình duyệt')]:[])});
  sel.forEach(x=>{if(x.kind==='qty'){const k=kyOf(x.ky);k.adjDone=k.adjDone||{};k.adjDone[x.item]=no;}});
  SAIL=SAIL.filter(x=>!S.adjSel[x.id]);S.adjSel={};S.alloc={};S.dlg=null;S.adjTab='phieu';render();toast('Đã tạo phiếu '+no+' ('+t.dataset.st+').');},
 ack:()=>{S.dlg={k:'ack',reason:''};render();},
 ackok:()=>{const n=Object.keys(S.adjSel).length,rs=S.dlg.reason;SAIL.forEach(x=>{if(S.adjSel[x.id]){x.st='ACK';x.reason=rs;}});S.adjSel={};S.dlg=null;render();toast('Đã xác nhận đã kiểm tra '+n+' sai lệch.');},
 admn:t=>{S.menu=S.menu==='adj:'+t.dataset.no?null:'adj:'+t.dataset.no;render();},
 adjact:t=>{S.menu=null;const a=ADJ.find(x=>x.no===t.dataset.no),act=t.dataset.a;
  if(act==='view')S.dlg={k:'adjView',no:a.no};
  else if(act==='assign')S.dlg={k:'assign',no:a.no,v:{},sel:{},err:''};
  else if(act==='edit')S.dlg={k:'adjEdit',no:a.no,date:a.det?a.det.date:a.date,note:a.note||''};
  else if(act==='submit'){a.st='Chờ duyệt';a.hist.push(H(NOW,USER,'Trình duyệt'));toast('Đã trình duyệt '+a.no+'.');}
  else if(act==='approve'){a.st='Đã duyệt';a.hist.push(H(NOW,USER,'Duyệt'));toast('Đã duyệt '+a.no+'. Tồn kho đã được điều chỉnh.');}
  else S.dlg={k:'adjReason',no:a.no,mode:act,reason:''};
  render();},
 asgtick:t=>{const d=S.dlg,i=t.dataset.l,tm=t.dataset.t;d.sel[i]=d.sel[i]||[];if(d.sel[i].includes(tm)){d.sel[i]=d.sel[i].filter(x=>x!==tm);if(d.v[i])delete d.v[i][tm];}else d.sel[i].push(tm);render();},
 assignok:()=>{const d=S.dlg,a=ADJ.find(x=>x.no===d.no),k=kyOf(a.ky),c=clzOf(k);d.err='';let any=false;const out=[];
  for(const [i,l] of a.det.lines.entries()){out[i]=[];if(l.asg||!l.need)continue;const sel=d.sel[i]||[],m=d.v[i]||{};let sum=0;
   for(const [n,t] of sel.entries()){const r=c.snap.find(x=>x.tem===t);const raw=m[t]!=null?m[t]:(n===0?String(l.need<0?Math.min(Math.abs(l.need),r.qty):l.need):'');const q=parseFloat(String(raw).replace(',','.'))||0;if(!q)continue;
    if(q<0||(l.need<0&&q>r.qty)){d.err='Số lượng điều chỉnh của tem '+t+' không hợp lệ (tối đa '+fmt(r.qty)+').';return render();}sum+=q;out[i].push({tem:t,qty:q});}
   if(sum>Math.abs(l.need)){d.err='Mặt hàng '+l.item+': tổng phân bổ '+fmt(sum)+' vượt số cần gán '+fmt(Math.abs(l.need))+'.';return render();}
   if(sum>0)any=true;}
  if(!any){d.err='Tick chọn ít nhất một tem và nhập số lượng điều chỉnh.';return render();}
  a.det.lines.forEach((l,i)=>{if(!l.asg&&out[i]&&out[i].length)l.asg=out[i];});
  a.hist.push(H(NOW,USER,'Gán tem',a.det.lines.filter(l=>l.asg).map(l=>l.item+': '+l.asg.map(x=>x.tem+' ('+fmt(x.qty)+')').join(', ')).join('; ')));S.dlg=null;render();toast('Đã gán tem cho phiếu '+a.no+'.');},
 scmn:t=>{S.menu=S.menu==='sc:'+t.dataset.t?null:'sc:'+t.dataset.t;render();},
 scanadd:()=>{S.dlg={k:'scanAdd',tem:'',q:'',loc:'',qty:'',err:''};render();},
 sapick:t=>{const k=kyOf(S.ky),c=clzOf(k),r=c.snap.find(x=>x.tem===t.dataset.t);S.dlg.tem=r.tem;S.dlg.loc='';S.dlg.qty=String(r.qty);S.dlg.autoQty=true;S.dlg.err='';render();},
 scanaddok:()=>{const d=S.dlg,k=kyOf(S.ky),c=clzOf(k);d.err='';
  if(!c){d.err='Chưa có chốt tồn của kho này ngày '+dmy(k.date)+'.';return render();}
  const code=(d.tem||d.q||'').trim().toUpperCase();
  if(!code){d.err='Nhập mã vạch/QR.';return render();}
  const r=c.snap.find(x=>x.tem===code);
  if(!r){d.err='Không tìm thấy tem '+code+' trong bản chụp chốt kho '+k.wh+'.';return render();}
  if(k.scans.some(x=>x.tem===code)){d.err='Tem '+code+' đã có kết quả kiểm kê, sửa ở dòng đó.';return render();}
  if(k.entries.some(e=>e.item===r.item)){d.err='Mã hàng '+r.item+' đã có kết quả kiểm kê không theo tem trong kỳ này nên không thêm theo tem. Mỗi mã hàng chỉ kiểm kê theo tem hoặc không theo tem.';return render();}
  if(!d.loc){d.err='Chọn vị trí kiểm kê.';return render();}
  const q=parseFloat(String(d.qty).replace(',','.'));if(!(q>0)){d.err='Nhập số lượng kiểm kê lớn hơn 0.';return render();}
  k.scans.push(mkScan(code,r.item,r.loc,d.loc,r.qty,q));S.dlg=null;render();toast('Đã thêm kết quả kiểm kê tem '+code+'.');},
 scanedit:t=>{S.menu=null;const k=kyOf(S.ky),x=k.scans.find(s=>s.tem===t.dataset.t);S.dlg={k:'scanEdit',tem:x.tem,loc:x.locScan,qty:String(x.qtyScan),err:''};render();},
 scaneditok:()=>{const d=S.dlg,k=kyOf(S.ky),x=k.scans.find(s=>s.tem===d.tem),q=parseFloat(String(d.qty).replace(',','.'));if(!(q>0)){d.err='Nhập số lượng kiểm kê lớn hơn 0.';return render();}x.locScan=d.loc;x.qtyScan=q;S.dlg=null;render();toast('Đã lưu kết quả kiểm kê tem '+x.tem+'.');},
 scandel:t=>{S.menu=null;S.dlg={k:'scanDel',tem:t.dataset.t};render();},
 scandelok:()=>{const k=kyOf(S.ky),t=S.dlg.tem;k.scans=k.scans.filter(s=>s.tem!==t);S.dlg=null;render();toast('Đã xóa kết quả kiểm kê tem '+t+'.');},
 adjeditok:()=>{const d=S.dlg,a=ADJ.find(x=>x.no===d.no);if(a.det)a.det.date=d.date;a.date=d.date;a.note=d.note;a.hist.push(H(NOW,USER,'Sửa phiếu điều chỉnh'));S.dlg=null;render();toast('Đã lưu phiếu '+a.no+'.');},
 adjreasonok:()=>{const d=S.dlg,a=ADJ.find(x=>x.no===d.no);
  if(d.mode==='reject'){a.st='Từ chối';SAIL=SAIL.concat((a.iss||[]).filter(x=>x.kind!=='qty'));(a.iss||[]).filter(x=>x.kind==='qty').forEach(x=>{const k=kyOf(x.ky);if(k&&k.adjDone)delete k.adjDone[x.item];});a.hist.push(H(NOW,USER,'Từ chối',d.reason));toast('Đã từ chối '+a.no+'. Các sai lệch quay lại danh sách.');}
  else{a.st='Đã hủy';a.hist.push(H(NOW,USER,'Hủy phiếu điều chỉnh',d.reason));toast('Đã hủy '+a.no+'. Tồn kho đã được hoàn lại.');}
  S.dlg=null;render();},
 kymn:t=>{S.menu=S.menu==='ky:'+t.dataset.no?null:'ky:'+t.dataset.no;render();},
 kyedit:t=>{S.menu=null;const k=kyOf(t.dataset.no);S.dlg={k:'kyEdit',no:k.no,date:k.date,wh:k.wh,all:k.locs==='Tất cả',locs:k.locs==='Tất cả'?[]:k.locs.slice(),q:'',note:k.note,err:'',lock:kyStatus(k)!=='Đã tạo'};render();},
 kyeditok:()=>{const d=S.dlg,k=kyOf(d.no);
  if(!d.date){d.err='Chọn ngày kiểm kê.';return render();}
  if(d.date>TODAY){d.err='Ngày kiểm kê không được là ngày trong tương lai.';return render();}
  if(WH[d.wh].loc&&!d.all&&!d.locs.length){d.err='Chọn ít nhất một vị trí hoặc chọn Tất cả.';return render();}
  {const dup=kyOverlap(d.wh,d.date,WH[d.wh].loc&&!d.all?d.locs:'Tất cả',k.no);if(dup){d.err=DUPMSG(dup);return render();}}
  k.date=d.date;k.wh=d.wh;k.locs=WH[d.wh].loc&&!d.all?d.locs.slice():'Tất cả';k.note=d.note;S.dlg=null;render();toast('Đã cập nhật kỳ kiểm kê '+k.no+'.');},
 kydel:t=>{S.menu=null;S.dlg={k:'kyDel',no:t.dataset.no};render();},
 kydelok:()=>{const no=S.dlg.no;KY=KY.filter(k=>k.no!==no);if(S.ky===no)S.ky=KY[0].no;if(S.detKy===no)S.detKy=KY[0].no;S.dlg=null;render();toast('Đã xóa kỳ kiểm kê '+no+'.');}
});
Object.assign(CHG,{
 allocloc:t=>{S.dlg.rows[+t.dataset.i].newLoc=t.value;render();},
 alq:t=>{S.dlg.v[+t.dataset.i]=t.value;render();},
 afin:t=>{S.af[S.adjTab][t.dataset.k]=t.value;},
 kyf:t=>{S.kyf[t.dataset.k]=t.value;render();},clzf:t=>{S.clzf[t.dataset.k]=t.value;render();},
 kysel2:t=>{S.ky=t.value;S.fl={kw:'',flag:'',st:''};render();},
 sadf:t=>{S.dlg[t.dataset.k]=t.value;},
 dlgf:t=>{const d=S.dlg;d[t.dataset.k]=t.value;if(t.dataset.k==='wh'){d.locs=[];d.all=true;}d.err='';render();},
 clzdf:t=>{const d=S.dlg;d[t.dataset.k]=t.value;if(t.dataset.k==='wh'){d.locs=[];d.all=true;}d.err='';d.warn=false;render();},
 pf:t=>{S.pop.f[t.dataset.k]=t.value;},
 flkw:t=>{S.fl.kw=t.value;render();},flflag:t=>{S.fl.flag=t.value;render();},
 enqty:t=>{const q=parseFloat(String(t.value).replace(',','.'));const e=kyOf(S.ky).entries[+t.dataset.i];if(q>0){e.qty=q;render();}else{toast('Số lượng phải lớn hơn 0.');render();}},

});
document.addEventListener('input',e=>{const t=e.target,a=t.dataset&&t.dataset.act;
 if(a==='nfkw'){S.nf.kw=t.value;S.nf.item='';S.nf.err='';render();}
 else if(a==='nfqty'){S.nf.qty=t.value;S.nf.err='';}
 else if(a==='dlgin'){S.dlg[t.dataset.k]=t.value;}
 else if(a==='locq'){S.dlg.q=t.value;render();}
 else if(a==='clzin'){S.dlg.date=t.value;S.dlg.err='';S.dlg.warn=false;render();}
 else if(a==='pf'){S.pop.f[t.dataset.k]=t.value;}
 else if(a==='afin'){S.af[S.adjTab][t.dataset.k]=t.value;}
 else if(a==='asgq'){const d=S.dlg;(d.v[t.dataset.l]=d.v[t.dataset.l]||{})[t.dataset.t]=t.value;}
 else if(a==='satem'){const d=S.dlg;if(d.autoQty){d.qty='';d.autoQty=false;}d.tem='';d.q=t.value;{const c=clzOf(kyOf(S.ky)),r=c&&c.snap.find(x=>x.tem&&x.tem===t.value.trim().toUpperCase());if(r&&!d.qty){d.qty=String(r.qty);d.autoQty=true;}}render();}
 else if(a==='sadin'){S.dlg[t.dataset.k]=t.value;if(t.dataset.k==='qty')S.dlg.autoQty=false;}
 else if(a==='cbin'){S.cb={id:t.dataset.id,q:t.value};render();}
 else if(a==='rsn'){S.dlg.reason=t.value;const b=$('[data-act="clzopenok"]')||$('[data-act="adjreasonok"]')||$('[data-act="ackok"]');if(b)b.disabled=!t.value.trim()||!!S.dlg.blocked;}});
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.act==='cbin'&&(!S.cb||S.cb.id!==t.dataset.id)){S.cb={id:t.dataset.id,q:''};render();}});
document.addEventListener('click',e=>{if(S.cb&&!e.target.closest('[data-act="cbin"]')&&!e.target.closest('[data-act="cbpick"]')){S.cb=null;render();}
 if(S.menu&&!e.target.closest('.menu')&&!e.target.closest('[data-act="kymn"]')&&!e.target.closest('[data-act="admn"]')&&!e.target.closest('[data-act="scmn"]')){S.menu=null;render();}
 const t=e.target.closest('[data-act]');if(!t||/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName))return;const f=ACT[t.dataset.act];if(f)f(t,e);});
document.addEventListener('change',e=>{const t=e.target.closest('[data-act]');if(!t)return;
 if(t.tagName==='INPUT'&&(t.type==='checkbox'||t.type==='radio')&&ACT[t.dataset.act]){ACT[t.dataset.act](t);return;}
 const f=CHG[t.dataset.act];if(f)f(t,e);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input[data-act]'))e.target.blur();});
render();

</script>
