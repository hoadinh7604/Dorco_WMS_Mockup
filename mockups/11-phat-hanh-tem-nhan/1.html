<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bản thử nghiệm giao diện tạo và in tem · DORCO WMS</title>
<style>
:root{--lime:#C8F135;--lime-d:#B5DC2E;--lime-bg:#EEF8C9;--ink:#1F2937;--muted:#6B7280;--line:#E5E7EB;--bg:#F8F8F6;--card:#fff;--dark:#0F1A2B;--dark2:#162338;--blue:#2563EB;--new:#2E7D4F;--mod:#C77700;--del:#B3261E}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Noto Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;font-size:13px;color:var(--ink);background:var(--bg)}
#app{display:flex;height:100vh;overflow:hidden}
/* navigation */
.nav{width:300px;flex:none;background:var(--dark);display:flex;flex-direction:column}
.logo{margin:10px 6px 4px;background:#fff;border-radius:6px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#1e56d9;letter-spacing:.2px}
.logo span{color:#0ea5e9}
.navbody{flex:1;display:flex;min-height:0}
.rail{width:86px;flex:none;border-right:1px solid #1f2d44;overflow-y:auto;padding:8px 0}
.rail button{width:100%;background:none;border:0;color:#9fb0c8;padding:9px 4px;font:inherit;font-size:11.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;line-height:1.2}
.rail button .ic{font-size:17px;width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.rail button.on{color:#fff}
.rail button.on .ic{background:#27401c;color:var(--lime)}
.sub{flex:1;overflow-y:auto;padding:12px 6px}
.sub h5{margin:2px 8px 12px;text-align:center;color:#fff;font-size:14px}
.sub a{display:block;color:#b8c5d9;padding:10px 12px;border-radius:7px;margin:3px 0;cursor:pointer;text-decoration:none;font-size:13.5px}
.sub a:hover{background:var(--dark2)}
.sub a.on{background:var(--lime);color:#111;font-weight:600}
.sub a.dim{opacity:.55}
.sub .grp{color:#8ea0ba;font-size:12px;margin:14px 10px 4px;font-weight:600}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap-reverse;align-items:flex-end;justify-content:space-between;gap:0 12px;padding:0 14px;min-height:58px;background:#fff;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.tab{white-space:nowrap;display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:#fafafa;cursor:pointer;color:#4b5563}
.tab.on{background:#fff;font-weight:700;color:#111}
.tab .x{color:#9ca3af;font-size:11px}
.tools{display:flex;gap:10px;align-items:center;padding:8px 0;flex-wrap:wrap;justify-content:flex-end}
.tools label{display:flex;align-items:center;gap:5px;font-size:12px;color:#374151}
.tools select{padding:4px 6px;font-size:12px}
.user{display:flex;align-items:center;gap:8px;font-weight:600}
.user i{width:30px;height:30px;border-radius:50%;background:#E7F7B0;display:flex;align-items:center;justify-content:center;font-style:normal;color:#4d6b00}
.content{flex:1;overflow:auto;padding:10px 16px 0;position:relative}
.page-title{font-size:22px;font-weight:700;margin:4px 0 12px}
.segtabs{display:inline-flex;background:#EEF0F2;border-radius:8px;padding:4px;margin-bottom:12px}
.segtabs button{border:0;background:none;padding:7px 16px;border-radius:6px;font:inherit;cursor:pointer;color:#4b5563}
.segtabs button.on{background:#fff;font-weight:700;color:#111;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:0 0 12px}
.card-hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:17px;font-weight:700;border-bottom:1px solid var(--line)}
.card-hd small{font-size:12px;font-weight:400;color:var(--muted);margin-left:8px}
.card-bd{padding:12px 14px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.fld label{font-size:12px;color:#4b5563}
.fld .req{color:#dc2626}
input,select,textarea{border:1px solid #d1d5db;border-radius:6px;padding:7px 10px;font:inherit;background:#fff;color:var(--ink);min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #d9f56b;border-color:#9bc400}
input[readonly],input:disabled,select:disabled{background:#F3F4F6;color:#6b7280}
input[type=checkbox],input[type=radio]{width:15px;height:15px;padding:0;accent-color:#7aa800}
.inl{display:flex;gap:6px}
.inl input{flex:1}
.btn{border:1px solid #d1d5db;background:#fff;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer;color:#111}
.btn:hover{background:#f9fafb}
.btn.pri{background:var(--lime);border-color:var(--lime-d);font-weight:700}
.btn.pri:hover{background:#bfe72d}
.btn.danger{color:#b91c1c;border-color:#fca5a5}
.btn.sm{padding:3px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ico{padding:7px 10px}
.foot-sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:10px 16px;margin:6px -16px 0;z-index:5}
.foot-sticky .btns{display:flex;gap:10px}
.tbwrap{overflow:auto;border:1px solid var(--line);border-radius:8px}
table.tb{width:100%;border-collapse:collapse;min-width:900px}
.tb th{background:#F6F7F5;text-align:left;font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:8px 10px;border-bottom:1px solid #f0f1ef;vertical-align:middle}
.tb tr.sel td{background:var(--lime-bg)}
.tb tr:hover td{background:#fafbf5}
.tb td.num,.tb th.num{text-align:right}
.tb input.q{width:110px;text-align:right}
.tb small{display:block;color:#6b7280;font-size:11px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 10px;border-radius:6px;border:1px solid transparent;white-space:nowrap}
.chip.blue{background:#E6F0FF;color:#1D4ED8;border-color:#BFD6FF}
.chip.amber{background:#FFF3D6;color:#B45309;border-color:#FBD38D}
.chip.green{background:#E3F7E8;color:#15803D;border-color:#A7E3B6}
.chip.gray{background:#EEF0F2;color:#4B5563;border-color:#D1D5DB}
.chip.red{background:#FDE2E0;color:#B42318;border-color:#F8B4AE}
.chip.ng{background:#FDE2E0;color:#B42318}
.muted{color:var(--muted)}
.ok{color:#15803D;font-weight:700}.bad{color:#B42318;font-weight:700}
.note{border-radius:8px;padding:9px 12px;margin:10px 0 0;font-size:12.5px}
.note.info{background:#EAF3FF;border:1px solid #BFD6FF;color:#1E3A8A}
.note.warn{background:#FFF8E6;border:1px solid #F1DFA8;color:#7A5500}
.note.err{background:#FEECEB;border:1px solid #F5B5B0;color:#8A1F17}
.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#6b7280;padding:40px 10px;text-align:center}
.empty i{font-size:42px;font-style:normal}
.sumtbl{width:100%;border-collapse:collapse}
.sumtbl td{padding:8px 4px;border-bottom:1px solid #f0f1ef}
.sumtbl td:last-child{text-align:right;font-weight:600}
.segs{display:inline-flex;border:1px solid #d1d5db;border-radius:8px;overflow:hidden;flex-wrap:wrap}
.segs button{border:0;border-right:1px solid #d1d5db;background:#fff;padding:7px 13px;font:inherit;cursor:pointer}
.segs button:last-child{border-right:0}
.segs button.on{background:var(--dark);color:#fff}
.infocard{background:#F4F9E6;border:1px solid #D7E8A0;border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 14px;margin-top:10px}
.infocard div span{display:block;font-size:11px;color:#6b7280}
.infocard div b{font-weight:600}
/* tem preview */
.tem{border:1px solid #94a3b8;border-radius:8px;padding:10px 12px;background:#fff;max-width:360px;margin:6px auto}
.tem .tt{display:flex;justify-content:space-between;border-bottom:1px solid #94a3b8;padding-bottom:4px;margin-bottom:6px;font-weight:700}
.tem .r{display:flex;gap:8px;font-size:12px;line-height:1.6}
.tem .r span:first-child{color:#6b7280;width:96px;flex:none}
.tem .qr{width:78px;height:78px;border:1px dashed #64748b;display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#64748b;text-align:center;flex:none}
.tem .q{margin-top:6px;background:#EEF2F7;border-radius:5px;padding:5px 8px;display:flex;justify-content:space-between;font-weight:700}
.sheetpg{width:250px;border:1px solid #94a3b8;background:#fff;padding:7px;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:78px;gap:5px}
.sheetpg div{border:1px dashed #94a3b8;border-radius:4px;font-size:10px;padding:3px 4px;overflow:hidden;line-height:1.3}
.sheetpg div.e{color:#cbd5e1}
.pages{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #b9c6d8;border-radius:10px;padding:22px;background:#fafbfd;cursor:pointer;color:#4b5563;text-align:center}
.drop:hover{border-color:#9bc400;background:#f7fbe8}
.pkrow{cursor:pointer}
.pkrow.dis{opacity:.55;cursor:not-allowed}
.pkpanel{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
/* modal, drawer, toast */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px}
.md{background:#fff;border-radius:12px;width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
.md.wide{width:min(1240px,98vw)}
.md-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
.md-bd{padding:14px 18px;overflow:auto}
.md-ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.md-ft .l{margin-right:auto;color:var(--muted)}
.x{background:none;border:0;cursor:pointer;font-size:15px;color:#6b7280}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fff;box-shadow:-10px 0 30px -12px rgba(0,0,0,.4);z-index:60;display:flex;flex-direction:column}
.dw-hd{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-size:15px}
.dw-bd{padding:14px 18px;overflow:auto;flex:1}
.dw h6{margin:14px 0 4px;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:#6b7280}
.dw ul{margin:2px 0;padding-left:18px}.dw li{margin:3px 0}
.tl{border-left:2px solid #d9e2ef;margin:6px 0 0 6px;padding-left:12px}
.tl div{margin:0 0 8px;position:relative}
.tl div::before{content:"";position:absolute;left:-18px;top:5px;width:8px;height:8px;border-radius:50%;background:#7aa800}
.tl small{color:#6b7280;display:block}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 18px;border-radius:10px;z-index:80;box-shadow:0 8px 24px -10px rgba(0,0,0,.6);max-width:80vw}
.menu{position:absolute;right:6px;top:30px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px -10px rgba(0,0,0,.35);z-index:20;min-width:150px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 12px;font:inherit;cursor:pointer}
.menu button:hover{background:#f6f7f5}
.menu button:disabled{opacity:.4;cursor:not-allowed}
td.act{position:relative;text-align:center}
.pager{display:flex;gap:6px;justify-content:flex-end;align-items:center;margin-top:10px}
.pager button{min-width:32px}
.pager .on{border-color:#7aa800;color:#4d6b00;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font-size:22px;margin:4px 0}
.kpi span{color:#6b7280;font-size:12px}
.subtabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:0 0 10px}
.subtabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 2px;font:inherit;cursor:pointer;color:#4b5563}
.subtabs button.on{border-color:var(--lime-d);color:#111;font-weight:700}
.count{background:#EEF0F2;border-radius:6px;padding:0 6px;font-size:11px;margin-left:4px}
.link{color:#111;text-decoration:underline;cursor:pointer;font-weight:600;white-space:nowrap}
.hide{display:none!important}
/* change marks */
body.chg [data-chg=new]{outline:2px dashed var(--new);outline-offset:2px}
body.chg [data-chg=mod]{outline:2px dashed var(--mod);outline-offset:2px}
body.chg th[data-chg],body.chg td[data-chg]{outline:0;box-shadow:inset 0 0 0 2px var(--c)}
body.chg th[data-chg=new],body.chg td[data-chg=new]{--c:var(--new)}
body.chg th[data-chg=mod],body.chg td[data-chg=mod]{--c:var(--mod)}
.legendchg{display:none;gap:8px;align-items:center;font-size:12px}
body.chg .legendchg{display:flex}
.legendchg i{font-style:normal;padding:1px 8px;border-radius:999px;color:#fff;font-size:11px;font-weight:700}
@media (max-width:1100px){.nav{width:86px}.sub{display:none}.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.infocard{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app">
  <aside class="nav">
    <div class="logo">Dorco<span>WMS</span></div>
    <div class="navbody"><div class="rail" id="rail"></div><div class="sub" id="sub"></div></div>
  </aside>
  <section class="main">
    <div class="topbar">
      <div class="tabs" id="tabs"></div>
      <div class="tools">
                                              <div class="user"><i>A</i> admin</div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </section>
</div>
<div id="modals"></div>
<div id="drawer"></div>
<div id="toastbox"></div>
<script>
'use strict';
/* =============== DỮ LIỆU MẪU =============== */
const TODAY='2026-10-16', TODAY_S='261016';
const ITEMS={
  KHAC010001:{name:'Nguyên liệu 002',spec:'Black_abc_M4W6',uom:'KG',std:1000},
  KHAC010003:{name:'Nguyên liệu 003',spec:'KHAC01-0003',uom:'KG',std:600},
  KHAC010000:{name:'Nguyên liệu 001',spec:'KHAC01-0000',uom:'KG',std:1000},
  HANGTAG01:{name:'Hangtag paper',spec:'1',uom:'PCS',std:500},
  FABRIC01:{name:'Sport Shoe Upper Mesh Fabric',spec:'BLACKSPT-2026',uom:'M',std:50}
};
const REQLIKE=['request','production','repack'];
const DEFAULTS={'KHAC010001|DT00003':100,'KHAC010003|DT00003':1000,'HANGTAG01|CUST-00000001':100};
const SUPNAME={'DT00003':'Công ty TNHH Phụ liệu An Phát','CUST-00000001':'Công ty CP Bao bì Việt Tiến','PR MOMO':'PR MOMO','MO SUP':'MO SUP'};
function supName(c){return SUPNAME[c]||c||'';}
const TPLS=[['nvl','Hàng NVL đóng gói'],['btp','Hàng BTP nhập mua']];
function autoDefault(l){ if(I.src!=='request'||!I.req) return; if(l.groups&&l.groups.length) return; const d=DEFAULTS[l.item+'|'+(I.req.supplier||'')]; if(d&&l.need>0){l.groups=autoGroups(l.need,d);l.open=true;l.auto=true;} }
function temDiffs(l){
 const r=(typeof reqList==='function'?reqList():[]).find(x=>x.no===l.src); if(!r) return [];
 const ln=r.lines.find(x=>x.item===l.item&&(x.so||'')===(l.so||'')); if(!ln) return [];
 const d=[],chk=(f,a,b)=>{if((a||'')!==(b||''))d.push({f,tem:a||'',req:b||''});};
 chk('Nhà cung cấp',l.supplier,r.supplier); chk('Checklist',l.checklist,ln.checklist); chk('Ngày SX',l.mfg,ln.mfg); chk('Batch NCC',l.batch,ln.batch);
 if(l.reqQty&&Number(l.reqQty)!==Number(ln.qty)) d.push({f:'Số lượng yêu cầu',tem:String(l.reqQty),req:String(ln.qty)});
 return d;
}
function diffText(l,d){return 'tem '+l.no+' lệch yêu cầu '+l.src+': '+d.map(x=>x.f+' (tem '+(x.tem||'trống')+', yêu cầu '+(x.req||'trống')+')').join('; ');}
function printWarn(ls){const out=[];ls.forEach(l=>{const d=temDiffs(l);if(d.length)out.push(diffText(l,d));});return out.length?'<div class="note warn" data-chg="new">Cảnh báo: '+out.map(esc).join(' | ')+'. In lại sẽ in dữ liệu cũ của tem; hủy tem và tạo, in lại nếu cần. Cảnh báo không chặn.</div>':'';}
const PRINTERS=['Máy in kho K01','Máy in kho K02','Xuất PDF (xem trước)'];
const PAPERS=['A4 decal 4 tem (2 × 2)','Tem cuộn 100 × 70 mm'];
const CANCEL_REASONS=['Hư hỏng trong kho','Bản in không đọc được','Mất tem','Đóng gói lại / tách kiện','Sai số lượng','Phát hành trùng','Đảo phiếu nhập','In lỗi chưa dán','Sai biến thể hàng','Yêu cầu nhập đã hủy','Thay đổi nội dung pallet','Xếp lại sang pallet mới','Thông tin tem không chính xác','Yêu cầu khách hàng','Thay đổi thiết kế hoặc quy cách','Dán tem lại tái xuất','Cần thêm bản tem thùng','Đã huỷ phiếu giao hàng','Khác'];
const MANUAL_REASONS=['Kiểm kê thừa','Tem hỏng, không xác định nguồn','Khác (nhập lý do)'];
const TARGETS=['Chưa xác định','Phiếu điều chỉnh tăng','Phiếu nhập khác','Phiếu tồn đầu kỳ'];
let MANUAL='Tạo thủ công';

let DB, I, LK, N, LC, M=null, DR=null, V='issue', TABS=['issue'], RAIL_SEL='lbl', NOTES_OPEN=false;

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=n=>(Number(n)||0).toLocaleString('vi-VN');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowStr=()=>new Date().toTimeString().slice(0,8);
const dmy=d=>d?d.split('-').reverse().join('/'):'—';
function toast(m){const b=$('#toastbox');b.innerHTML=`<div class="toast">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>b.innerHTML='',3200);}

function L(no,o){return Object.assign({no,status:'issued',item:'',qty:0,remaining:0,supplier:'',po:'',src:'',so:'',wh:'K01',loc:'',inDate:'',slipNo:'',parent:'',printCount:0,issuedBy:'Super Administrator',issuedAt:TODAY+' 09:00:00',note:'',ng:false,manual:false,reason:'',target:'',holder:'',events:[]},o,(o&&o.status==='reserved'&&!o.holder)?{holder:o.slipNo?'slip':'request'}:{});}
function ev(l,text,t){l.events.push({t:t||(TODAY+' '+nowStr()),text});}
function seed(){
  const labels=[
    L('MLB-261001-0004',{status:'issued',item:'HANGTAG01',qty:100,supplier:'CUST-00000001',src:'YQNK-NVL-2610-00002',issuedAt:'2026-10-01 14:59:47'}),
    L('MLB-261001-0003',{status:'reserved',item:'KHAC010003',qty:1000,supplier:'DT00003',src:'YQNK-NVL-2610-00001',po:'PO-2026-000046',batch:'BCH-0041',slipNo:'GRN-NVL-2610-00012',printCount:1,issuedAt:'2026-10-01 10:32:59'}),
    L('MLB-261001-0002',{status:'reserved',item:'KHAC010003',qty:1000,supplier:'DT00003',src:'YQNK-NVL-2610-00001',po:'PO-2026-000046',batch:'BCH-0041',slipNo:'GRN-NVL-2610-00012',printCount:1,issuedAt:'2026-10-01 10:32:59'}),

      const lim=p.reason==='return'?consumedQty(par):par.remaining; out.lim=lim;
      let sum=0;
      p.rows.forEach((r,i)=>{
        const q=+r.qty; if(!(q>0)){errs.push('Dòng '+(i+1)+': nhập số lượng');return;}
        sum+=q; const loc=r.loc||(p.reason==='ng'?(DB.locs.find(x=>x.zone==='NG')||{}).code:par.loc)||par.loc;
        if(!loc) errs.push('Dòng '+(i+1)+': chọn vị trí kho');
        out.labels.push({item:par.item,qty:q,so:par.so,loc,note:r.note});
      });
      out.sum=sum;
      if(sum>lim) errs.push((p.reason==='return'?'Tổng trả lại ':'Tổng tách ')+fmt(sum)+' vượt '+(p.reason==='return'?'số đã xuất ('+fmt(lim)+')':'tồn kho ('+fmt(lim)+')'));
    }
    if(out.labels.length) out.preview={item:par.item,qty:out.labels[0].qty,so:par.so,supplier:par.supplier,po:par.po};
    return out;
  }
  // manual
  const m=I.manual; out.kind='manual';
  const rows=m.rows.filter(r=>r.item||r.per||r.loc);
  if(!rows.length) errs.push('Nhập ít nhất một dòng');
  rows.forEach((r,i)=>{
    const n=+r.count, q=+r.per;
    if(!ITEMS[r.item]) errs.push('Dòng '+(i+1)+': chọn mặt hàng hợp lệ');
    if(!(q>0)) errs.push('Dòng '+(i+1)+': SL/tem phải lớn hơn 0');
    if(!(n>=1)||n%1) errs.push('Dòng '+(i+1)+': số tem phải là số nguyên từ 1');
    if(!r.loc) errs.push('Dòng '+(i+1)+': chọn vị trí kho');
    if(ITEMS[r.item]&&q>0&&n>=1) for(let k=0;k<Math.min(n,500);k++) out.labels.push({item:r.item,qty:q,so:r.so,loc:r.loc,date:r.date||TODAY,note:r.note,row:i});
  });
  if(out.labels.length){const pl=out.labels.find(x=>x.row===+I.prevRow)||out.labels[0];out.preview={item:pl.item,qty:pl.qty,so:pl.so,supplier:'',po:'',checklist:'',mfg:'',batch:''};}
  return out;
}

<script>

function relDocs(l){ return [l.po,l.src,l.slipNo].concat((DB.adjSlips||[]).filter(x=>(x.lines||[]).some(y=>y&&y.label===l.no)).map(x=>x.no)).filter(Boolean).join(' '); }
function lkRows(){
  const f=LK.f;

    const it=ITEMS[l.item]||{name:''};
    if(f.scan&&!l.no.toLowerCase().includes(f.scan.toLowerCase())) return false;
    if(f.item&&!(l.item+' '+it.name).toLowerCase().includes(f.item.toLowerCase())) return false;
    if(f.supplier&&!(l.supplier||'').toLowerCase().includes(f.supplier.toLowerCase())) return false;
    if(f.doc&&!relDocs(l).toLowerCase().includes(f.doc.toLowerCase())) return false;
    const d=l.issuedAt.slice(0,10); if(f.from&&d<f.from) return false; if(f.to&&d>f.to) return false;
    if(f.status&&(f.status==='consumed'?!['stock','empty','consumed'].includes(l.status):l.status!==f.status)) return false;
    if(f.wh&&l.wh!==f.wh) return false;
    if(f.loc&&l.loc!==f.loc) return false;
    if(f.so&&!(l.so||'').toLowerCase().includes(f.so.toLowerCase())) return false;
    if(f.inFrom&&(!l.inDate||l.inDate<f.inFrom)) return false; if(f.inTo&&(!l.inDate||l.inDate>f.inTo)) return false;
    if(f.slip==='no'&&l.slipNo) return false; if(f.slip==='yes'&&!l.slipNo) return false;

}

  const slipSel=`<div class="fld" data-chg="new"><label>Gán phiếu nhập</label><select data-act="lk" data-k="slip"><option value="">Tất cả</option><option value="no" ${f.slip==='no'?'selected':''}>Chưa gán</option><option value="yes" ${f.slip==='yes'?'selected':''}>Đã gán</option></select></div>`;

    <td><b>${esc(it.name)}</b><small>${l.item}</small></td><td class="num">${fmt(l.qty)} ${it.uom}</td>
    <td class="num" data-chg="new">${(l.status==='stock'||l.status==='empty')?fmt(l.remaining)+' '+it.uom:'—'}</td><td data-chg="new">${esc(l.loc||'—')}</td><td data-chg="new">${dmy(l.inDate)}</td><td data-chg="new">${esc(l.slipNo||'—')}</td><td data-chg="new">${esc(l.so||'—')}</td><td data-chg="new">${esc(l.parent||'—')}</td>
    <td>${esc(l.supplier||'—')}</td><td><b>${esc(l.src||'—')}</b><small>${esc(l.po||'')}</small></td><td><b>${esc(l.issuedBy)}</b><small>${l.issuedAt}</small></td><td class="num">${l.printCount}</td>
    <td class="act"><button class="btn sm" data-act="lkMenu" data-no="${l.no}">⋮</button>${LK.menu===l.no?`<div class="menu"><button data-act="lkTrace" data-no="${l.no}">Chi tiết</button><button data-act="lkFirstOne" data-no="${l.no}" ${canFirst(l)?'':'disabled'}>Tạo và in</button><button data-act="lkCancelOne" data-no="${l.no}" ${canCancel(l)?'':'disabled'}>Hủy tem</button><button data-act="lkAgainOne" data-no="${l.no}" ${canAgain(l)?'':'disabled'}>In lại</button></div>`:''}</td></tr>`;
  }).join('')||`<tr><td colspan="16"><div class="empty"><i>🔎</i><b>Không tìm thấy tem nào</b><span>Thử bỏ bớt bộ lọc.</span></div></td></tr>`;

  return `<div class="card"><div class="card-hd"><span>Tìm kiếm tem <small>Quét mã vạch vào trường bất kỳ để tìm nhanh tem tương ứng.</small></span><span><button class="btn sm" data-act="lkClear">⟲ Xóa</button> <button class="btn pri sm" data-act="rerender">🔍 Tìm kiếm</button></span></div><div class="card-bd">
  <div class="row">${inp('scan','Số tem / mã vạch','Quét hoặc nhập…')}${inp('item','Mã nguyên vật liệu','ví dụ KHAC010001')}${inp('supplier','Nhà cung cấp','')}${inp('doc','Số PO / chứng từ liên quan','','data-chg="mod"')}</div>
  <div class="row" style="margin-top:10px">${dt('from','Ngày phát hành từ')}${dt('to','đến')}${statusSel}${whSel}</div>
  <div class="row" style="margin-top:10px">${locSel}${inp('so','SO','','data-chg="new"')}${dt('inFrom','Ngày nhập từ','data-chg="new"')}${dt('inTo','đến','data-chg="new"')}${slipSel}</div>
  <div class="note info" style="margin-top:10px">Giữ nguyên các tham số truy vấn hiện có (trừ Lô / Mẻ đã bỏ). Thêm 5 tham số mới: Vị trí, SO, Ngày nhập (từ, đến), Gán phiếu nhập.</div></div></div>
  <div class="card"><div class="card-hd"><span>Kết quả <span class="chip gray" style="margin-left:6px">Tìm thấy ${rows.length} bản ghi</span></span>
  <span style="display:flex;gap:8px"><button class="btn sm" data-act="lkFirst" ${selFirst.length?'':'disabled'} data-chg="new" title="Chọn nhiều tem Đã phát hành, in lần đầu, A4 4 tem">🖨 Tạo và in (${selFirst.length})</button><button class="btn sm" data-act="lkAgain" ${selAgain.length?'':'disabled'} data-chg="new" title="Chọn nhiều tem đã in, in lại, A4 4 tem">🖨 In lại (${selAgain.length})</button><button class="btn sm" data-act="lkBulk" ${selNos.length?'':'disabled'} title="Sửa hàng loạt SO và các trường liên quan của tem đã chọn">✎ Sửa hàng loạt (${selNos.length})</button><button class="btn sm danger" data-act="lkCancel" ${selCancel.length?'':'disabled'}>Hủy tem (${selCancel.length})</button><button class="btn sm" data-act="lkExport">⬇ Xuất dữ liệu</button></span></div><div class="card-bd">
  <div class="tbwrap"><table class="tb" style="min-width:1700px"><thead><tr><th><input type="checkbox" data-act="lkSelAll"></th><th>Số tem</th><th>Trạng thái</th><th>Nguyên vật liệu</th><th class="num">SL in tem</th><th class="num" data-chg="new">Tồn kho</th><th data-chg="new">Vị trí</th><th data-chg="new">Ngày nhập</th><th data-chg="new">Phiếu nhập</th><th data-chg="new">SO</th><th data-chg="new">Tem cha</th><th>Nhà cung cấp</th><th>Số PO / chứng từ nguồn</th><th>Phát hành bởi / lúc</th><th class="num">Số lần in</th><th>Thao tác</th></tr></thead><tbody>${rowsHtml}</tbody></table></div>

}

/* =============== HÀNH ĐỘNG TẠO NHÃN =============== */
function execCreate(P,andPrint){
  const nos=[], t=TODAY+' '+nowStr();
  if(REQLIKE.includes(P.kind)){
    P.labels.forEach(x=>{const l=L(newLabelNo(),{status:'issued',item:x.item,qty:x.qty,supplier:I.req.supplier||'',po:I.req.po||'',src:I.req.no,so:x.so,wh:I.req.wh,reqQty:(x.line&&x.line.qty)||0,checklist:(x.line&&x.line.checklist)||'',mfg:(x.line&&x.line.mfg)||'',batch:(x.line&&x.line.batch)||'',pack:x.pack||'',remark:(x.line&&x.line.remark)||'',issuedAt:t});ev(l,'Phát hành tem từ '+I.req.no);DB.labels.push(l);nos.push(l.no);});
    I.lines.forEach((l,i)=>{if(I.sel[i]){if(I.src==='request'&&l.groups&&l.groups.length)DEFAULTS[l.item+'|'+(I.req.supplier||'')]=l.groups[0].per;l.issued+=+l.need;I.req.lines[i].issued=l.issued;l.need=Math.max(l.qty-l.issued,0);l.groups=[];l.open=false;}});
    I.sel={};
  }else if(P.kind==='return-old'){
    const par=P.par; par.remaining+=P.retQty; if(par.status!=='cancelled') par.status='stock'; ev(par,'Trả lại '+fmt(P.retQty)+' vào tem này (cộng lại vào tồn kho), phiếu nhập trả lại đồng bộ SAP');
    I.parent.retQty=''; toast('Đã cộng lại '+fmt(P.retQty)+' vào tem '+par.no+'. Tồn kho: '+fmt(par.remaining)); I.attempt=false; render(); return;
  }else if(P.kind==='merge'){
    const par=P.par, src=P.mergeSrc, sum=P.labels[0].qty, minDate=src.map(x=>x.inDate).sort()[0], oldest=src.slice().sort((a,b)=>a.inDate.localeCompare(b.inDate))[0];
    const l=L(newLabelNo(),{status:'stock',item:par.item,qty:sum,remaining:sum,loc:P.labels[0].loc,wh:par.wh,parent:src[0].no,parents:src.map(x=>x.no),inDate:minDate,slipNo:oldest.slipNo,so:par.so,supplier:par.supplier,po:par.po,src:par.src,note:P.labels[0].note,issuedAt:t});
    ev(l,'Gộp từ '+src.map(x=>x.no).join(', ')+'; ngày nhập lấy của tem cũ nhất: '+dmy(minDate)); DB.labels.push(l); nos.push(l.no);
    src.forEach(x=>{ev(x,'Gộp '+fmt(x.remaining)+' vào tem '+l.no+'; tem về 0 và đóng');x.remaining=0;x.status='empty';});
    I.parent.merge={};
  }else if(P.kind==='parent'||['split','ng','other','return-new'].includes(P.kind)){
    const par=P.par, reasonTxt={split:'tách pallet',ng:'hàng NG tách',other:'lý do khác: '+I.parent.other,'return-new':'trả lại (tem mới)'}[P.kind];
    P.labels.forEach(x=>{const l=L(newLabelNo(),{status:'stock',item:par.item,qty:x.qty,remaining:x.qty,loc:x.loc||par.loc,wh:par.wh,parent:par.no,inDate:par.inDate,slipNo:par.slipNo,so:par.so,supplier:par.supplier,po:par.po,src:par.src,checklist:par.checklist||'',mfg:par.mfg||'',batch:par.batch||'',pack:par.pack||'',remark:par.remark||'',ng:P.kind==='ng',note:x.note,issuedAt:t});
      ev(l,'Tạo từ tem gốc '+par.no+' ('+reasonTxt+'); kế thừa ngày nhập '+dmy(par.inDate)+' và phiếu '+(par.slipNo||'—')); DB.labels.push(l); nos.push(l.no);});
    if(P.kind!=='return-new'){ par.remaining-=P.sum; ev(par,'Tách '+fmt(P.sum)+' sang '+nos.join(', ')); if(par.remaining<=0){par.status='empty';ev(par,'Tem về 0 và đóng');} }
    else ev(par,'Trả lại '+fmt(P.sum)+' bằng tem mới '+nos.join(', '));
    I.parent.rows=[{qty:'',loc:'',note:''}];
  }else if(P.kind==='manual'){
    const m=I.manual;
    P.labels.forEach(x=>{const lc=DB.locs.find(z=>z.code===x.loc)||{wh:'K01'};const l=L(newLabelNo(),{status:'issued',manual:true,item:x.item,qty:x.qty,loc:x.loc,wh:lc.wh,so:x.so,note:x.note,reason:m.reason.startsWith('Khác')?(m.other.trim()||'Khác'):m.reason,issuedAt:t,src:MANUAL,inDatePlan:x.date});
      ev(l,MANUAL+': '+l.reason+' · ngày nhập dự kiến '+dmy(x.date)); DB.labels.push(l); nos.push(l.no);});
    I.manual.rows=[mrow()];
  }
  I.attempt=false;
  M=andPrint?{name:'print',mode:'first',nos,printer:PRINTERS[0],paper:PAPERS[0],copies:1,reason:''}:{name:'created',nos,kind:P.kind};
  render();
}

function slipValidate(s){

function asTryAdd(no){
  const s=N.slip,line=s.lines[M.i]; no=(no||'').trim(); if(!no) return;

  else if(l.status==='cancelled') M.msg='Tem đã hủy';

  else if(l.src!==s.reqNo) M.msg='Tem không thuộc yêu cầu '+s.reqNo;

  renderModal();
}

function download(name,text){const b=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function csvLine(a){return a.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',');}
function validateImp(r){
  if(!ITEMS[r.item]) return 'Mã hàng không có trong danh mục';
  if(!(+r.per>0)) return 'SL/tem không hợp lệ';
  if(!(+r.count>=1)||(+r.count)%1) return 'Số tem không hợp lệ';
  if(!DB.locs.some(x=>x.code===r.loc)) return 'Vị trí không tồn tại';
  if(r.date&&!/^\d{4}-\d{2}-\d{2}$/.test(r.date)) return 'Ngày không hợp lệ (YYYY-MM-DD)';
  return '';
}
function parseCsv(text){
  const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim()); if(!lines.length) return [];
  const split=s=>{const o=[];let cur='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(q&&s[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(c===','&&!q){o.push(cur);cur='';}else cur+=c;}o.push(cur);return o.map(x=>x.trim());};
  const head=split(lines[0]).map(x=>x.toLowerCase()); const idx=k=>head.indexOf(k);
  return lines.slice(1).map(l=>{const c=split(l);const r={item:c[idx('ma_hang')]||'',per:c[idx('sl_moi_tem')]||'',count:c[idx('so_tem')]||'',loc:c[idx('vi_tri')]||'',so:c[idx('so')]||'',date:c[idx('ngay_nhap')]||'',note:c[idx('ghi_chu')]||''};r.err=validateImp(r);return r;});
}

/* ---- giữ con trỏ khi vẽ lại (nhập liệu liên tục không bị mất focus) ---- */
let FSIG=null,FMODE=null;
function sig(el){if(!el||!el.dataset||!el.tagName)return null;return el.tagName+'|'+Object.keys(el.dataset).map(k=>k+'='+el.dataset[k]).join('&');}
function findBySig(s){return $$('[data-act]').find(x=>sig(x)===s);}
function restoreFocus(){
  if(!FSIG)return; const s=FSIG,m=FMODE; FSIG=null;
  const root=$('#modals').innerHTML?$('#modals'):$('#content');
  if(m==='click'||m==='same'){const el=findBySig(s);if(el&&/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)){el.focus();if(m==='click'&&el.tagName==='INPUT'&&/^(text|number|search|)$/.test(el.type)){try{el.select();}catch(_){}}}}
  else{const els=$$('input:not([type=hidden]):not([disabled]),select:not([disabled]),textarea,button:not([disabled])',root);const cur=findBySig(s);const i=els.indexOf(cur);const nx=els[i+(m==='prev'?-1:1)];if(nx)nx.focus();}
}
document.addEventListener('mousedown',e=>{const t=e.target.closest('input,select,textarea');FSIG=t?sig(t):null;FMODE='click';},true);
document.addEventListener('keydown',e=>{
  const a=document.activeElement;
  if(e.key==='Tab'&&a&&a.dataset&&a.dataset.act){FSIG=sig(a);FMODE=e.shiftKey?'prev':'next';}
  else if(e.key==='Enter'&&a&&a.tagName==='INPUT'&&a.dataset.act){FSIG=sig(a);FMODE='same';}
},true);
document.addEventListener('click',()=>{setTimeout(()=>{FSIG=null;},0);});
document.addEventListener('keyup',()=>{setTimeout(()=>{FSIG=null;},0);});

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(LK&&LK.menu&&!(t&&t.dataset.act==='lkMenu')&&!e.target.closest('.menu')){LK.menu='';if(!t||!ACT[t.dataset.act]) render();}
  if(!t)return; if(/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)||t.tagName==='LABEL')return;
  const f=ACT[t.dataset.act]; if(f) f(t,e);
});
document.addEventListener('change',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=CHG[t.dataset.act];if(f)f(t,e);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(M){M=null;render();}else if(DR||NOTES_OPEN){DR=null;NOTES_OPEN=false;renderDrawer();}}});

function applyLines(s,reverse){
  s.lines.forEach(l=>{const lb=lblByNo(l.label); if(!lb)return;
    if(l.action==='ADJUST_IN'||l.action==='ADJUST_OUT'){lb.remaining=reverse?l.before:l.after; lb.status=lb.remaining>0?'stock':'empty';}
    if(l.action==='MOVE_LOCATION'){lb.loc=reverse?l.srcLoc:l.dstLoc;}
    if(l.action==='MOVE_WAREHOUSE'){lb.wh=reverse?l.srcWh:l.dstWh;}
    ev(lb,(reverse?'Hủy phiếu điều chỉnh ':'Duyệt phiếu điều chỉnh ')+s.no+': '+tr(ACT_TP,l.action)+(l.action.startsWith('ADJUST')?' ('+fmt(l.before)+' → '+fmt(l.after)+')':''));});
}
function validateAdjDate(date,lines,full){
  if(date>TODAY) return 'Ngày điều chỉnh không được ở tương lai.';
  if(full){const b=periodBegin(lines.map(l=>l.srcLoc));if(b&&date<b) return 'Ngày điều chỉnh nằm trước đầu kỳ chốt gần nhất ('+dmy(b)+') của vị trí trên phiếu. Chọn ngày từ '+dmy(b)+' đến hôm nay.';}
  return '';
}

/* =============== DANH MỤC VỊ TRÍ (theo code Location Master) =============== */
function fakeQr(code){
  let h=0;for(const c of code)h=(h*31+c.charCodeAt(0))>>>0;let cells='';const n=21;
  const finder=(x,y)=>(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){let on;if(finder(x,y)){const fx=x<7?x:x-(n-7),fy=y<7?y:y-(n-7);on=(fx===0||fx===6||fy===0||fy===6||(fx>=2&&fx<=4&&fy>=2&&fy<=4));}else{h=(h*1103515245+12345)>>>0;on=(h>>16)&1;}if(on)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}
  return `<svg viewBox="0 0 21 21" width="100%" height="100%" shape-rendering="crispEdges" fill="#111">${cells}</svg>`;
}

  slipSubmitAdj:()=>{const s=DB.adjSlips.find(x=>x.no===AJ.detail);const e=validateAdjDate(s.date,s.lines,true);if(e){AJ.err=e;render();return;}s.status='Pending';AJ.err='';tlog(s,'Trình duyệt');toast('Đã trình duyệt '+s.no);render();},
  slipApproveAdj:()=>{const s=DB.adjSlips.find(x=>x.no===AJ.detail);const e=validateAdjDate(s.date,s.lines,true);if(e){AJ.err=e;render();return;}applyLines(s,false);s.status='Approved';s.reviewer='admin';s.issueIds.forEach(id=>DB.issues.find(x=>x.id===id).status='RESOLVED');AJ.err='';tlog(s,'Duyệt: ghi tồn');toast('Đã duyệt '+s.no+' và ghi tồn');render();},
  slipRejectAdj:()=>{M={name:'slipReason',kind:'reject',reason:''};render();},
  slipCancelAdj:()=>{M={name:'slipReason',kind:'cancel',reason:''};render();},
  srConfirm:()=>{const s=DB.adjSlips.find(x=>x.no===AJ.detail);if(M.kind==='reject'){s.status='Rejected';s.issueIds.forEach(id=>{const i=DB.issues.find(x=>x.id===id);i.status='OPEN';i.slip='';});tlog(s,'Từ chối: '+M.reason);toast('Đã từ chối; sai lệch được mở lại');}else{applyLines(s,true);s.status='Cancelled';s.issueIds.forEach(id=>{const i=DB.issues.find(x=>x.id===id);i.status='OPEN';i.slip='';});tlog(s,'Hủy phiếu đã duyệt: '+M.reason+' (đảo bút toán)');toast('Đã hủy '+s.no+' và đảo bút toán tồn');}M=null;render();},
  cyDone:t=>{M={name:'cyDone',no:t.dataset.no,reason:'',accepted:false};render();},
  cyExclude:t=>{const c=cycleOf(M.no);const x=c.scope.find(y=>y.no===t.dataset.no);x.excluded=true;toast('Đã loại '+x.no+' khỏi phạm vi: '+M.reason);M.reason='';render();},
  cyGoAdj:()=>{M=null;openView('adjust');},
  cyConfirm:()=>{const c=cycleOf(M.no);DB.adjSlips.filter(s=>s.cycle===c.no&&['Draft','Pending'].includes(s.status)).forEach(s=>{if(s.status==='Draft'){s.status='Pending';tlog(s,'Trình duyệt (Hoàn tất kỳ)');}applyLines(s,false);s.status='Approved';s.reviewer='admin';s.issueIds.forEach(id=>DB.issues.find(x=>x.id===id).status='RESOLVED');tlog(s,'Duyệt (Hoàn tất kỳ)');});c.done=true;toast('Đã hoàn tất '+c.no+': phiếu đã được duyệt hộ, kỳ bị khóa');M=null;render();},
  clBulk:()=>{M={name:'bulkClose',wh:'K01',zone:'',date:YESTERDAY,sel:{},single:false};render();},
  clOne:()=>{M={name:'bulkClose',wh:'K01',zone:'',date:YESTERDAY,sel:{},single:true};render();},
  bcAll:()=>{const rows=DB.locs.filter(x=>x.wh===M.wh&&/^K0\d-/.test(x.code)&&(!M.zone||x.zone===M.zone));M.sel={};rows.forEach(x=>{if(!closeCheck(x.code,M.date))M.sel[x.code]=true;});renderModal();},
  bcNone:()=>{M.sel={};renderModal();},
  bcConfirm:()=>{let n=0;Object.keys(M.sel).forEach(code=>{if(M.sel[code]&&!closeCheck(code,M.date)){const lc=lastClosing(code);DB.clzCnt+=1;DB.closings.push({no:'SCL-'+M.date.replace(/-/g,'')+'-'+String(DB.clzCnt).padStart(8,'0'),loc:code,wh:M.wh,date:M.date,begin:lc?new Date(new Date(lc.date).getTime()+864e5).toISOString().slice(0,10):'2026-09-01',cycle:'',st:'Đã chốt'});n++;}});toast('Đã chốt '+n+' vị trí đến ngày '+dmy(M.date));M=null;render();},
  lcDoPrint:()=>{toast('Đã gửi lệnh in tem vị trí (mỗi vị trí một trang 80 × 50 mm)');M=null;render();},
  alGen:()=>{const m=M;let n=DB.locs.filter(x=>x.wh===m.wh).length+1;let id=m.wh+'-'+String(n).padStart(4,'0');while(DB.locs.some(x=>x.code===id)){n++;id=m.wh+'-'+String(n).padStart(4,'0');}m.code=id;renderModal();},
  alSave:()=>{const m=M,name=`${m.rack}-${m.floor}-${String(m.cell).padStart(2,'0')}`;let id=m.code;if(!id){let n=DB.locs.filter(x=>x.wh===m.wh).length+1;id=m.wh+'-'+String(n).padStart(4,'0');while(DB.locs.some(x=>x.code===id)){n++;id=m.wh+'-'+String(n).padStart(4,'0');}}DB.locs.unshift({code:id,name,st:'Active',qr:m.code?'Assigned':'Pending Generation',path:m.wh+(m.zone?' > '+m.zone:''),type:m.type,wh:m.wh,zone:m.zone});toast('Đã thêm vị trí '+id+' ('+name+'), QR: '+(m.code?'Assigned':'Pending Generation'));M=null;render();}
});
function saveAdj(submit){
  const iss=M.ids.map(id=>DB.issues.find(x=>x.id===id)), lines=iss.map(lineOf);
  let e=validateAdjDate(M.date,lines,submit); if(e){M.err=e;renderModal();return;}
  let s=M.slip?DB.adjSlips.find(x=>x.no===M.slip):null;
  if(!s){s={no:'ADJ-2026-'+String(DB.adjCnt++).padStart(3,'0'),cycle:iss[0].cycle,status:'Draft',date:M.date,note:M.note,createdBy:'admin',createdAt:TODAY+' '+nowStr().slice(0,5),reviewer:'',issueIds:M.ids.slice(),lines,timeline:[]};DB.adjSlips.push(s);tlog(s,'Tạo nháp');iss.forEach(i=>{i.status='CLAIMED';i.slip=s.no;});}
  else{s.date=M.date;s.note=M.note;}
  if(submit){s.status='Pending';tlog(s,'Trình duyệt');}
  AJ.sel={};AJ.tab='slips';AJ.detail=s.no;toast((submit?'Đã lưu và trình duyệt ':'Đã lưu nháp ')+s.no);M=null;render();
}

<script>
'use strict';
/* =============== POPUP CHỌN NGUỒN (theo màn hiện tại) =============== */
const PKT={
  request:{title:'Chọn yêu cầu nhập kho NVL',no:'Số yêu cầu nhập kho NVL',ph:'Tìm số yêu cầu nhập kho NVL',dateLbl:'Ngày yêu cầu',second:'sup',
    cols:[['Số yêu cầu nhập kho NVL','no'],['Ngày yêu cầu','date'],['Số PO','po'],['Nhà cung cấp','supplier']]},
  production:{title:'Chọn sản lượng sản xuất',no:'Số sản lượng sản xuất',ph:'Tìm số sản lượng sản xuất',dateLbl:'Ngày sản lượng',second:'wo',
    cols:[['Số sản lượng sản xuất','no'],['Ngày sản lượng','date'],['Số lệnh sản xuất','wo'],['Kho','wh']]},
  repack:{title:'Chọn trả lại / đóng gói lại',no:'Số trả lại / đóng gói lại',ph:'Tìm số trả lại / đóng gói lại',dateLbl:'Ngày giao dịch',second:'mode',
    cols:[['Số trả lại / đóng gói lại','no'],['Ngày giao dịch','date'],['Loại','mode'],['Tham chiếu nguồn','ref'],['Kho','wh']]}
};
function pkRows(){
  const f=M.f; const list=reqList();
  return list.filter(r=>{
    if(f.no&&!r.no.toLowerCase().includes(f.no.toLowerCase())) return false;
    if(I.src==='request'&&f.sup&&r.supplier!==f.sup) return false;
    if(I.src==='production'){ if(f.wo&&!(r.wo||'').toLowerCase().includes(f.wo.toLowerCase())) return false; if(f.wh&&r.wh!==f.wh) return false; }
    if(I.src==='repack'){ if(f.mode&&r.mode!==f.mode) return false; if(f.wh&&r.wh!==f.wh) return false; }
    if(f.from&&r.date<f.from) return false; if(f.to&&r.date>f.to) return false; return true;
  }).sort((a,b)=>b.date.localeCompare(a.date)||b.no.localeCompare(a.no));
}
const chipLabelling=r=>{const tot=r.lines.reduce((a,l)=>a+l.qty,0),iss=r.lines.reduce((a,l)=>a+l.issued,0);
  if(iss<=0) return '<span class="chip amber">Chưa dán tem</span>';
  if(iss>=tot) return '<span class="chip green">Đã dán tem đầy đủ</span>';
  return `<span class="chip blue">Dán một phần (${fmt(iss)} / ${fmt(tot)})</span>`;};
const isFull=r=>r.lines.reduce((a,l)=>a+l.issued,0)>=r.lines.reduce((a,l)=>a+l.qty,0);
MODALS.pickReq=function(){
  const C=PKT[I.src], f=M.f, rows=pkRows();
  const sups=[...new Set(DB.requests.map(r=>r.supplier))], whs=['K01','K02','K03','K04'];
  const selOpt=(k,label,arr,mapFn)=>`<div class="fld"><label>${label}</label><select data-act="pkf" data-k="${k}"><option value="">Tất cả</option>${arr.map(x=>mapFn?mapFn(x):`<option ${f[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
  let fields=`<div class="fld"><label>${C.no}</label><input data-act="pkf" data-k="no" value="${esc(f.no)}" placeholder="${C.ph}"></div>`;
  if(I.src==='request') fields+=selOpt('sup','Nhà cung cấp',sups);
  if(I.src==='production') fields+=`<div class="fld"><label>Số lệnh sản xuất</label><input data-act="pkf" data-k="wo" value="${esc(f.wo)}" placeholder="Tìm số lệnh sản xuất"></div>`+selOpt('wh','Kho',whs);
  if(I.src==='repack') fields+=selOpt('mode','Loại',['RETURN','REPACK'],x=>`<option value="${x}" ${f.mode===x?'selected':''}>${x==='RETURN'?'Trả lại':'Đóng gói lại'}</option>`)+selOpt('wh','Kho',whs);
  fields+=`<div class="fld"><label>${C.dateLbl}</label><div class="inl"><input type="date" data-act="pkf" data-k="from" value="${f.from}"><input type="date" data-act="pkf" data-k="to" value="${f.to}"></div></div>`;
  const cell=(r,k)=>{if(k==='mode')return r.mode==='RETURN'?'<span class="chip blue">Trả lại</span>':(r.mode==='REPACK'?'<span class="chip gray">Đóng gói lại</span>':'—');return esc(r[k]||'–');};
  return {title:C.title,wide:true,body:`<div class="pkpanel"><div class="row">${fields}<div style="display:flex;gap:8px"><button class="btn" data-act="pkReset">⟲ Reset</button><button class="btn pri" data-act="rerender">🔍 Search</button></div></div></div>
  <div class="tbwrap"><table class="tb" style="min-width:0"><thead><tr>${C.cols.map(c=>`<th>${c[0]} <span class="muted">⇅</span></th>`).join('')}<th class="num">Mặt hàng</th><th>Tình trạng dán tem</th></tr></thead><tbody>
  ${rows.map(r=>{const full=isFull(r);return `<tr class="pkrow ${M.sel===r.no?'sel':''} ${full?'dis':''}" data-act="pkRow" data-no="${r.no}">${C.cols.map(c=>`<td>${cell(r,c[1])}</td>`).join('')}<td class="num">${r.lines.length}</td><td>${chipLabelling(r)}</td></tr>`;}).join('')||`<tr><td colspan="${C.cols.length+2}"><div class="empty"><i>🔎</i><b>Không có dữ liệu</b></div></td></tr>`}
  </tbody></table></div>
  <div class="pager"><span class="muted">${rows.length} bản ghi</span><button class="btn sm on">1</button><select style="padding:4px"><option>20 / trang</option></select><span>Đến</span><input style="width:70px" placeholder="Nhập"><span>Trang</span></div>`,
  foot:`<button class="btn" data-act="mclose">Hủy</button><button class="btn pri" data-act="pkChoose" ${M.sel?'':'disabled'}>Chọn</button>`};
};
MODALS_EXT.pickParent=function(){
  const f=M.f;
  const rows=DB.labels.filter(l=>['stock','empty','consumed','reserved'].includes(l.status)).filter(l=>{
    const it=ITEMS[l.item]||{name:''};
    if(f.code&&!l.no.toLowerCase().includes(f.code.toLowerCase())) return false;
    if(f.item&&!(l.item+' '+it.name).toLowerCase().includes(f.item.toLowerCase())) return false;
    if(f.wh&&l.wh!==f.wh) return false; if(f.loc&&l.loc!==f.loc) return false;
    if(f.so&&!(l.so||'').toLowerCase().includes(f.so.toLowerCase())) return false; return true;}).sort((a,b)=>b.no.localeCompare(a.no));
  return {title:'Chọn tem gốc',wide:true,body:`<div class="pkpanel"><div class="row">
  <div class="fld"><label>Mã tem</label><input data-act="pgf" data-k="code" value="${esc(f.code)}" placeholder="Quét hoặc nhập mã tem"></div>
  <div class="fld"><label>Mã / Tên mặt hàng</label><input data-act="pgf" data-k="item" value="${esc(f.item)}" placeholder="Nhập mặt hàng"></div>
  <div class="fld"><label>Kho</label><select data-act="pgf" data-k="wh"><option value="">Tất cả</option>${['K01','K02','K03','K04'].map(w=>`<option ${f.wh===w?'selected':''}>${w}</option>`).join('')}</select></div>
  <div class="fld"><label>Vị trí</label><select data-act="pgf" data-k="loc"><option value="">Tất cả</option>${locOpts(f.loc)}</select></div>
  <div class="fld"><label>SO</label><input data-act="pgf" data-k="so" value="${esc(f.so)}"></div>
  <div style="display:flex;gap:8px"><button class="btn" data-act="pgReset">⟲ Reset</button><button class="btn pri" data-act="rerender">🔍 Search</button></div></div></div>
  <div class="tbwrap"><table class="tb" style="min-width:0"><thead><tr><th>Mã tem</th><th>Mặt hàng</th><th class="num">SL in tem</th><th class="num" data-chg="mod">Tồn kho</th><th>Vị trí</th><th>Ngày nhập</th><th>Phiếu nhập</th><th>SO</th><th>Nhà cung cấp</th><th>Trạng thái</th></tr></thead><tbody>
  ${rows.map(l=>{const it=ITEMS[l.item]||{name:'',uom:''},st=statusInfo(l);return `<tr class="pkrow ${M.sel===l.no?'sel':''}" data-act="pgRow" data-no="${l.no}"><td>${l.no}</td><td><b>${esc(it.name)}</b><small>${l.item}</small></td><td class="num">${fmt(l.qty)} ${it.uom}</td><td class="num">${fmt(l.remaining)} ${it.uom}</td><td>${esc(l.loc||'—')}</td><td>${dmy(l.inDate)}</td><td>${esc(l.slipNo||'—')}</td><td>${esc(l.so||'—')}</td><td>${esc(l.supplier||'—')}</td><td><span class="chip ${st[1]}">${st[0]}</span></td></tr>`;}).join('')||'<tr><td colspan="10"><div class="empty"><i>🔎</i><b>Không có tem phù hợp</b></div></td></tr>'}
  </tbody></table></div>`,foot:`<button class="btn" data-act="mclose">Hủy</button><button class="btn pri" data-act="pgChoose" ${M.sel?'':'disabled'}>Chọn</button>`};
};
MODALS_EXT.mImport=function(){
  const imp=M.imp, ok=imp?imp.rows.filter(r=>!r.err).length:0;
  return {title:'Import Excel · '+MANUAL,wide:true,body:`<div class="muted" style="margin-bottom:8px">Nhập nhiều tem một lần (ví dụ tồn đầu kỳ). Chọn file theo mẫu, hệ thống kiểm tra từng dòng trước khi nhập vào bảng. Mẫu file sẽ chốt sau khi chốt giao diện nhập liệu.</div>
  <label class="drop"><input type="file" accept=".csv,.xlsx,text/csv" data-act="mFile" style="display:none"><b>Kéo thả file vào đây hoặc bấm để chọn</b><span class="muted">Hệ thống thật dùng file .xlsx; bản thử nghiệm đọc file .csv</span></label>
  <div class="row" style="margin-top:10px"><button class="btn" data-act="mTemplate">⬇ Tải file mẫu</button><button class="btn" data-act="mSample">Dùng dữ liệu mẫu</button></div>
  ${imp?`<div class="tbwrap" style="margin-top:10px"><table class="tb" style="min-width:760px"><thead><tr><th>#</th><th>Mã hàng</th><th>SL/tem</th><th>Số tem</th><th>Vị trí</th><th>SO</th><th>Ngày nhập</th><th>Kết quả</th></tr></thead><tbody>${imp.rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.item)}</td><td>${esc(r.per)}</td><td>${esc(r.count)}</td><td>${esc(r.loc)}</td><td>${esc(r.so||'—')}</td><td>${esc(r.date||'—')}</td><td>${r.err?`<span class="chip red">${esc(r.err)}</span>`:'<span class="chip green">Hợp lệ</span>'}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:8px">${ok} dòng hợp lệ · ${imp.rows.length-ok} dòng lỗi (dòng lỗi không được nhập)</div>`:''}`,
  foot:`<button class="btn" data-act="mclose">Hủy</button><button class="btn pri" data-act="mApply" ${ok?'':'disabled'}>Nhập vào bảng</button>`};
};
Object.assign(ACT,{
  pickReq:()=>{M={name:'pickReq',f:{no:'',sup:'',wo:'',wh:'',mode:'',from:'',to:''},sel:''};render();},
  pkRow:t=>{const r=reqList().find(x=>x.no===t.dataset.no);if(isFull(r)){toast('Chứng từ này đã dán tem đầy đủ, không chọn được');return;}M.sel=t.dataset.no;renderModal();},
  pkChoose:()=>{const no=M.sel;M=null;loadReq(no);render();},
  pkReset:()=>{M.f={no:'',sup:'',wo:'',wh:'',mode:'',from:'',to:''};renderModal();},
  pickParent:()=>{M={name:'pickParent',f:{code:'',item:'',wh:'',loc:'',so:''},sel:''};render();},
  pgRow:t=>{M.sel=t.dataset.no;renderModal();},
  pgReset:()=>{M.f={code:'',item:'',wh:'',loc:'',so:''};renderModal();},
  pgChoose:()=>{const no=M.sel;M=null;I.parent.no=no;const par=lblByNo(no);I.parent.merge=(par&&I.parent.reason==='merge')?{[par.no]:true}:{};render();},
  mImportOpen:()=>{M={name:'mImport',imp:null};render();},
  mSample:()=>{M.imp={rows:SAMPLE_IMP.map(r=>Object.assign({},r,{err:validateImp(r)}))};renderModal();},
  mApply:()=>{const ok=M.imp.rows.filter(r=>!r.err).map(r=>({item:r.item,per:r.per,count:r.count,loc:r.loc,so:r.so,date:r.date||TODAY,note:r.note}));const cur=I.manual.rows.filter(r=>r.item||r.per||r.loc);I.manual.rows=cur.concat(ok);M=null;toast('Đã nhập '+ok.length+' dòng hợp lệ vào bảng');render();}
});
Object.assign(CHG,{
  pkf:t=>{M.f[t.dataset.k]=t.value;renderModal();},
  pgf:t=>{M.f[t.dataset.k]=t.value;renderModal();},
  prevRow:t=>{I.prevRow=t.value;render();},
  mFile:t=>{const f=t.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{M.imp={rows:parseCsv(String(rd.result))};renderModal();};rd.readAsText(f);}
});
