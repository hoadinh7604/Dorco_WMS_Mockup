<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xuất khác 3020020 – Upload Excel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell của Dorco WMS (rail tối + menu con + vùng làm việc sáng), giữ cấu trúc màn 3020020 hiện tại */
:root{
  --bg:#f8fafc; --surface:#ffffff; --fg:#0d121c; --muted:#64748b; --line:#e2e8f0; --line2:#cbd5e1;
  --side:#0d121c; --side2:#141b27; --side-fg:#cbd5e1; --side-muted:#8b95a7;
  --lime:#c8fb5b; --lime-soft:#f8ffe5; --lime-fg:#0d121c;
  --input:#ffffff; --disabled:#f1f5f9; --hover:#f1f5f9;
  --ok:#15803d; --ok-soft:#dcfce7; --warn:#a16207; --warn-soft:#fef9c3; --bad:#dc2626; --bad-soft:#fee2e2; --info:#1d4ed8; --info-soft:#dbeafe;
  --shadow:0 10px 30px rgba(15,23,42,.18);
  --font:"Noto Sans","Noto Sans KR",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1018; --surface:#121925; --fg:#e5e9f0; --muted:#94a3b8; --line:#243044; --line2:#334155;
  --side:#070b11; --side2:#0e141e; --side-fg:#cbd5e1; --side-muted:#7c879a;
  --lime:#b9ec4c; --lime-soft:#1d2612; --lime-fg:#0d121c;
  --input:#0f1621; --disabled:#18202d; --hover:#1a2331;
  --ok:#4ade80; --ok-soft:#14301f; --warn:#facc15; --warn-soft:#2e2810; --bad:#f87171; --bad-soft:#3a1717; --info:#93c5fd; --info-soft:#172540;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1018; --surface:#121925; --fg:#e5e9f0; --muted:#94a3b8; --line:#243044; --line2:#334155;
  --side:#070b11; --side2:#0e141e; --side-fg:#cbd5e1; --side-muted:#7c879a;
  --lime:#b9ec4c; --lime-soft:#1d2612; --lime-fg:#0d121c;
  --input:#0f1621; --disabled:#18202d; --hover:#1a2331;
  --ok:#4ade80; --ok-soft:#14301f; --warn:#facc15; --warn-soft:#2e2810; --bad:#f87171; --bad-soft:#3a1717; --info:#93c5fd; --info-soft:#172540;
  --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100%}
/* sidebar */
.side{width:313px;flex:none;background:#0f141c;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;min-height:640px;overflow:hidden}
.logo{margin:14px 8px 0;height:34px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:12.5px;color:#0b2a6b;letter-spacing:-.2px}
.logo span{color:#1a5fd6}
.sidecols{display:flex;flex:1;min-height:0;margin-top:12px;border-top:1px solid #1e2632}
.rail{width:88px;color:#8b95a7;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:0;flex:none;border-right:1px solid #1e2632;overflow:hidden}
.rail .it{width:84px;text-align:center;font-size:11.5px;padding:5px 2px;line-height:1.2;cursor:pointer}
.rail .it svg{display:block;margin:0 auto 4px;width:18px;height:18px}
.rail .ic{display:grid;place-items:center;width:32px;height:32px;margin:0 auto 3px;border-radius:8px}
.rail .ic svg{margin:0}
.rail .it.on{color:#fff}.rail .it.on .ic{background:#2b3a1c;color:var(--lime)}
.rail .collapse{margin-top:auto;padding:10px 0 12px}
.submenu{flex:1;color:#cbd5e1;padding:10px 8px}
.submenu h4{margin:6px 0 18px;text-align:center;font-weight:600;color:#fff;font-size:15px}
.submenu a{display:block;padding:10px 24px;border-radius:8px;color:#8b95a7;text-decoration:none;margin:4px 0;font-size:15px}
.submenu a.on{background:var(--lime);color:#0d121c;font-weight:500}
.ftabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-2px 0 12px}
.ftabs button{border:0;background:none;padding:9px 14px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);display:inline-flex;gap:8px;align-items:center}
.ftabs button.on{color:var(--fg);border-bottom-color:var(--fg);font-weight:600}
.ftabs .cnt{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 10px}
.fgrid .s2{grid-column:span 2}
.dr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ico-in{position:relative}.ico-in svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted)}
.ico-in input,.f .ico-in input{padding-left:32px}
@media (max-width:1100px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}.fgrid .s2{grid-column:auto}}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 0 16px}
.wtab{border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;padding:8px 14px;background:var(--surface);font-size:13px}
.tright{display:flex;gap:14px;align-items:center;padding-bottom:8px;font-size:13px}
.tright select{border:1px solid var(--line);border-radius:6px;background:var(--input);padding:4px 8px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--lime-soft);border:1px solid var(--lime);display:grid;place-items:center;font-weight:600}
.content{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
h1{font-size:20px;margin:0 0 12px}
/* tabs */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;overflow-x:auto;margin-bottom:14px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:7px;white-space:nowrap;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--bg);color:var(--fg);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi .l{color:var(--muted);font-size:13px}.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.ph h3{margin:0;font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.f label{display:block;font-size:13px;margin-bottom:5px;color:var(--fg)}
.f label b{color:var(--bad);font-weight:600}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line2);border-radius:6px;background:var(--input);padding:7px 10px;min-height:36px}
.f textarea{min-height:60px;resize:vertical}
.f input[readonly],.f input:disabled,.f select:disabled{background:var(--disabled);color:var(--muted)}
.f.wide{grid-column:1/-1}
.sub{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px;margin-top:2px}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--lime);border-color:var(--lime);color:var(--lime-fg);font-weight:500}
.btn.soft{background:var(--lime-soft);border-color:var(--lime)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--info);padding:0;text-decoration:underline}
.btn:focus-visible,.tabs button:focus-visible{outline:2px solid var(--info);outline-offset:2px}
/* table */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{background:var(--bg);font-weight:600;color:var(--muted);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
td input,td select{border:1px solid var(--line2);border-radius:5px;background:var(--input);padding:4px 6px;width:100%;min-width:80px}
td input.n{text-align:right}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.s-SAVED{background:var(--bg);color:var(--muted)}.s-SUBMITTED{background:var(--info-soft);color:var(--info)}
.s-CLOSED,.s-APPROVED{background:var(--ok-soft);color:var(--ok)}.s-CANCELLED{background:var(--bad-soft);color:var(--bad)}
.s-DELETED{background:var(--bad-soft);color:var(--bad)}
.empty{padding:22px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.formbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.formbar h2{margin:0;font-size:17px;display:flex;gap:10px;align-items:center}
/* modal */
.ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:grid;place-items:center;padding:16px;z-index:50}
.md{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(860px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;min-width:0}
.md header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.md header h3{margin:0;font-size:16px}
.md .bd{padding:16px 18px;overflow:auto;min-width:0}
.md footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.drop{border:1.5px dashed var(--line2);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.files{display:grid;gap:8px;margin-top:12px}
.file{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;background:var(--surface);text-align:left;width:100%}
.file:hover{background:var(--hover)}
.file.on{border-color:var(--lime);background:var(--lime-soft)}
.xl{width:28px;height:28px;border-radius:5px;background:#107c41;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex:none}
.alert{border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;line-height:1.5}
.alert.bad{background:var(--bad-soft);color:var(--bad)}.alert.ok{background:var(--ok-soft);color:var(--ok)}.alert.info{background:var(--info-soft);color:var(--info)}
td.note{color:var(--bad);white-space:normal;min-width:260px}
tr.err td{background:var(--bad-soft)}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:60;box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 32px))}
.i{width:15px;height:15px;flex:none}
.btn.ib{padding:7px 9px}
.btn.kebab{border:1px solid transparent;background:none;padding:2px 10px;font-weight:700}
.btn.kebab:hover{border-color:var(--lime)}
.chip{border:1px solid var(--line2);border-radius:6px;padding:5px 10px;font-size:13px;background:var(--surface)}
.pop{position:absolute;z-index:70;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;min-width:180px}
.pop>button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:9px 12px;border-radius:6px;cursor:pointer;font-size:14.5px;text-align:left}
.pop>button:hover{background:var(--hover)}
.dp{width:290px;padding:10px}
.dph{display:flex;justify-content:space-between;align-items:center;padding:4px 4px 10px;border-bottom:1px solid var(--line)}
.dph button{border:0;background:none;cursor:pointer;color:var(--muted);font-size:16px;padding:2px 6px}
.dpg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 0;text-align:center}
.dpg span{font-size:13px;padding:6px 0}
.dpg button{border:0;background:none;border-radius:6px;padding:7px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.dpg button:hover{background:var(--hover)}
.dpg button.out{color:var(--line2)}
.dpg button.td{font-weight:700}
.dpg button.sel{background:var(--lime);color:#0d121c}
.dpf{border-top:1px solid var(--line);text-align:center;padding-top:8px}
.dpf button{border:0;background:none;color:#65a30d;cursor:pointer;padding:4px 10px}
.dp-wrap{position:relative}.dp-wrap input{padding-right:34px!important}
.dp-wrap .dp-c,.dp-wrap .dp-x{position:absolute;top:50%;transform:translateY(-50%);border:0;background:none;cursor:pointer;color:var(--muted);padding:2px}
.dp-wrap .dp-c{right:8px}.dp-wrap .dp-c svg{width:16px;height:16px;display:block}
.dp-wrap .dp-x{right:32px;font-size:11px}
.kh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.kic{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;flex:none}.kic svg{width:16px;height:16px}
.tag{display:inline-block;border:1px solid var(--line2);border-radius:5px;padding:1px 7px;font-size:12px;background:var(--surface)}
.thc{display:flex;align-items:center;gap:6px;justify-content:space-between}.n .thc{justify-content:flex-end}
.hm,.srt{color:var(--line2);font-weight:400}.hm{margin-left:auto;padding-left:6px}
th{color:var(--fg)!important}
.stk{position:sticky;right:0;background:var(--surface);box-shadow:-1px 0 0 var(--line)}
th.stk{background:var(--bg)}
.xp{width:22px;height:22px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);cursor:pointer;line-height:1}
tr.nest>td{background:var(--bg)!important;padding:10px 16px 14px}
.nestbox{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.pager{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap;font-size:13px}
.pager .pg{border:1px solid transparent;background:none;border-radius:6px;min-width:30px;height:30px;cursor:pointer;color:var(--muted)}
.pager .pg.on{border-color:#65a30d;color:var(--fg)}
.pager select,.pager input{border:1px solid var(--line2);border-radius:6px;background:var(--input);padding:5px 8px}
.ftabs .on .cnt{background:var(--lime-soft);border-color:var(--lime)}
.ftabs button.on{border-bottom-color:var(--lime)}
.pill{font-weight:500;border:1px solid currentColor;padding:1px 8px;border-radius:5px}
.tabs button{font-size:13px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 12px}.g4 .s2{grid-column:span 2}.g4 .s4{grid-column:1/-1}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:560px){.g4{grid-template-columns:1fr}.g4 .s2{grid-column:auto}}
.mapbtn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:5px;padding:2px 8px;color:var(--muted);font-size:12.5px}
.f textarea:disabled{background:var(--disabled);color:var(--muted)}
.sy-none{background:var(--bg);color:var(--muted);border-color:var(--line2)!important}.sy-ok{background:var(--ok-soft);color:var(--ok)}.sy-err{background:var(--bad-soft);color:var(--bad);cursor:help}.sy-run{background:var(--info-soft);color:var(--info)}
.spin{display:inline-block;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.cbc{width:36px;text-align:center}.cbc input{width:15px;height:15px;cursor:pointer}.cbc input:disabled{cursor:not-allowed;opacity:.45}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.legend{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){.side{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="app">
  <div class="side">
    <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 3 7v10l9 5 9-5V7z" fill="#1a5fd6"/><path d="M12 12 3 7l9-5 9 5z" fill="#5b9bff"/><path d="M12 12v10l9-5V7z" fill="#0b3d99"/></svg>Dorco<span>WMS</span></div>
    <div class="sidecols">
      <nav class="rail" aria-label="Menu chính">
        <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Search Menu</div>
        <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>Thiết lập chung</div>
        <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.5 3h3l2.6 12.2a1.8 1.8 0 0 0 1.8 1.4h8.4a1.8 1.8 0 0 0 1.8-1.4L21.5 7H6.3"/></svg>Bán hàng</div>
        <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M2.5 3h3l2.6 12.2a1.8 1.8 0 0 0 1.8 1.4h8.4a1.8 1.8 0 0 0 1.8-1.4L21.5 7H6.3"/></svg>Mua hàng</div>
        <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 8h16l-1.2 12H5.2z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>Quản lý hàng hóa</div>
        <div class="it on"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v2a5 5 0 0 0 5 5h4.5"/></svg></span>Giao dịch kho</div>
        <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M9 7.5v9M15 7.5v9M7 11h4M13 13h4"/></svg>Điều chỉnh tồn kho</div>
        <div class="it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 19.5 6v6c0 4.6-3.2 7.7-7.5 9-4.3-1.3-7.5-4.4-7.5-9V6z"/><path d="m9 12 2 2 4-4"/></svg>Cảnh báo tồn kho</div>

function reasonCode(txt){const r=REASONS.find(r=>[r.vi,r.en,r.ko,r.code].includes((txt||'').trim()));return r?r.code:null}
function validate(rows){
  const notes=rows.map(()=>[]);
  rows.forEach((r,i)=>{
    TCOLS.filter(c=>c[4]).forEach(c=>{ if(!String(r[c[0]]??'').trim()) notes[i].push(`Thiếu ${c[1]}`) });
    if(r.wh && !WH[r.wh]) notes[i].push('Kho xuất không tồn tại hoặc ngoài phạm vi kho của bạn');
    if(r.reason && !reasonCode(r.reason)) notes[i].push('Lý do chính không có trong danh mục');
    const it=ITEMS[r.code];
    if(r.code && !it) notes[i].push(`Mã mặt hàng ${r.code} không có trong danh mục`);
    if(it && r.uom && r.uom!==it.uom) notes[i].push(`ĐVT ${r.uom} không đúng ĐVT của mặt hàng (${it.uom})`);
    if(r.qty!==undefined && r.qty!==''){const q=Number(r.qty); if(isNaN(q)||q<0) notes[i].push('SL yêu cầu phải là số ≥ 0'); else if(it && it.uom==='EA' && !Number.isInteger(q)) notes[i].push('SL yêu cầu vượt số chữ số thập phân của ĐVT EA (0)');}
    if(r.price && !/^\d{1,18}$/.test(r.price)) notes[i].push('Đơn giá phải là số nguyên VND');
  });
  // lỗi cấp nhóm: cùng Số yêu cầu (upload) mà header khác nhau
  const groups={};rows.forEach((r,i)=>{(groups[r.uploadNo]=groups[r.uploadNo]||[]).push(i)});
  Object.entries(groups).forEach(([no,idx])=>{
    if(!no) return;
    ['date','wh','pic','reason','reasonDesc','note'].forEach(k=>{
      const vals=new Set(idx.map(i=>(rows[i][k]||'').trim()));
      if(vals.size>1) idx.forEach(i=>notes[i].push(`Cùng Số yêu cầu (upload) ${no} nhưng ${TCOLS.find(c=>c[0]===k)[1]} khác nhau`));
    });
    if(requests.some(q=>q.uploadNo===no && q.status!=='DELETED')) idx.forEach(i=>notes[i].push(`Số yêu cầu (upload) ${no} đã được dùng cho yêu cầu khác`));
  });
  return notes;
}

function popMenu(anchor,items){

/* datepicker */
const parseD=s=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(s||'');return m?new Date(+m[3],m[2]-1,+m[1]):null};
const fmtD=d=>`${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
function openDP(input,key){
  closePop();
  const today=new Date(2026,9,29);
  let sel=parseD(input.value), view=new Date((sel||today).getFullYear(),(sel||today).getMonth(),1);
  const m=document.createElement('div');m.className='pop dp';m.id='pop';document.body.appendChild(m);
  const draw=()=>{
    const y=view.getFullYear(),mo=view.getMonth(),start=new Date(y,mo,1-new Date(y,mo,1).getDay());
    let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);
      const cls=[d.getMonth()!==mo?'out':'',sel&&+d===+sel?'sel':'',+d===+today?'td':''].join(' ');
      cells+=`<button class="${cls}" data-d="${fmtD(d)}">${d.getDate()}</button>`}
    m.innerHTML=`<div class="dph"><span><button data-n="-12" aria-label="Năm trước">«</button><button data-n="-1" aria-label="Tháng trước">‹</button></span><b>Th ${String(mo+1).padStart(2,'0')} &nbsp;${y}</b><span><button data-n="1" aria-label="Tháng sau">›</button><button data-n="12" aria-label="Năm sau">»</button></span></div>
      <div class="dpg">${['CN','T2','T3','T4','T5','T6','T7'].map(x=>`<span>${x}</span>`).join('')}${cells}</div>
      <div class="dpf"><button data-today>Hôm nay</button></div>`;
    m.querySelectorAll('[data-n]').forEach(b=>b.onclick=e=>{e.stopPropagation();view=new Date(y,mo+ +b.dataset.n,1);draw()});
    m.querySelectorAll('[data-d]').forEach(b=>b.onclick=e=>{e.stopPropagation();input.value=b.dataset.d;state[key]=b.dataset.d;closePop()});
    m.querySelector('[data-today]').onclick=e=>{e.stopPropagation();input.value=fmtD(today);state[key]=input.value;closePop()};
  };draw();
  const r=input.getBoundingClientRect();m.style.top=(r.bottom+window.scrollY+4)+'px';m.style.left=Math.max(8,Math.min(r.left+window.scrollX,window.innerWidth-m.offsetWidth-8))+'px';
}

  if($('#btnResync'))$('#btnResync').onclick=()=>resyncSAP([...state.sapSel]);
  document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{state.exp[b.dataset.exp]=!state.exp[b.dataset.exp];render()});
  document.querySelectorAll('[data-cal]').forEach(b=>b.onclick=e=>{e.stopPropagation();const[id,k]=b.dataset.cal.split('|');openDP($('#'+id),k)});
  ['fd1','fd2'].forEach((id,i)=>{const el=$('#'+id);el.onclick=e=>{e.stopPropagation();openDP(el,i?'d2':'d1')};el.onchange=()=>state[i?'d2':'d1']=el.value});
  document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=e=>{e.stopPropagation();state[b.dataset.clear]='';render()});
  const openReq=no=>{state.view='req';state.mode='view';state.rtab='info';state.cur=JSON.parse(JSON.stringify(requests.find(r=>r.no===no)));render()};
  const openSlip=no=>{state.temMsg=null;state.view='slip';state.slip=JSON.parse(JSON.stringify(slips.find(s=>s.no===no)));render()};
  if($('#btnXls'))$('#btnXls').onclick=e=>{e.stopPropagation();popMenu(e.currentTarget,[[SVG_DOWN,'Tải Template',openTemplate],[SVG_UP,'Nhập từ Excel',openUpload]])};
  if($('#btnNew'))$('#btnNew').onclick=()=>{state.view='req';state.cur=newReq();render()};
  if($('#btnNewSlip'))$('#btnNewSlip').onclick=()=>pickSources(null);
  if($('#scan'))$('#scan').onkeydown=e=>{if(e.key==='Enter'){state.scan=e.target.value;render()}};
  if($('#scanBtn'))$('#scanBtn').onclick=()=>{state.scan=$('#scan').value;render()};
  $('#search').onclick=()=>{state.q=$('#fq').value;state.fr=$('#fr').value;state.fwh=$('#fwh').value;state.fs=$('#fs').value;state.fps=$('#fps').value;state.fsy=$('#fsy').value;state.d1=$('#fd1').value;state.d2=$('#fd2').value;render()};
  $('#reset').onclick=()=>{state.q=state.fr=state.fwh=state.fs=state.fps=state.fsy=state.scan='';state.d1=undefined;render()};
  document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openReq(b.dataset.open));
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{e.stopPropagation();const r=requests.find(x=>x.no===b.dataset.act);
    const items=[[SVG_EYE,'Chi tiết',()=>openReq(r.no)],[SVG_PRINT,'In',()=>toast(`In ${r.no} (mô phỏng)`)]];
    if(r.status==='SUBMITTED'&&r.lines.some(l=>l.qty>l.done))items.push([SVG_PLUS,'Tạo phiếu',()=>pickSources(r.no)]);
    popMenu(b,items)});
  document.querySelectorAll('[data-sopen]').forEach(b=>b.onclick=()=>openSlip(b.dataset.sopen));
  document.querySelectorAll('[data-sact]').forEach(b=>b.onclick=e=>{e.stopPropagation();
    const sp=slips.find(x=>x.no===b.dataset.sact);
    const items=[[SVG_EYE,'Chi tiết',()=>openSlip(sp.no)],[SVG_PRINT,'In',()=>toast(`In ${sp.no} (mô phỏng)`)]];
    if(canSync(sp))items.push([SVG_SYNC,'Đồng bộ lại SAP',()=>resyncSAP([sp.no])]);
    if(canCancelSlip(sp))items.push([SVG_TRASH,'Hủy phiếu',()=>cancelSlip(sp.no)]);
    popMenu(b,items)});
}

/* ===== Upload ===== */
function openUpload(){
  let pick=null;
  const draw=()=>{
    modal('Upload Excel – Yêu cầu xuất khác',
    `<div class="drop">Kéo thả file .xlsx vào đây hoặc chọn file<br><span class="hint">Chỉ nhận file theo template của WMS. Có lỗi ở bất kỳ dòng nào thì không tạo yêu cầu nào.</span></div>
     <div class="files">
       <div class="legend">File mẫu để thử (mô phỏng):</div>
       ${[FILE_OK,FILE_ERR].map((f,i)=>`<button class="file ${pick===i?'on':''}" data-f="${i}"><span class="row"><span class="xl">XLS</span><span><b>${f.name}</b><br><span class="muted">${f.rows.length} dòng · ${new Set(f.rows.map(r=>r.uploadNo)).size} số yêu cầu (upload)</span></span></span><span class="muted">${i===0?'Hợp lệ':'Có lỗi'}</span></button>`).join('')}
     </div>
     <p class="hint"><button class="btn link" id="tplLink">Tải template</button> nếu chưa có.</p>`,
    `<button class="btn" data-x2>Hủy</button><button class="btn pri" id="doUp" ${pick===null?'disabled':''}>Upload</button>`);
    $('#modal [data-x2]').onclick=closeModal; $('#tplLink').onclick=openTemplate;
    document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{pick=+b.dataset.f;draw()});
    $('#doUp').onclick=()=>runUpload(pick===0?FILE_OK:FILE_ERR);
  };draw();
}
function runUpload(file){
  const notes=validate(file.rows);
  const errRows=notes.filter(n=>n.length).length, errCount=notes.reduce((a,n)=>a+n.length,0);
  if(errRows){
    modal('Upload không thành công',
     `<div class="alert bad"><b>File ${esc(file.name)} có ${errCount} lỗi ở ${errRows}/${file.rows.length} dòng. Không yêu cầu nào được tạo.</b><br>Tải file lỗi, sửa theo cột Note rồi upload lại.</div>
      <div class="row"><button class="btn soft" id="seeErr">Tải file lỗi</button></div>`,
     `<button class="btn" data-x2>Đóng</button>`);
    $('#modal [data-x2]').onclick=closeModal;
    $('#seeErr').onclick=()=>showErrFile(file,notes);
    return;
  }
  // tạo yêu cầu
  const groups={};file.rows.forEach(r=>{(groups[r.uploadNo]=groups[r.uploadNo]||[]).push(r)});
  const created=Object.entries(groups).map(([up,rs])=>{
    const h=rs[0];const no=nextNo(h.wh);
    const rc=reasonCode(h.reason);
    const req={no,src:'UPLOAD',uploadNo:up,date:h.date,wh:h.wh,pic:h.pic,dept:h.dept||'',reason:rc,reasonDesc:h.reasonDesc||'',note:h.note||'',status:'SUBMITTED',  /* chốt 01/11: upload Excel vào thẳng Đã gửi, không qua Đã lưu, không cần bấm Gửi */
      recv:rtype(rc)==='SAMPLE'?{requester:h.requester||'',mail:h.mail||'',receiver:h.receiver||'',company:h.company||'',address:h.address||'',phone:h.phone||''}:{},
      lines:rs.map(r=>{const x={};['grade','lot','bin','ship','lnote','price','cdNo','cdDate','supplier','checklist','prodDate','cond','kg','recovery','pkg','origin'].forEach(k=>x[k]=r[k]||'');return L(r.code,Number(r.qty),x)})};
    requests.unshift(req);return req;
  });
  modal('Upload thành công',
   `<div class="alert ok"><b>Đã tạo ${created.length} yêu cầu ở trạng thái Đã gửi.</b> Yêu cầu upload vào thẳng Đã gửi, không cần bấm Gửi.</div>
    <div class="tw"><table><thead><tr><th>Số yêu cầu (upload)</th><th>Số yêu cầu</th><th>Lý do</th><th>Kho xuất</th><th class="n">Số dòng</th><th>Trạng thái</th></tr></thead><tbody>
    ${created.map(r=>`<tr><td>${esc(r.uploadNo)}</td><td>${r.no}</td><td>${rname(r.reason)}</td><td>${WH[r.wh].name}</td><td class="n">${r.lines.length}</td><td>${pill(r.status)}</td></tr>`).join('')}</tbody></table></div>`,
   `<button class="btn pri" data-x2>Xong</button>`);
  $('#modal [data-x2]').onclick=()=>{closeModal();state.view='list';state.sub='req';render()};
  render();
}
function showErrFile(file,notes){
  const cols=TCOLS.filter(c=>file.rows.some(r=>r[c[0]]));
  modal(`${file.name.replace('.xlsx','')}_loi.xlsx`,
   `<div class="tw"><table><thead><tr><th class="n">Dòng</th><th>Note</th>${cols.map(c=>`<th>${tcol(c[0])}</th>`).join('')}</tr></thead><tbody>
    ${file.rows.map((r,i)=>`<tr class="${notes[i].length?'err':''}"><td class="n">${i+2}</td><td class="note">${esc(notes[i].join('; '))}</td>${cols.map(c=>`<td>${esc(r[c[0]]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,
   `<button class="btn" data-x2>Đóng</button>`,true);
  $('#modal [data-x2]').onclick=closeModal;
}

/* ===== Form Yêu cầu ===== */
function newReq(){return{no:'',src:'MANUAL',uploadNo:'',date:'2026-10-29',wh:'',pic:'',dept:'',reason:'',reasonDesc:'',note:'',status:'NEW',recv:{},lines:[]}}
const LINE_BASE=[['barcode','Mã vạch / QR'],['code','Mã mặt hàng'],['name','Tên mặt hàng'],['spec','Quy cách'],['uom','ĐVT'],['qty','SL yêu cầu','n'],['done','Đã thực hiện','n'],['rem','Còn lại','n'],['bin','Vị trí'],['ship','Số giao hàng']];
const LINE_DISP=[['price','Đơn giá','n'],['amount','Thành tiền','n'],['cdNo','Số tờ khai'],['cdDate','Ngày tờ khai','d'],['supplier','Nhà cung cấp'],['checklist','Checklist'],['prodDate','Ngày sản xuất','d'],['cond','Tình trạng'],['kg','Số KG','n'],['recovery','Giá trị thu hồi','n']];

function lineCols(type){return [...LINE_BASE,...(type==='DISPOSAL'?LINE_DISP:type==='SAMPLE'?LINE_SAMPLE:[]),['lnote','Ghi chú']]}
const RO=['barcode','variant','name','spec','uom','done','rem','amount'];

const SVG_EDIT='<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
const SVG_SEND='<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg>';

const SVG_TRASH='<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
const upill=s=>`<span class="pill s-${s}" style="text-transform:uppercase;font-size:11px">${STS[s]}</span>`;
function renderReq(){
  const r=state.cur, isNew=r.status==='NEW';

  const full=mode==='edit'&&['NEW','SAVED'].includes(r.status);
  const amend=mode==='edit'&&r.status==='SUBMITTED';
  const dis=full?'':'disabled', ndis=(full||amend)?'':'disabled';
  const type=rtype(r.reason), cols=lineCols(type);
  const ls=slips.filter(s=>s.lines.some(l=>l.src===r.no));
  const tab=isNew?'info':(state.rtab||'info');
  const remain=r.lines.some(l=>l.qty>l.done);
  let btns=`<button class="btn" id="close">Đóng</button>`;
  if(mode==='edit') btns+=`<button class="btn pri" id="save">${SVG_SAVE} Lưu</button>${full?`<button class="btn pri" id="submit">${SVG_SEND} Gửi</button>`:''}`;
  else if(r.status==='SAVED') btns+=`<button class="btn" id="del">${SVG_TRASH} Xóa</button><button class="btn pri" id="edit">${SVG_EDIT} Sửa</button><button class="btn pri" id="submit">${SVG_SEND} Gửi</button><button class="btn pri" id="print">${SVG_PRINT} In</button>`;
  else if(r.status==='SUBMITTED') btns+=`<button class="btn pri" id="edit">${SVG_EDIT} Sửa</button><button class="btn pri" id="print">${SVG_PRINT} In</button>${remain?`<button class="btn pri" id="mkSlip">${SVG_PLUS} Tạo phiếu xuất khác</button>`:''}`;
  else btns+=`<button class="btn pri" id="print">${SVG_PRINT} In</button>`;
  const T=(k,label,req,val,span='')=>`<div class="f ${span}"><label for="h_${k}">${label}${req?' <b>*</b>':''}</label><input id="h_${k}" data-h="${k}" value="${esc(val)}" ${dis}></div>`;
  const ro=(label,val,ph='')=>`<div class="f"><label>${label}</label><input value="${esc(val)}" placeholder="${ph}" disabled></div>`;
  const dt=r.date?r.date.split('-').reverse().join('/')+' 16:45':'';
  const info=`
  <div class="panel"><div class="ph"><h3>Thông tin yêu cầu xuất khác</h3><span class="muted">⌃</span></div>
    <div class="g4">
      ${ro('Số yêu cầu',r.no,'Sinh khi lưu')}
      <div class="f"><label for="h_date">Ngày yêu cầu <b>*</b></label>${full?`<input id="h_date" type="date" data-h="date" value="${r.date}">`:`<div class="dp-wrap"><input value="${dt}" disabled><span class="dp-c">${SVG_CAL}</span></div>`}</div>
      <div class="f"><label for="h_wh">Kho xuất <b>*</b></label><select id="h_wh" data-h="wh" ${dis}><option value="">Chọn Kho xuất</option>${Object.entries(WH).map(([k,w])=>`<option value="${k}" ${r.wh===k?'selected':''}>${w.name}</option>`)}</select></div>
      ${ro('Loại','OUT')}
      <div class="f"><label for="h_pic">Người phụ trách <b>*</b></label><select id="h_pic" data-h="pic" ${dis}><option value="">Chọn Người phụ trách</option>${PIC.map(p=>`<option ${r.pic===p?'selected':''}>${p}</option>`)}</select></div>
      ${T('dept','Bộ phận',0,r.dept)}
      ${ro('Nguồn',SRC[r.src]||'')}
      ${ro('Số yêu cầu (upload)',r.uploadNo)}
      <div class="f"><label for="h_reason">Lý do chính <b>*</b></label><select id="h_reason" data-h="reason" ${dis}><option value="">Chọn Lý do chính</option>${REASONS.map(x=>`<option value="${x.code}" ${r.reason===x.code?'selected':''}>${x[lang()]}</option>`)}</select></div>
      ${type==='SAMPLE'?`${T('requester','Người yêu cầu',0,r.recv.requester||'')}${T('mail','Mail',0,r.recv.mail||'')}${T('receiver','Người nhận',0,r.recv.receiver||'')}
      ${T('company','Công ty',0,r.recv.company||'')}${T('phone','SĐT',0,r.recv.phone||'')}${T('address','Địa chỉ',0,r.recv.address||'','s2')}`:''}
      <div class="f s4"><label for="h_reasonDesc">Mô tả lý do${r.reason==='OTHER'?' <b>*</b>':''}</label><textarea id="h_reasonDesc" data-h="reasonDesc" placeholder="Nhập Mô tả lý do" ${dis}>${esc(r.reasonDesc)}</textarea></div>
      <div class="f s4"><label for="h_note">Ghi chú</label><textarea id="h_note" data-h="note" ${ndis}>${esc(r.note)}</textarea></div>
    </div></div>
  <div class="panel"><div class="ph"><h3>Mặt hàng yêu cầu</h3><div class="row">${full?`<button class="btn" id="addLine">${SVG_PLUS} Thêm mặt hàng</button><button class="btn">${SVG_PLUS} Thêm từ tồn kho</button>`:''}<span class="muted">⌃</span></div></div>

    <div class="tw"><table><thead><tr>${cols.map(c=>TH(c[1],c[2]==='n'?'n':'')).join('')}${(full||amend)?'<th>Thao tác</th>':''}</tr></thead>
    <tbody>${r.lines.map((l,i)=>`<tr>${cols.map(c=>cell(l,c,i,full,amend)).join('')}${(full||amend)?`<td><button class="btn sm" data-del="${i}">Xóa</button></td>`:''}</tr>`).join('')||`<tr><td colspan="${cols.length+1}" class="empty">Không có dữ liệu để hiển thị</td></tr>`}</tbody></table></div>
    
  </div>`;
  const slipTab=`
  <div class="panel"><div class="ph"><h3>Phiếu liên kết</h3><span class="muted">⌃</span></div>
    <div class="ph"><span class="chip">${ls.length} bản ghi được tìm thấy</span><div class="row"><button class="btn ib" aria-label="Hiện dòng bộ lọc">${SVG_FILTER}</button><button class="btn ib" aria-label="Bộ lọc và cột của bảng">${SVG_COLS}</button></div></div>
    <div class="tw"><table><thead><tr>${TH('STT')}${TH('Số phiếu xuất','',1)}${TH('Trạng thái')}${TH('Trạng thái đồng bộ SAP')}${TH('Ngày tạo','',1)}${TH('SL xuất kho','n')}${TH('Người tạo','',1)}</tr></thead><tbody>
    ${ls.map((s,i)=>{const mine=s.lines.filter(l=>l.src===r.no);const u=r.lines[mine[0].srcIdx].uom;return `<tr><td>${i+1}</td><td><button class="btn link" data-sopen="${s.no}">${s.no}</button></td><td>${upill(s.status)}</td><td>${syb(s)}</td><td class="n">${s.date.split('-').reverse().join('/')} 19:53</td><td class="n">${qf(mine.reduce((a,l)=>a+Number(l.qty),0),u)}</td><td>Super Administrator</td></tr>`}).join('')||`<tr><td colspan="7" class="empty"><div style="font-size:30px;opacity:.5">◌</div>Không có dữ liệu để hiển thị</td></tr>`}
    </tbody></table></div></div>`;
  $('#view').innerHTML=`
  <div class="formbar"><h2><button class="btn sm" id="back" aria-label="Quay lại" style="border:0">←</button>${isNew?'Tạo yêu cầu xuất khác':'Yêu cầu xuất khác'} ${isNew?'':upill(r.status)}</h2><div class="row">${btns}</div></div>
  ${isNew?'':`<div class="ftabs" role="tablist"><button role="tab" data-rtab="info" class="${tab==='info'?'on':''}">Yêu cầu xuất khác</button><button role="tab" data-rtab="slips" class="${tab==='slips'?'on':''}">Phiếu xuất khác <span class="cnt">${ls.length}</span></button></div>`}
  ${tab==='info'?info:slipTab}`;

  document.querySelectorAll('[data-sopen]').forEach(b=>b.onclick=()=>{state.temMsg=null;state.view='slip';state.slip=JSON.parse(JSON.stringify(slips.find(s=>s.no===b.dataset.sopen)));render()});

  if($('#del'))$('#del').onclick=()=>{requests=requests.filter(x=>x.no!==r.no);toast(`Đã xóa ${r.no}`);toList()};

const amount=l=>(l.qty===''||l.price==='')?'':Number(l.qty)*Number(l.price);
function cell(l,c,i,edit,amend){
  const k=c[0],cls=c[2]==='n'?'n':'';
  if(k==='barcode')return `<td><span class="mapbtn">${SVG_SEARCH.replace('<svg','<svg class="i"')} Ánh xạ Barcode/QR</span></td>`;
  if(k==='rem')return `<td class="n">${fmt(l.qty-l.done)}</td>`;
  if(k==='amount')return `<td class="n" data-amt>${fmt(amount(l))}</td>`;
  if(amend&&k==='lnote')return `<td><input data-l="${i}|${k}" value="${esc(l[k])}" aria-label="${c[1]} dòng ${i+1}"></td>`;
  if(!edit||RO.includes(k)||k==='code')return `<td class="${cls}">${c[2]==='n'?fmt(l[k]):c[2]==='d'&&l[k]?l[k].split('-').reverse().join('/'):(esc(l[k])||(k==='grade'?'—':''))}</td>`;
  return `<td><input class="${cls}" ${c[2]==='d'?'type="date"':''} data-l="${i}|${k}" value="${esc(l[k])}" aria-label="${c[1]} dòng ${i+1}"></td>`;
}
function addItem(r){
  modal('Thêm mặt hàng',`<div class="tw"><table><thead><tr><th>Mã mặt hàng</th><th>Tên mặt hàng</th><th>ĐVT</th><th></th></tr></thead><tbody>${Object.entries(ITEMS).map(([k,v])=>`<tr><td>${k}</td><td>${v.name}</td><td>${v.uom}</td><td><button class="btn sm" data-add="${k}">Chọn</button></td></tr>`).join('')}</tbody></table></div>`);
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{r.lines.push(L(b.dataset.add,0));closeModal();render()});
}
function saveReq(st){
  const r=state.cur,miss=[];
  if(!r.date)miss.push('Ngày yêu cầu');if(!r.wh)miss.push('Kho xuất');if(!r.pic)miss.push('Người phụ trách');if(!r.reason)miss.push('Lý do chính');
  if(r.reason==='OTHER'&&!r.reasonDesc)miss.push('Mô tả lý do');
  if(!r.lines.length)miss.push('ít nhất 1 dòng');
  if(st==='SUBMITTED'&&r.lines.some(l=>!(Number(l.qty)>0)))miss.push('SL yêu cầu > 0 ở mọi dòng');
  if(miss.length){toast('Cần nhập: '+miss.join(', '));return}
  r.lines.forEach(l=>{l.qty=Number(l.qty)});
  if(rtype(r.reason)!=='SAMPLE')r.recv={};
  if(!r.no){r.no=nextNo(r.wh);r.status=st;requests.unshift(r)}else{r.status=st;requests[requests.findIndex(x=>x.no===r.no)]=r}
  state.cur=JSON.parse(JSON.stringify(r));
  state.mode='view';
  toast(st==='SAVED'?`Đã lưu ${r.no}`:`Đã gửi ${r.no}`);render();
}

/* ===== Phiếu ===== */
function pickSources(reqNo,into){
  const avail=[];requests.filter(r=>r.status==='SUBMITTED'&&(!reqNo||r.no===reqNo)).forEach(r=>r.lines.forEach((l,i)=>{if(l.qty>l.done)avail.push({r,l,i})}));
  modal('Chọn dòng yêu cầu',`<p class="hint" style="margin:0 0 10px">Một phiếu chỉ gom được các yêu cầu <b>cùng kho và cùng Lý do xuất khác</b> (XK1).</p><div class="tw"><table><thead><tr><th></th><th>Số yêu cầu</th><th>Số yêu cầu (upload)</th><th>Lý do</th><th>Kho</th><th>Mã mặt hàng</th><th>Tên mặt hàng</th><th class="n">Còn lại</th></tr></thead><tbody>
   ${avail.map((a,j)=>`<tr><td><input type="checkbox" id="ck${j}" data-j="${j}" ${reqNo?'checked':''} aria-label="Chọn dòng ${j+1}"></td><td>${a.r.no}</td><td>${esc(a.r.uploadNo)}</td><td>${rname(a.r.reason)}</td><td>${a.r.wh}</td><td>${a.l.code}</td><td>${a.l.name}</td><td class="n">${fmt(a.l.qty-a.l.done)}</td></tr>`).join('')||`<tr><td colspan="8" class="empty">Không có dòng nào còn SL</td></tr>`}</tbody></table></div>`,
   `<button class="btn" data-x2>Hủy</button><button class="btn pri" id="okSrc">Tạo phiếu</button>`,true);
  $('#modal [data-x2]').onclick=closeModal;
  $('#okSrc').onclick=()=>{
    const sel=[...document.querySelectorAll('[data-j]:checked')].map(c=>avail[+c.dataset.j]);
    if(!sel.length){toast('Chọn ít nhất 1 dòng');return}
    /* XK1: gom nhiều yêu cầu vào một phiếu chỉ khi cùng kho VÀ cùng lý do (giống PDA) */
    if(new Set(sel.map(a=>a.r.wh)).size>1){toast('Các dòng phải cùng kho');return}
    if(new Set(sel.map(a=>a.r.reason)).size>1){toast('Các dòng phải cùng Lý do xuất khác');return}
    if(into){
      if(sel.some(a=>a.r.wh!==into.wh)){toast('Các dòng phải cùng kho với phiếu');return}
      if(sel.some(a=>a.r.reason!==into.reason)){toast('Các dòng phải cùng Lý do xuất khác với phiếu');return}
      sel.forEach(a=>{if(!into.lines.some(l=>l.src===a.r.no&&l.srcIdx===a.i))into.lines.push({src:a.r.no,srcIdx:a.i,qty:0,bin:'',price:a.l.price||'0',lnote:'',tems:[]})});closeModal();render();return}
    const f=sel[0].r;
    state.slip={no:'',status:'NEW',date:'2026-10-29',wh:f.wh,pic:f.pic,dept:f.dept,reason:f.reason,reasonDesc:f.reasonDesc,ref:'',note:'',lines:sel.map(a=>({src:a.r.no,srcIdx:a.i,qty:0,bin:'',price:a.l.price||'0',lnote:'',tems:[]}))};
    closeModal();state.temMsg=null;state.view='slip';render();
  };
}
function renderSlip(){
  const s=state.slip;
  // giữ trạng thái và trạng thái đồng bộ của phiếu đang xem khớp với bản ghi thật
  if(s.no){const live=slips.find(x=>x.no===s.no);if(live){s.status=live.status;s.sy=live.sy;s.syErr=live.syErr}}
  const edit=['NEW','SAVED'].includes(s.status), dis=edit?'':'disabled', type=rtype(s.reason);
  const rows=s.lines.map(l=>{const r=requests.find(x=>x.no===l.src);return{l,r,src:r.lines[l.srcIdx]}});
  const ex=[...(type==='DISPOSAL'?[['cdNo','Số tờ khai'],['cdDate','Ngày tờ khai'],['supplier','Nhà cung cấp'],['checklist','Checklist'],['prodDate','Ngày sản xuất'],['cond','Tình trạng'],['kg','Số KG'],['recovery','Giá trị thu hồi']]:[]),
            ...(type==='SAMPLE'?[['kg','Số KG'],['pkg','Số kiện'],['origin','Xuất xứ']]:[])];
  const rc=type==='SAMPLE'?[['requester','Người yêu cầu'],['mail','Mail'],['receiver','Người nhận'],['company','Công ty'],['address','Địa chỉ'],['phone','SĐT']]:[];
  const links=[...new Set(s.lines.map(l=>l.src))].join(', ');
  const inp=(i,k,cls,v,lab)=>edit?`<input class="${cls}" data-s="${i}|${k}" value="${esc(v)}" aria-label="${lab} dòng ${i+1}">`:`<span>${cls==='n'?fmt(v):esc(v)}</span>`;
  $('#view').innerHTML=`
  <div class="formbar"><h2><button class="btn sm" id="back">←</button>${s.status==='NEW'?'Tạo phiếu xuất khác':'Phiếu xuất khác '+s.no} ${s.status!=='NEW'?pill(s.status):''}</h2>
   <div class="row"><button class="btn" id="close">Đóng</button>${edit?`<button class="btn pri" id="save">Lưu</button><button class="btn pri" id="submit">Gửi</button>`:''}${s.status==='SUBMITTED'?`<button class="btn pri" id="approve">Duyệt</button>`:''}${canSync(s)?`<button class="btn" id="resync">${SVG_SYNC} Đồng bộ lại SAP</button>`:''}${canCancelSlip(s)?`<button class="btn" id="cancelSlip" style="color:var(--bad);border-color:var(--bad)">Hủy phiếu</button>`:''}</div></div>
  <div class="panel"><div class="ph"><h3>Thông tin phiếu xuất khác</h3></div><div class="grid">
    <div class="f"><label>Số phiếu</label><input value="${esc(s.no)}" placeholder="Sinh khi lưu" readonly></div>
    <div class="f"><label for="s_date">Ngày thực hiện <b>*</b></label><input id="s_date" type="date" value="${s.date}" ${dis}></div>
    <div class="f"><label>Kho xuất <b>*</b></label><input value="${WH[s.wh].name}" readonly></div>
    <div class="f"><label>Loại</label><input value="OUT" readonly></div>
    <div class="f"><label>Yêu cầu liên kết</label><input value="${esc(links)}" readonly></div>
    <div class="f"><label for="s_pic">Người phụ trách</label><select id="s_pic" ${dis}>${PIC.map(p=>`<option ${s.pic===p?'selected':''}>${p}</option>`)}</select></div>
    <div class="f"><label for="s_dept">Bộ phận</label><input id="s_dept" value="${esc(s.dept||'')}" ${dis}></div>
    <div class="f"><label for="s_ref">Chứng từ tham chiếu</label><input id="s_ref" value="${esc(s.ref)}" ${dis}></div>
    <div class="f"><label for="s_reason">Lý do chính <b>*</b></label><select id="s_reason" ${dis}>${REASONS.map(x=>`<option value="${x.code}" ${s.reason===x.code?'selected':''}>${x[lang()]}</option>`)}</select></div>
    <div class="f wide"><label for="s_rdesc">Mô tả lý do</label><textarea id="s_rdesc" ${dis}>${esc(s.reasonDesc||'')}</textarea></div>
    <div class="f wide"><label for="s_note">Ghi chú</label><textarea id="s_note" ${dis}>${esc(s.note)}</textarea></div>
  </div></div>
  ${edit?`<div class="panel"><div class="ph"><h3>Quét tem xuất kho</h3></div>
   <div class="row"><input id="temScan" placeholder="Quét hoặc nhập số tem rồi Enter…" aria-label="Quét hoặc nhập số tem" style="flex:1;min-width:220px;border:1px solid var(--line2);border-radius:6px;background:var(--input);padding:7px 10px;min-height:36px"><button class="btn pri" id="temBtn">Gán tem</button></div>
   ${state.temMsg?`<div class="alert ${state.temMsg[0]}" style="margin-top:10px">${state.temMsg[1]}</div>`:''}
   <div class="row" style="margin-top:10px"><span class="muted" style="font-size:12.5px">Mô phỏng quét:</span>${labels.filter(x=>x.wh===s.wh).map(x=>`<button class="btn sm" data-tem="${x.no}">${x.no}</button>`).join('')}</div>
   <p class="hint">Tem vào dòng theo khóa <b>mã hàng + ĐVT</b>; tem phải cùng kho với phiếu. SL điền sẵn bằng số nhỏ hơn giữa SL khả dụng của tem và SL còn cần xuất của dòng; sửa giảm được để xuất lẻ, phần còn lại vẫn nằm trên tem đó. Duyệt phiếu mới trừ SL trên tem; tem về 0 thì chuyển <b>Đã xuất hết</b>.</p>
  </div>`:''}
  <div class="panel"><div class="ph"><h3>Mặt hàng xuất</h3>${edit?`<div class="row"><button class="btn" id="addSrc">+ Thêm mặt hàng</button><button class="btn">+ Thêm từ tồn kho</button></div>`:''}</div>
   <div class="tw"><table><thead><tr><th class="n">#</th><th>Số yêu cầu</th><th>Mã mặt hàng</th><th>Tên mặt hàng</th><th>Quy cách</th><th>ĐVT</th><th class="n">SL xuất kho</th><th>Tem đã gắn</th><th>Vị trí</th><th>Số giao hàng</th><th class="n">Đơn giá</th><th class="n">Thành tiền</th>${ex.map(c=>`<th>${c[1]}</th>`).join('')}${rc.map(c=>`<th>${c[1]}</th>`).join('')}<th>Số yêu cầu (upload)</th><th>Ghi chú</th>${edit?'<th>Thao tác</th>':''}</tr></thead>
   <tbody>${rows.map(({l,r,src},i)=>`<tr><td class="n">${i+1}</td><td>${r.no}</td><td>${src.code}</td><td>${src.name}</td><td>${esc(src.spec)}</td><td>${src.uom}</td>
     <td class="n">${fmt(temQty(l))}</td>
     <td style="white-space:normal;min-width:240px">${(l.tems||[]).map(t=>{const lb=LB(t.no)||{con:t.qty,st:'in'};return `<span class="tag" style="margin:2px 4px 2px 0;display:inline-flex;gap:5px;align-items:center">${t.no} · ${fmt(t.qty)}${edit?`<button class="btn link" data-trm="${i}|${t.no}" aria-label="Bỏ tem ${t.no}" style="color:var(--bad)">✕</button>`:` <span class="muted">${LBST[lb.st]}</span>`}</span>`}).join('')||'<span class="muted">Chưa gắn tem</span>'}</td>
     <td>${esc(l.bin)||'<span class="muted">—</span>'}</td><td>${esc(src.ship)}</td>
     <td>${inp(i,'price','n',l.price,'Đơn giá')}</td>
     <td class="n" data-amt>${fmt(temQty(l)*Number(l.price||0))}</td>
     ${ex.map(c=>`<td>${esc(src[c[0]])}</td>`).join('')}${rc.map(c=>`<td>${esc(r.recv[c[0]]||'')}</td>`).join('')}<td>${esc(r.uploadNo)}</td><td>${inp(i,'lnote','',l.lnote||src.lnote||'','Ghi chú')}</td>
     ${edit?`<td><button class="btn sm" data-sdel="${i}">Xóa</button></td>`:''}</tr>`).join('')||`<tr><td colspan="20" class="empty">Không có dữ liệu để hiển thị</td></tr>`}</tbody></table></div>
  </div>`;
  const back=()=>{state.view='list';state.sub='slip';render()};$('#back').onclick=back;$('#close').onclick=back;
  if($('#s_reason'))$('#s_reason').onchange=e=>{s.reason=e.target.value;render()};
  document.querySelectorAll('[data-s]').forEach(el=>el.oninput=()=>{const[i,k]=el.dataset.s.split('|');s.lines[i][k]=el.value;el.closest('tr').querySelector('[data-amt]').textContent=fmt(temQty(s.lines[i])*Number(s.lines[i].price||0))});
  document.querySelectorAll('[data-sdel]').forEach(b=>b.onclick=()=>{s.lines.splice(+b.dataset.sdel,1);state.temMsg=null;render()});
  document.querySelectorAll('[data-trm]').forEach(b=>b.onclick=()=>{const[i,no]=b.dataset.trm.split('|');const l=s.lines[i];
    l.tems=l.tems.filter(t=>t.no!==no);l.qty=temQty(l);l.bin=l.tems.length?(LB(l.tems[0].no)||{}).bin||'':'';
    state.temMsg=['info',`Đã bỏ tem <b>${esc(no)}</b> khỏi dòng ${+i+1}; số lượng trả về khả dụng.`];render()});
  document.querySelectorAll('[data-tem]').forEach(b=>b.onclick=()=>scanTem(b.dataset.tem));
  if($('#temBtn'))$('#temBtn').onclick=()=>{const el=$('#temScan');const v=el.value;el.value='';scanTem(v)};
  if($('#temScan')){$('#temScan').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const v=e.target.value;e.target.value='';scanTem(v)}};$('#temScan').focus()}
  if($('#addSrc'))$('#addSrc').onclick=()=>pickSources(null,s);
  if($('#resync'))$('#resync').onclick=()=>resyncSAP([s.no]);
  if($('#cancelSlip'))$('#cancelSlip').onclick=()=>cancelSlip(s.no);
  const save=st=>{
    if(!s.lines.length){toast('Phải có ít nhất 1 dòng');return}
    for(const {l,src} of rows){const q=temQty(l);if(!(q>0)){toast('Dòng chưa gắn tem — quét tem để xuất');return}if(q>src.qty-src.done){toast('SL xuất kho vượt SL còn lại của dòng yêu cầu');return}if(!/^\d{1,18}$/.test(String(l.price||'0'))){toast('Đơn giá phải là số nguyên VND');return}l.qty=q}
    s.date=$('#s_date').value;s.pic=$('#s_pic').value;s.dept=$('#s_dept').value;s.ref=$('#s_ref').value;s.reasonDesc=$('#s_rdesc').value;s.note=$('#s_note').value;
    if(!s.no){s.no=`PKH-OUT-2610-${String(++slipCounter).padStart(5,'0')}`;s.status=st;s.sy='none';slips.unshift(s)}else{s.status=st;slips[slips.findIndex(x=>x.no===s.no)]=s}
    state.slip=JSON.parse(JSON.stringify(s));state.temMsg=null;toast(`${st==='SAVED'?'Đã lưu':'Đã gửi'} ${s.no}`);render();
  };
  if($('#save'))$('#save').onclick=()=>save('SAVED');
  if($('#submit'))$('#submit').onclick=()=>save('SUBMITTED');
  if($('#approve'))$('#approve').onclick=()=>{approveSlip(s.no);state.slip=JSON.parse(JSON.stringify(slips.find(x=>x.no===s.no)));render()};
}
/* Điểm 16: quét hoặc nhập số tem ở màn lập phiếu (keyboard-wedge như mockup giao hàng Web) */
function scanTem(raw){
  const s=state.slip, code=String(raw||'').trim().toUpperCase();
  if(!code)return;
  const lb=LB(code);
  if(!lb){state.temMsg=['bad',`Không tìm thấy tem <b>${esc(code)}</b> trong hệ thống.`];return render()}
  if(lb.st==='cancel'){state.temMsg=['bad',`Tem <b>${lb.no}</b> đã hủy, không xuất được.`];return render()}
  if(lb.st==='out'){state.temMsg=['bad',`Tem <b>${lb.no}</b> đã xuất hết, không còn hàng để xuất.`];return render()}
  if(lb.wh!==s.wh){state.temMsg=['bad',`Tem <b>${lb.no}</b> thuộc kho ${WH[lb.wh].name}, khác kho ${WH[s.wh].name} của phiếu.`];return render()}
  if(s.lines.some(l=>(l.tems||[]).some(t=>t.no===lb.no))){state.temMsg=['bad',`Tem <b>${lb.no}</b> đã có trong phiếu này.`];return render()}
  const kd=availQty(lb,s.no);
  if(kd<=0){state.temMsg=['bad',`Tem <b>${lb.no}</b> không còn SL khả dụng — đang bị phiếu khác giữ chỗ.`];return render()}
  // khóa gắn tem: mã hàng + ĐVT (bỏ Lot và Grade)
  const cand=s.lines.filter(l=>{const src=requests.find(x=>x.no===l.src).lines[l.srcIdx];return src.code===lb.code&&src.uom===lb.uom});
  if(!cand.length){state.temMsg=['bad',`Tem <b>${lb.no}</b> (mã hàng ${lb.code} · ${lb.uom}) không khớp dòng nào trong phiếu.`];return render()}
  const line=cand.find(l=>{const src=requests.find(x=>x.no===l.src).lines[l.srcIdx];return temQty(l)<src.qty-src.done});
  if(!line){state.temMsg=['info',`Các dòng của mã hàng ${lb.code} đã gắn đủ SL — tem <b>${lb.no}</b> không cần nữa.`];return render()}
  const src=requests.find(x=>x.no===line.src).lines[line.srcIdx];
  const q=Math.min(kd,src.qty-src.done-temQty(line));
  line.tems=(line.tems||[]).concat([{no:lb.no,qty:q}]);
  line.qty=temQty(line);
  if(!line.bin)line.bin=lb.bin;
  state.temMsg=['ok',`Đã gán <b>${lb.no}</b> — lấy <b>${fmt(q)} ${lb.uom}</b> tại ${lb.wh}/${lb.bin}.`+(q<kd?` Còn ${fmt(kd-q)} trên tem.`:'')];
  render();
}
/* Duyệt phiếu: trừ SL từng tem, tem về 0 thì Đã xuất hết */
function approveSlip(no){
  const real=slips.find(x=>x.no===no);
  real.status='APPROVED';real.sy='run';setTimeout(()=>{real.sy='ok';render()},1800);
  real.lines.forEach(l=>{
    const r=requests.find(x=>x.no===l.src);r.lines[l.srcIdx].done+=temQty(l);
    (l.tems||[]).forEach(t=>{const lb=LB(t.no);if(!lb)return;lb.con-=Number(t.qty);if(lb.con<=0){lb.con=0;lb.st='out'}});
    if(r.lines.every(x=>x.done>=x.qty))r.status='CLOSED';
  });
  toast(`Đã duyệt ${no}`);
}
/* Điểm 16: hủy phiếu đã duyệt — cộng lại SL vào tem, tem Đã xuất hết quay về Trong kho */
function cancelSlip(no){
  const real=slips.find(x=>x.no===no);
  if(!canCancelSlip(real)){toast('Phiếu đang đồng bộ, chưa hủy được');return}
  real.status='CANCELLED';
  real.lines.forEach(l=>{
    const r=requests.find(x=>x.no===l.src);r.lines[l.srcIdx].done-=temQty(l);
    if(r.status==='CLOSED')r.status='SUBMITTED';
    (l.tems||[]).forEach(t=>{const lb=LB(t.no);if(!lb)return;lb.con+=Number(t.qty);if(lb.st==='out'&&lb.con>0)lb.st='in'});
  });
  state.slip=JSON.parse(JSON.stringify(real));
  toast(`Đã hủy ${no} — SL đã cộng lại vào tem`);render();
}

document.getElementById('lang').onchange=()=>{render();toast('Đổi ngôn ngữ: tiêu đề cột template và tên Lý do theo ngôn ngữ mới')};
render();
