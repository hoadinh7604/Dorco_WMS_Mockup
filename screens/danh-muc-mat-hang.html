<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Danh mục mặt hàng — DorcoWMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#16181c; --ink-rail:#101216; --ink-line:#2a2d33; --ink-sub:#8b9099;
  --ink-item:#c9ccd2;
  --lime:#c3f23f; --lime-d:#a9d92f; --lime-ink:#1d2410;
  --ok-bg:#e9f8dc; --ok-bd:#b8e394; --ok-ink:#4c8a1d;
  --off-bg:#f1f2f4; --off-bd:#d8dbe0; --off-ink:#8a909a;
  --page:#f4f5f7; --card:#ffffff; --line:#e6e8ec; --line-2:#eef0f3;
  --text:#1d2127; --text-2:#5a6069; --text-3:#9aa0a9;
  --head:#f8f9fb; --row-h:#f6faef;
  --btn-bd:#d9dde3; --btn-ink:#3b414a;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--page); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:13px; line-height:1.45; -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
}
button{font-family:inherit;cursor:pointer}
svg{display:block}

/* ---------- shell ---------- */
.app{display:flex;height:100vh;min-height:0;overflow:hidden}

/* logo strip sits above both dark columns */
.sidebar{display:flex;flex-direction:column;flex:none}
.cols{display:flex;flex:1;min-height:0}
.brand{height:60px;background:var(--ink);display:flex;align-items:center;flex:none;padding:0 14px}
.logo-box{background:#fff;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;flex:1;padding:0 13px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.brand-word{font-weight:700;font-size:16px;letter-spacing:-.2px;line-height:1}
.brand-hex{width:21px;height:22px;flex:none}
.brand-dorco{color:#17233f}.brand-wms{color:#1ca2e6}

/* far-left icon rail */
.rail{width:92px;background:var(--ink-rail);color:var(--ink-item);display:flex;flex-direction:column;flex:none}
.rail-items{flex:1;overflow-y:auto;padding:6px 0}
.rail-items::-webkit-scrollbar{width:0}
.rail-b{width:100%;background:none;border:0;color:var(--ink-item);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:11px 4px;font-size:10.5px;line-height:1.25;text-align:center;opacity:.78}
.rail-b svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
.rail-b:hover{opacity:1;background:#1b1e23}
.rail-b.on{opacity:1;color:#fff;background:none}
.rail-b.on svg{background:var(--lime);stroke:var(--lime-ink);border-radius:11px;padding:9px;width:20px;height:20px;box-sizing:content-box}
.rail-foot{padding:10px 0;border-top:1px solid #1e2228;display:flex;justify-content:center;flex:none}
.rail-foot button{width:34px;height:34px;border:0;background:none;border-radius:8px;color:var(--ink-sub);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rail-foot button:hover{background:#1b1e23;color:#fff}
.rail-foot svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}

/* second (submenu) dark column */
.sub{width:218px;background:var(--ink);color:var(--ink-item);display:flex;flex-direction:column;flex:none;border-right:1px solid #000}
.sub-title{padding:17px 18px 12px;font-size:14px;font-weight:600;color:#fff}
.sub-scroll{flex:1;overflow-y:auto;padding-bottom:16px}
.sub-scroll::-webkit-scrollbar{width:6px}
.sub-scroll::-webkit-scrollbar-thumb{background:#33373e;border-radius:6px}
.grp{width:100%;background:none;border:0;color:var(--ink-item);
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px;font-size:13px}
.grp:hover{background:#1e2228;color:#fff}
.grp-l{display:flex;align-items:center;gap:12px;min-width:0}
.grp .gi{width:17px;height:17px;stroke:var(--ink-sub);fill:none;stroke-width:1.8;flex:none}
.grp.open .gi{stroke:#fff}
.grp .chev{width:14px;height:14px;stroke:var(--ink-sub);fill:none;stroke-width:2;flex:none}
.grp.open{color:#fff}
.children{display:none;padding:2px 0 6px}
.grp.open + .children{display:block}
.child{width:100%;background:none;border:0;color:var(--ink-item);text-align:left;
  padding:8px 18px 8px 34px;font-size:12.5px;position:relative;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.child:hover{background:#1e2228;color:#fff}
.child.active{background:var(--lime);color:#15181c;font-weight:700;width:auto;margin:4px 12px;padding:10px 16px;border-radius:9px}
.child.active::before{display:none}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--page)}
.topbar{height:60px;background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:stretch;justify-content:space-between;flex:none}
.tabs{display:flex;align-items:flex-end;padding-left:18px}
.tab{display:flex;align-items:center;gap:10px;padding:0 16px;height:100%;
  font-size:13px;font-weight:600;color:var(--text);position:relative;background:#fff}
.tab::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;background:var(--lime)}
.tab .x{display:flex;width:16px;height:16px;border-radius:4px;align-items:center;justify-content:center;color:var(--text-3)}
.tab .x:hover{background:var(--line-2)}
.tab .x svg{width:11px;height:11px;stroke:currentColor;stroke-width:2}
.topright{display:flex;align-items:center;gap:6px;padding-right:18px}
.tr-ic{width:34px;height:34px;border:0;background:none;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.tr-ic:hover{background:var(--line-2)}
.tr-ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
.lang{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;color:var(--text-2);font-size:12.5px;font-weight:500}
.lang:hover{background:var(--line-2)}
.lang svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.user{display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border-radius:8px}
.user:hover{background:var(--line-2)}
.ava{width:26px;height:26px;border-radius:50%;background:#e8eaed;color:#4a5160;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.user .nm{font-size:12.5px;font-weight:600}
.user svg{width:14px;height:14px;stroke:var(--text-3);fill:none;stroke-width:2}

.scroll{flex:1;overflow-y:auto;padding:18px 20px 28px}
.ptitle{font-size:20px;font-weight:700;margin:2px 2px 16px;letter-spacing:-.3px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px}

/* filter card */
.filt-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0}
.filt-head h3{margin:0;font-size:14px;font-weight:600}
.filt-actions{display:flex;gap:8px}
.filt-body{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:14px 16px 18px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:500}
.ctrl{width:100%;height:38px;border:1px solid var(--btn-bd);border-radius:8px;background:#fff;
  padding:0 12px;font-size:13px;color:var(--text);outline:none}
.ctrl::placeholder{color:var(--text-3)}
.ctrl:focus{border-color:#aab3bf;box-shadow:0 0 0 3px rgba(150,160,175,.15)}
.sel-wrap{position:relative}
.sel-wrap svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-3);fill:none;stroke-width:2;pointer-events:none}
select.ctrl{appearance:none;-webkit-appearance:none;padding-right:32px;cursor:pointer}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:8px;
  font-size:12.5px;font-weight:600;border:1px solid var(--btn-bd);background:#fff;color:var(--btn-ink);white-space:nowrap}
.btn:hover{background:#f7f8fa}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn-dark{background:#1d2127;color:#fff;border-color:#1d2127}
.btn-dark:hover{background:#2b313a}
.btn-lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime-d)}
.btn-lime:hover{background:var(--lime-d)}
.btn-sm{height:34px;padding:0 11px;font-size:12px}
.icon-btn{width:34px;height:34px;padding:0;justify-content:center}

/* list card */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.list-left{display:flex;align-items:center;gap:10px}
.list-left h3{margin:0;font-size:14px;font-weight:600}
.count{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;
  background:#eef4e0;color:#5c7a28;font-size:11.5px;font-weight:600}
.list-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:980px}
thead th{background:var(--head);text-align:left;font-size:12px;font-weight:600;color:var(--text-2);
  padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
.th-in{display:flex;align-items:center;gap:6px}
.sort{display:inline-flex;flex-direction:column;gap:1px;cursor:pointer}
.sort svg{width:8px;height:5px;stroke:var(--text-3);fill:none;stroke-width:2.4}
.sort .up.on,.sort .dn.on{stroke:var(--text)}
.colmenu{width:13px;height:13px;stroke:var(--text-3);fill:none;stroke-width:2;cursor:pointer;margin-left:2px}
tbody td{padding:11px 12px;border-bottom:1px solid var(--line-2);font-size:12.5px;vertical-align:middle;white-space:nowrap}
tbody tr:hover{background:var(--row-h)}
.code{font-weight:600;color:#1f6fd6;text-decoration:none}
.code:hover{text-decoration:underline}
.itemcell .subname{color:var(--text-2);font-size:11.5px;margin-top:2px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grpcell{line-height:1.3}
.grpcell .gcode{display:block;font-weight:600;color:var(--text)}
.grpcell .gname{display:block;color:var(--text-2);font-size:11.5px}
.name{max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.muted{color:var(--text-2)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid}
.pill.on{background:var(--ok-bg);border-color:var(--ok-bd);color:var(--ok-ink)}
.pill.off{background:var(--off-bg);border-color:var(--off-bd);color:var(--off-ink)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.rowmenu{width:28px;height:28px;border:0;background:none;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.rowmenu:hover{background:var(--line-2);color:var(--text)}
.rowmenu svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* checkbox */
.cbx{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid #c4c9d0;border-radius:4px;background:#fff;cursor:pointer;position:relative;flex:none}
.cbx:checked{background:var(--lime);border-color:var(--lime-d)}
.cbx:checked::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;border:solid var(--lime-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
th.chk,td.chk{width:40px;padding-left:16px}
th.act,td.act{width:56px;text-align:center}

.empty{padding:48px 16px;text-align:center;color:var(--text-3)}
.empty svg{width:40px;height:40px;stroke:#cdd2d9;fill:none;stroke-width:1.5;margin:0 auto 10px}

/* pagination */
.pager{display:flex;align-items:center;justify-content:flex-end;gap:16px;padding:12px 16px;flex-wrap:wrap}
.pages{display:flex;align-items:center;gap:4px}
.pg{min-width:30px;height:30px;padding:0 8px;border:1px solid transparent;border-radius:7px;background:none;
  font-size:12.5px;font-weight:600;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center}
.pg:hover{background:var(--line-2)}
.pg.on{background:var(--lime);color:var(--lime-ink);border-color:var(--lime-d)}
.pg.nav svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.pg:disabled{opacity:.4;pointer-events:none}
.pg.dots{pointer-events:none}
.psize{display:flex;align-items:center;gap:8px;color:var(--text-2);font-size:12.5px}
.psize .sel-wrap svg{width:14px;height:14px}
.psize select{height:32px;padding:0 28px 0 10px;font-size:12.5px}
.goto{display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:12.5px}
.goto input{width:52px;height:32px;text-align:center}

/* add-item form */
.addhead{display:flex;align-items:center;gap:12px;padding:2px 2px 16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.backbtn{width:32px;height:32px;border:0;background:none;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer}
.backbtn:hover{background:var(--line-2)}
.backbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.addhead .ptitle{margin:0}
.addhead .sp{flex:1}
.btn.ghost-dim{color:var(--text-3);border-color:var(--btn-bd);background:#fff;cursor:default}
.btn.ghost-dim:hover{background:#fff}
.ctrl:disabled{background:#f3f4f6;color:var(--text-3);cursor:not-allowed}
.addcols{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);margin-bottom:20px}
.addcol{padding:0 26px 22px}
.addcol.left{border-right:1px solid var(--line);padding-left:2px}
.addcol.right{padding-right:2px}
.fsec{margin:0 0 16px;font-size:15px;font-weight:700}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.req{color:#e5484d;font-weight:600}
.chkfield{display:flex;align-items:center;height:38px}
.addplant{padding:0 2px 10px}
.plant-list{display:flex;flex-direction:column;gap:10px;max-width:430px}
select.selph{color:var(--text-3)}
select.selph.has-val{color:var(--text)}
select.selph option{color:var(--text)}
@media(max-width:860px){
  .sidebar{display:none}
  .filt-body{grid-template-columns:1fr}
  .user .nm{display:none}
  .addcols{grid-template-columns:1fr}
  .addcol.left{border-right:0;border-bottom:1px solid var(--line)}
  .addcol{padding:0 2px 20px}
  .f2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">

  <div class="sidebar">
    <div class="brand">
      <div class="logo-box">
        <svg class="brand-hex" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2 L21.5 7.6 L12 13 L2.5 7.6 Z" fill="#3cbdf5"/><path d="M12 13 L21.5 7.6 L21.5 16.4 L12 21.8 Z" fill="#1565b0"/><path d="M2.5 7.6 L12 13 L12 21.8 L2.5 16.4 Z" fill="#1e90d8"/></svg>
        <span class="brand-word"><span class="brand-dorco">Dorco</span><span class="brand-wms">WMS</span></span>
      </div>
    </div>
    <div class="cols">

  <!-- far-left icon rail -->
  <aside class="rail">
    <div class="rail-items">
      <button class="rail-b"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Search Menu</button>
      <button class="rail-b on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.3l2-1.6-2-3.4-2.4 1a7 7 0 00-2.2-1.3L14 2h-4l-.3 2.1A7 7 0 007.5 5.4l-2.4-1-2 3.4 2 1.6A7 7 0 005 12c0 .4 0 .9.1 1.3l-2 1.6 2 3.4 2.4-1a7 7 0 002.2 1.3L10 22h4l.3-2.1a7 7 0 002.2-1.3l2.4 1 2-3.4-2-1.6c.1-.4.1-.9.1-1.3z"/></svg>Thiết lập chung</button>
      <button class="rail-b"><svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M6 6L5 3H2"/></svg>Bán hàng</button>
      <button class="rail-b"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Quản lý hàng hóa</button>
      <button class="rail-b"><svg viewBox="0 0 24 24"><path d="M4 7h13M14 4l3 3-3 3"/><path d="M20 17H7M10 20l-3-3 3-3"/></svg>Giao dịch kho</button>
      <button class="rail-b"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1"/><circle cx="16" cy="7" r="2.3"/><path d="M4 17h3M13 17h7"/><circle cx="10" cy="17" r="2.3"/></svg>Điều chỉnh tồn kho</button>
      <button class="rail-b"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4-3 7-8 9-5-2-8-5-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>Cảnh báo tồn kho</button>
      <button class="rail-b"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Báo cáo</button>
    </div>
    <div class="rail-foot">
      <button aria-label="Thu gọn"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M16 9l-3 3 3 3"/></svg></button>
    </div>
  </aside>

  <!-- submenu column -->
  <aside class="sub">
    <div class="sub-title">Thiết lập chung</div>
    <div class="sub-scroll">
      <button class="grp"><span class="grp-l"><svg class="gi" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0112 0"/><path d="M16 6a3 3 0 010 6M19 20a6 6 0 00-3-5"/></svg><span>Phân quyền</span></span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="grp"><span class="grp-l"><svg class="gi" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-3h12v3"/></svg><span>Thiết lập tổ chức</span></span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="grp"><span class="grp-l"><svg class="gi" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16a3 3 0 016 0M15 10h3M15 14h3"/></svg><span>Đối tác kinh doanh</span></span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="grp open"><span class="grp-l"><svg class="gi" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Quản lý mặt hàng</span></span><svg class="chev" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
      <div class="children">
        <button class="child">Danh mục loại hàng</button>
        <button class="child">Từ điển thuộc tính</button>
        <button class="child">Nhóm hàng / Mẫu sản p...</button>
        <button class="child active">Danh mục mặt hàng</button>
        <button class="child">Đơn vị tính &amp; quy đổi đơ...</button>
        <button class="child">Tra cứu mặt hàng</button>

32012", "gname": "OB", "group": "32012 / OB", "type": "ROH2", "unit": "EA", "updated": "21/09/2026", "status": "active"}, {"code": "3249685", "name": "(FREE)SXF4001-PP KR MARKETING 6*12 OB", "gcode": "32012", "gname": "OB", "group": "32012 / OB", "type": "ROH2", "unit": "EA", "updated": "22/09/2026", "status": "active"}, {"code": "3249694", "name": "SXF4001-PP KR SAMPLING 24*4 OB", "gcode": "32012", "gname": "OB", "group": "32012 / OB", "type": "ROH2", "unit": "EA", "updated": "22/09/2026", "status": "active"}, {"code": "3249703", "name": "TNB200PK-20MP(10+10) ME STD OPP 1500m", "gcode": "32002", "gname": "OPP", "group": "32002 / OPP", "type": "ROH2", "unit": "ROL", "updated": "22/09/2026", "status": "active"}, {"code": "3249712", "name": "(PRM)TRC200BL-4&4P ME STD (4&4)*72 FILM", "gcode": "32003", "gname": "FILM", "group": "32003 / FILM", "type": "ROH2", "unit": "EA", "updated": "22/09/2026", "status": "active"}, {"code": "3249721", "name": "LTRA1001(U)-RB ME STD 36 IB", "gcode": "32011", "gname": "IB", "group": "32011 / IB", "type": "ROH2", "unit": "EA", "updated": "23/09/2026", "status": "active"}, {"code": "3249730", "name": "LTRA1002(U)-RB HABIBCO 36 CARD_BACKSEAL", "gcode": "32001", "gname": "CARD", "group": "32001 / CARD", "type": "ROH2", "unit": "EA", "updated": "24/09/2026", "status": "active"}, {"code": "3249739", "name": "(PRM)LSXC1005-PP HABIBCO 80 SB2", "gcode": "32010", "gname": "SB", "group": "32010 / SB", "type": "ROH2", "unit": "EA", "updated": "24/09/2026", "status": "active"}];
const GROUPS = ["31001 / Steel Material", "31002 / Resin", "31006 / MasterBatch(ETC)", "31009 / ETC", "32001 / CARD", "32002 / OPP", "32003 / FILM", "32004 / LB", "32008 / BT", "32009 / IBT", "32010 / SB", "32011 / IB", "32012 / OB", "32013 / DB", "32014 / PAD", "32015 / CV"];

const COLS = {code:'Mã mặt hàng',name:'Tên mặt hàng',status:'Trạng thái',group:'Nhóm hàng',type:'Loại hàng',unit:'ĐVT cơ sở',updated:'Cập nhật lúc'};

// build column headers with sort + col-menu icons
document.querySelectorAll('thead th[data-k]').forEach(th=>{
  const k=th.dataset.k;
  th.innerHTML='<span class="th-in"><span>'+COLS[k]+'</span>'
    +'<span class="sort" data-k="'+k+'"><svg class="up" viewBox="0 0 8 5"><path d="M1 4l3-3 3 3"/></svg><svg class="dn" viewBox="0 0 8 5"><path d="M1 1l3 3 3-3"/></svg></span>'
    +'<svg class="colmenu" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></span>';
});

// group filter options
const gSel=document.getElementById('fGroup');
GROUPS.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;gSel.appendChild(o);});

const state={text:'',status:'all',group:'all',sortK:null,sortDir:1,page:1,size:20,
             aText:'',aStatus:'all',aGroup:'all'};  // applied vs pending

const fText=document.getElementById('fText'),fStatus=document.getElementById('fStatus'),
      tbody=document.getElementById('tbody'),countEl=document.getElementById('count'),
      pagesEl=document.getElementById('pages');

function filtered(){
  let r=DATA.filter(d=>{
    if(state.aStatus!=='all' && d.status!==state.aStatus) return false;
    if(state.aGroup!=='all' && d.group!==state.aGroup) return false;
    if(state.aText){const q=state.aText.toLowerCase();
      if(!(d.code.toLowerCase().includes(q)||d.name.toLowerCase().includes(q))) return false;}
    return true;
  });
  if(state.sortK){
    r=r.slice().sort((a,b)=>{
      const sk=state.sortK==='item'?'code':state.sortK;
      let x=a[sk]||'',y=b[sk]||'';
      if(sk==='updated'){x=x.split('/').reverse().join('');y=y.split('/').reverse().join('');}
      return x>y?state.sortDir:x<y?-state.sortDir:0;
    });
  }
  return r;
}

function render(){
  const rows=filtered();
  const total=rows.length;
  const pageCount=Math.max(1,Math.ceil(total/state.size));
  if(state.page>pageCount) state.page=pageCount;
  const start=(state.page-1)*state.size;
  const slice=rows.slice(start,start+state.size);

  countEl.textContent=total.toLocaleString('vi-VN')+' bản ghi được tìm thấy';

  tbody.innerHTML='';
  if(!slice.length){
    tbody.innerHTML='<tr><td colspan="9"><div class="empty"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>Không tìm thấy hạng mục phù hợp. Thử điều chỉnh bộ lọc.</div></td></tr>';
  }else{
    const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    slice.forEach(d=>{
      const tr=document.createElement('tr');
      const pill=d.status==='active'
        ? '<span class="pill on"><span class="dot"></span>Hoạt động</span>'
        : '<span class="pill off"><span class="dot"></span>Ngừng sử dụng</span>';
      tr.innerHTML='<td class="chk"><input type="checkbox" class="cbx rowchk"></td>'
        +'<td><a class="code" href="#" onclick="return false">'+esc(d.code)+'</a></td>'
        +'<td class="name" title="'+esc(d.name)+'">'+esc(d.name)+'</td>'
        +'<td>'+pill+'</td>'
        +'<td class="grpcell"><span class="gcode">'+esc(d.gcode)+'</span><span class="gname">'+esc(d.gname)+'</span></td>'
        +'<td>'+esc(d.type)+'</td>'
        +'<td>'+esc(d.unit)+'</td>'
        +'<td class="muted">'+esc(d.updated)+'</td>'
        +'<td class="act"><button class="rowmenu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button></td>';
      tbody.appendChild(tr);
    });
  }
  document.getElementById('chkAll').checked=false;
  renderPager(pageCount);
}

function renderPager(pc){
  pagesEl.innerHTML='';
  const mk=(label,pg,{on=false,nav=false,dis=false,dots=false}={})=>{
    const b=document.createElement('button');
    b.className='pg'+(on?' on':'')+(nav?' nav':'')+(dots?' dots':'');
    b.innerHTML=label; if(dis)b.disabled=true;
    if(!dis&&!dots&&pg)b.onclick=()=>{state.page=pg;render();};
    pagesEl.appendChild(b);
  };
  mk('<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',state.page-1,{nav:true,dis:state.page===1});
  const win=[];
  const push=n=>win.push(n);
  if(pc<=7){for(let i=1;i<=pc;i++)push(i);}
  else{
    push(1);
    let s=Math.max(2,state.page-1),e=Math.min(pc-1,state.page+1);
    if(state.page<=3){s=2;e=4;}
    if(state.page>=pc-2){s=pc-3;e=pc-1;}
    if(s>2)push('...');
    for(let i=s;i<=e;i++)push(i);
    if(e<pc-1)push('...');
    push(pc);
  }
  win.forEach(n=> n==='...'?mk('…',null,{dots:true}):mk(String(n),n,{on:n===state.page}));
  mk('<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',state.page+1,{nav:true,dis:state.page===pc});
}

// ----- events -----
function apply(){state.aText=fText.value.trim();state.aStatus=fStatus.value;state.aGroup=gSel.value;state.page=1;render();}
document.getElementById('btnSearch').onclick=apply;
fText.addEventListener('keydown',e=>{if(e.key==='Enter')apply();});
fStatus.onchange=apply; gSel.onchange=apply;
document.getElementById('btnReset').onclick=()=>{
  fText.value='';fStatus.value='all';gSel.value='all';
  state.aText='';state.aStatus='all';state.aGroup='all';state.sortK=null;state.page=1;
  document.querySelectorAll('.sort svg').forEach(s=>s.classList.remove('on'));
  render();
};

document.querySelectorAll('.sort').forEach(s=>{
  s.onclick=()=>{
    const k=s.dataset.k;
    if(state.sortK===k)state.sortDir*=-1;else{state.sortK=k;state.sortDir=1;}
    document.querySelectorAll('.sort svg').forEach(x=>x.classList.remove('on'));
    s.querySelector(state.sortDir===1?'.up':'.dn').classList.add('on');
    render();
  };
});

document.getElementById('pSize').onchange=e=>{state.size=+e.target.value;state.page=1;render();};
document.getElementById('goto').addEventListener('keydown',e=>{
  if(e.key==='Enter'){const n=parseInt(e.target.value,10);if(n>=1){state.page=n;render();e.target.value='';}}
});
document.getElementById('chkAll').onchange=e=>{
  document.querySelectorAll('.rowchk').forEach(c=>c.checked=e.target.checked);
};

function showAdd(){document.getElementById('listView').style.display='none';document.getElementById('addView').style.display='block';document.querySelector('.scroll').scrollTop=0;}
function showList(){document.getElementById('addView').style.display='none';document.getElementById('listView').style.display='block';}
(function(){
  const ag=document.getElementById('aGroup');
  GROUPS.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;ag.appendChild(o);});
  const au=document.getElementById('aUnit');
  [...new Set(DATA.map(d=>d.unit))].filter(Boolean).sort().forEach(u=>{const o=document.createElement('option');o.value=u;o.textContent=u;au.appendChild(o);});
})();

render();
</script>
</body>
